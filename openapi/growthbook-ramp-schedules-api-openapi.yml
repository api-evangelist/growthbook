  /v1/ramp-schedules/{id}/steps:
    put:
      operationId: updateRampScheduleSteps
      summary: Update ramp schedule steps
      description: 'Fully replaces the steps array for a ramp schedule. Only allowed when the schedule is in a non-running, non-terminal state (`ready`, `pending`, or `paused`). Pause a running schedule first; restart a terminal schedule first.


        On a schedule attached to a rule this skips the revision review flow, so when the organization requires review anywhere it is limited to credentials that may bypass approval.


        **Step actions** (coverage/targeting patches) are not accepted here — they change the SDK payload and must go through a feature revision draft. Existing step actions are preserved for each position. Use `PUT /v2/features/:id/revisions/:version/rules/:ruleId/ramp-schedule` to modify coverage/targeting.'
      tags:
      - ramp-schedules
      parameters:
      - name: id
        in: path
        required: true
        description: ''
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                steps:
                  description: Full replacement of the steps array. Step-level coverage patches (`actions`) are intentionally excluded — those require a revision publish because they change the SDK payload. Use the revision flow to modify coverage/targeting; use this endpoint to update monitoring flags and hold conditions.
                  type: array
                  items:
                    type: object
                    properties:
                      actions:
                        description: Read-only; ignored on write. Accepted so a GET response can be posted back unchanged.
                      interval:
                        description: Hold duration in seconds before this step's gates are evaluated. `null` means no time gate.
                        anyOf:
                        - type: number
                          exclusiveMinimum: 0
                        - type: 'null'
                      monitored:
                        description: When true, this step runs A/B traffic analysis while active. Applies only to future steps — cannot be changed on the currently executing step.
                        type: boolean
                      holdConditions:
                        description: 'Additional gates that must clear before the step advances: `minSampleSize` and/or `requiresApproval`.'
                        type: object
                        properties:
                          minSampleSize:
                            type: integer
                            exclusiveMinimum: 0
                          requiresApproval:
                            type: boolean
                        additionalProperties: false
                      approvalNotes:
                        description: Optional notes shown to approvers when the step is awaiting approval.
                        anyOf:
                        - type: string
                        - type: 'null'
                    required:
                    - interval
                    additionalProperties: false
