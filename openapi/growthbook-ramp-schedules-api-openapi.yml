    healthSummary:
      description: Populated when monitoring is enabled and analysis data is available. Contains the current evaluator decision, aggregate traffic health, and per-metric status with effect sizes.
      type: object
      properties:
        safeToAdvance:
          description: 'True only when every hold condition is cleared: the step interval has elapsed, any required approval has been granted, min sample size is met, and all monitored metrics are within bounds. Equivalent to `decision === ''advance''`.'
          type: boolean
        decision:
          description: Current evaluator decision for the active step. Incorporates all hold conditions (timing, approval, min sample, metric health). When monitoring data is not yet available, the evaluator returns `hold` with a descriptive `decisionReason`.
          type: string
          enum:
          - advance
          - hold
          - rollback
          - pause
        decisionReason:
          description: Human-readable reason for a hold, rollback, or pause decision.
          type: string
        signals:
          description: All active health signals, not just the top-priority one. Useful for surfacing multiple concurrent issues (e.g. SRM + guardrail failing simultaneously). `healthy` is the sole entry when no issues are detected.
          type: array
          items:
            type: string
            enum:
            - guardrail-failing
            - signal-regression
            - srm
            - multiple-exposures
            - no-traffic
            - below-min-sample
            - healthy
            - awaiting-data
        snapshotAt:
          description: ISO timestamp of the most recent successful analysis snapshot.
          type: string
        traffic:
          description: Traffic health from the latest snapshot. Absent when no snapshot has been taken yet.
          type: object
          properties:
            totalUsers:
              description: Total unique users across all variations.
              type: number
            variationUnits:
              description: Per-variation user counts. Index 0 = baseline arm (users continuing to see the existing behavior — either the configured control value on a v1 safe rollout, or users passed through to subsequent rules / feature default on a v2 monitored ramp). Index 1 = treatment arm (users exposed to the new rollout value).
              type: array
              items:
                type: number
            srm:
              type: object
              properties:
                pValue:
                  description: SRM p-value from the traffic query.
                  type: number
                status:
                  description: '`failing` when p-value is below the org SRM threshold, indicating a traffic imbalance.'
                  type: string
                  enum:
                  - ok
                  - failing
              required:
              - pValue
              - status
              additionalProperties: false
            multipleExposures:
              type: object
              properties:
                count:
                  description: Number of users exposed to both variations.
                  type: number
                percent:
                  description: Fraction of total users with multiple exposures (0–1).
                  type: number
                status:
                  type: string
                  enum:
                  - ok
                  - warning
              required:
              - count
              - percent
              - status
              additionalProperties: false
          required:
          - totalUsers
          - variationUnits
          additionalProperties: false
        metrics:
          description: Per-metric health keyed by metric ID. Only includes metrics configured as guardrails or signals on this schedule.
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: object
            properties:
              id:
                description: Metric ID.
                type: string
              name:
                description: Human-readable metric name. Absent if the metric definition has been deleted.
                type: string
              status:
                description: '`failing` = statistically significant regression; `within-bounds` = no significant harm detected; `not-enough-data` = insufficient data to evaluate.'
                type: string
                enum:
                - failing
                - within-bounds
                - not-enough-data
              role:
                description: Whether this metric is a guardrail (triggers rollback on loss) or a signal (triggers hold on loss).
                type: string
                enum:
                - guardrail
                - signal
              relativeLift:
                description: Expected relative lift of the treatment arm vs the baseline arm (e.g. 0.05 = +5%). See `traffic.variationUnits` for what each arm represents.
                type: number
              absoluteLift:
                description: Absolute difference in conversion rate between the treatment and baseline arms.
                type: number
              ciHarmBound:
                description: One-tailed CI bound in the direction of potential harm. For normal metrics (higher is better) this is the lower CI bound; for inverse metrics (lower is better, e.g. errors, latency) this is the upper CI bound. Values further from zero in the harmful direction indicate greater potential regression.
                type: number
              pValue:
                description: Two-sided p-value for the metric effect. Only present when the stats engine produces a frequentist result.
                type: number
            required:
            - id
            - status
            - role
            additionalProperties: false
      required:
      - safeToAdvance
      - decision
      - signals
      - metrics
      additionalProperties: false
