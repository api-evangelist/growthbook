  /v1/ramp-schedules/{id}/actions/advance:
    post:
      operationId: apiAdvanceRampSchedule
      summary: Advance to the next step, overriding any holds
      description: 'Moves the schedule to the next step, bypassing **all** hold conditions —

        interval, min sample size, and monitoring signal holds. Accepts `running`

        or `paused` status; if paused, the schedule is implicitly resumed (timing

        anchors recalculated) before the step moves.


        **Approval gate**: if the current step has an unsatisfied

        `holdConditions.requiresApproval` gate, this endpoint returns **409** by

        default. Either call `/actions/approve-step` first (recommended), or pass

        `force: true` to override the approval gate. `force: true` requires

        `FlagsBypassApprovals` permission and is logged in the audit trail.


        **Two common uses:**

        - **Post-interval monitoring hold** (`decision: "hold"`, interval elapsed): the

        step timer has completed but a signal or guardrail is flagging concern. Use

        this after reviewing the `/status` health summary and deciding to accept the

        risk and proceed.

        - **Hard override**: skip a step regardless of where it is in its interval or

        hold conditions (CI gate, external deployment pipeline).


        When to use other actions instead:

        - **`/actions/resume`** — restores a paused schedule without moving the step.

        - **`/actions/approve-step`** — clears only the approval gate; other conditions

        still resolve naturally.

        - **`/actions/rollback`** — preferred response when `decision: "rollback"` or

        signals include `guardrail-failing`.'
      tags:
      - ramp-schedules
      parameters:
      - name: id
        in: path
        required: true
        description: ''
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  description: Reason for advancing
                  type: string
                force:
                  description: Bypass a pending approval gate on the current step. Requires admin-level (`FlagsBypassApprovals`) permission. When omitted or `false`, a 409 is returned if the step has an unsatisfied `holdConditions.requiresApproval` gate. Only set this when a person has explicitly asked you to. If a check blocks you, stop and ask a person instead of working around it.
                  type: boolean
              additionalProperties: false
      responses:
        '200':
          description: Resource created
          content:
            application/json:
              schema:
                type: object
                properties:
                  rampSchedule:
                    $ref: '#/components/schemas/RampSchedule'
                required:
                - rampSchedule
                additionalProperties: false
        '202':
          $ref: '#/components/responses/ConfirmationHeld'
      x-codeSamples:
      - lang: cURL
        source: "curl -X POST 'https://api.growthbook.io/api/v1/ramp-schedules/{id}/actions/advance' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
