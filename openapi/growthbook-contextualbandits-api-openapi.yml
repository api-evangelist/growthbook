openapi: 3.2.0
info:
  version: 5.1.0
  title: GrowthBook REST Contextual Bandits API
  description: 'GrowthBook offers a full REST API for interacting with the application. Request data can use either JSON or Form data encoding (with proper `Content-Type` headers). All response bodies are JSON-encoded. The API base URL for GrowthBook Cloud is `https://api.growthbook.io/api`. For self-hosted deployments, it is the same as your API_HOST environment variable (defaults to `http://localhost:3100/api`). The rest of these docs will assume you are using GrowthBook Cloud. ## Versioning


    Endpoints are versioned by path prefix:


    - `/v1/...` — stable, widely-supported endpoints

    - `/v2/...` — updated endpoints with improved shapes (e.g. unified per-rule environment scope for feature flags)


    New integrations should prefer v2 where available. Feature-flag and metric v1 routes are deprecated: they are tagged **LEGACY** in the sidebar and collapsed by default. Use the matching v2 group when both exist. ## Authentication


    We support both the HTTP Basic and Bearer authentication schemes for convenience. You first need to generate a new API Key in GrowthBook. Different keys have different permissions:


    - **Personal Access Tokens**: These are sensitive and provide the same level of access as the user has to an organization, or less if the token''s permissions are limited. These can be created by going to `Personal Access Tokens` under your user menu. Members with the API Keys **Manage members'' tokens** permission can disable a member''s token under `Settings -> Manage PATs`, and admins can require new tokens to expire within a maximum lifetime. - **Secret Keys**: These are sensitive and provide the level of access of the role they are given, which can be any built-in or custom role, with optional per-project role overrides and environment limits. Managing Secret Keys on behalf of an organization takes the API Keys permissions. These can be created by going to `Settings -> API Keys`, where Admins can also require new Secret Keys to expire within a maximum lifetime. If using HTTP Basic auth, pass the Secret Key as the username and leave the password blank (when using curl, add `:` at the end of the secret to indicate an empty password)


    ```bash

    curl https://api.growthbook.io/api/v1/features \

    -u secret_abc123DEF456:

    ```


    If using Bearer auth, pass the Secret Key as the token:


    ```bash

    curl https://api.growthbook.io/api/v1/features \

    -H "Authorization: Bearer secret_abc123DEF456"

    ```


    If a key has an expiration date, every response includes it in the `X-GrowthBook-Key-Expires-At` header (ISO 8601), so scripts can warn before the key stops working. Requests made with an expired key fail with a `401` that says where to create a replacement. See Expiration for choosing a key''s expiration, the warnings before it lapses, and the organization policies. ## Naming who asked


    Requests made with a Secret Key may add an `X-GrowthBook-Requested-By` header naming the organization member who asked for the change, as a user id or an email address. History, revision logs and webhooks show that member next to the key. Each key''s settings under `Settings -> API Keys`:


    - **Header**: **Optional** (the default) uses the header when it''s sent, **Required** rejects requests without it, and **Rejected** rejects requests that send it, each with a 400. - **Permissions**, when a member is named:

    - **Assume member''s role** (the default): the request acts as that member, with only what both the key and the member can do, so the header can narrow a key but never widen it. Drafts, owners, `mine` filters and reviews are the member''s. The member''s rights over their own drafts, comments and verdicts apply only where the key''s own role allows the same action. - **Use key''s role**: the key acts as itself, with its own permissions, and the name is only recorded in history. Drafts, verdicts and ownership are the key''s, as when no member is named.'
servers:
- url: https://api.growthbook.io/api
  description: GrowthBook Cloud
- url: https://{domain}/api
  description: Self-hosted GrowthBook
  variables:
    domain:
      default: localhost:3100
      description: Your self-hosted GrowthBook host (and port)
security:
- bearerAuth: []
- basicAuth: []
tags:
- name: ContextualBandits
  x-displayName: Contextual Bandits
  description: ''
paths:
  /v1/contextual-bandits/{id}/current:
    get:
      operationId: getContextualBanditCurrentWeights
      summary: Get current Contextual Bandit leaf weights and latest event
      tags:
      - ContextualBandits
      parameters:
      - name: id
        in: path
        required: true
        description: The Contextual Bandit id
        schema:
          description: The Contextual Bandit id
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  currentLeafWeights:
                    type: array
                    items:
                      $ref: '#/components/schemas/currentLeafWeights'
                  latestEvent:
                    anyOf:
                    - type: object
                      properties:
                        id:
                          type: string
                        contextualBandit:
                          type: string
                        snapshotId:
                          type: string
                        weightsWereUpdated:
                          type: boolean
                        degreesOfFreedom:
                          type: integer
                          minimum: 0
                        dateCreated:
                          type: string
                      required:
                      - id
                      - contextualBandit
                      - snapshotId
                      - weightsWereUpdated
                      - dateCreated
                      additionalProperties: false
                    - type: 'null'
                required:
                - latestEvent
                additionalProperties: false
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v1/contextual-bandits/{id}/current' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v1/contextual-bandits/{id}/snapshots:
    get:
      operationId: listContextualBanditSnapshots
      summary: List Contextual Bandit snapshots
      tags:
      - ContextualBandits
      parameters:
      - name: id
        in: path
        required: true
        description: The Contextual Bandit id
        schema:
          description: The Contextual Bandit id
          type: string
      - name: limit
        in: query
        description: ''
        schema:
          type: integer
          exclusiveMinimum: 0
          maximum: 100
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshots:
                    type: array
                    items:
                      $ref: '#/components/schemas/snapshots'
                required:
                - snapshots
                additionalProperties: false
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v1/contextual-bandits/{id}/snapshots' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v1/contextual-bandits/{id}/snapshots/{snapshotId}:
    get:
      operationId: getContextualBanditSnapshot
      summary: Get a single Contextual Bandit snapshot
      tags:
      - ContextualBandits
      parameters:
      - name: id
        in: path
        required: true
        description: The Contextual Bandit id
        schema:
          description: The Contextual Bandit id
          type: string
      - $ref: '#/components/parameters/snapshotId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshot:
                    $ref: '#/components/schemas/snapshots'
                required:
                - snapshot
                additionalProperties: false
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v1/contextual-bandits/{id}/snapshots/{snapshotId}' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v1/contextual-bandits/{id}/events:
    get:
      operationId: listContextualBanditEvents
      summary: List Contextual Bandit weight-update events
      tags:
      - ContextualBandits
      parameters:
      - name: id
        in: path
        required: true
        description: The Contextual Bandit id
        schema:
          description: The Contextual Bandit id
          type: string
      - name: limit
        in: query
        description: ''
        schema:
          type: integer
          exclusiveMinimum: 0
          maximum: 100
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/events'
                required:
                - events
                additionalProperties: false
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v1/contextual-bandits/{id}/events' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v1/contextual-bandits/{id}/events/{eventId}:
    get:
      operationId: getContextualBanditEvent
      summary: Get a single Contextual Bandit weight-update event
      tags:
      - ContextualBandits
      parameters:
      - name: id
        in: path
        required: true
        description: The Contextual Bandit id
        schema:
          description: The Contextual Bandit id
          type: string
      - $ref: '#/components/parameters/eventId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  event:
                    $ref: '#/components/schemas/events'
                required:
                - event
                additionalProperties: false
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v1/contextual-bandits/{id}/events/{eventId}' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v1/contextual-bandits/{id}/results:
    get:
      operationId: getContextualBanditResults
      summary: Get latest Contextual Bandit results
      description: Returns the latest contextual-bandit stats engine output (per-context responses tagged with their leaf, the per-leaf targeting conditions, and per-leaf aggregated stats), the overall (marginal) variation weights across all contexts, the SRM of the most recent run, and the status of the most recent snapshot run for the contextual bandit. Same payload the GrowthBook UI uses to render the contextual bandit results table.
      tags:
      - ContextualBandits
      parameters:
      - name: id
        in: path
        required: true
        description: The Contextual Bandit id
        schema:
          description: The Contextual Bandit id
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  contextualBanditSnapshot:
                    anyOf:
                    - type: object
                      properties:
                        attributes:
                          type: array
                          items:
                            type: string
                        responses:
                          type: array
                          items: {}
                        leaf_map:
                          type: array
                          items: {}
                        leaf_stats:
                          type: array
                          items: {}
                        sse_trajectory:
                          type: array
                          items: {}
                        bic_trajectory:
                          type: array
                          items: {}
                      required:
                      - attributes
                      - responses
                      additionalProperties: false
                    - type: 'null'
                  overallWeights:
                    anyOf:
                    - type: array
                      items:
                        type: object
                        properties:
                          variationId:
                            type: string
                          weight:
                            anyOf:
                            - type: number
                            - type: 'null'
                        required:
                        - variationId
                        - weight
                        additionalProperties: false
                    - type: 'null'
                  results:
                    anyOf:
                    - type: object
                      properties:
                        attributes:
                          type: array
                          items:
                            type: string
                        sseTrajectory:
                          type: array
                          items:
                            type: object
                            properties:
                              numSplits:
                                type: integer
                                minimum: 0
                              totalSse:
                                type: number
                              split:
                                type: object
                                properties:
                                  leafClauses:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        attribute:
                                          type: string
                                        levels:
                                          type: array
                                          items:
                                            type: string
                                        operator:
                                          type: string
                                          enum:
                                          - in
                                          - not in
                                      required:
                                      - attribute
                                      - levels
                                      - operator
                                      additionalProperties: false
                                  attribute:
                                    type: string
                                  leftLevels:
                                    type: array
                                    items:
                                      type: string
                                  rightLevels:
                                    type: array
                                    items:
                                      type: string
                                required:
                                - leafClauses
                                - attribute
                                - leftLevels
                                - rightLevels
                                additionalProperties: false
                            required:
                            - numSplits
                            - totalSse
                            additionalProperties: false
                        overall:
                          type: object
                          properties:
                            variations:
                              type: array
                              items:
                                type: object
                                properties:
                                  variationId:
                                    type: string
                                  variationName:
                                    type: string
                                  weight:
                                    anyOf:
                                    - type: number
                                    - type: 'null'
                                  mean:
                                    anyOf:
                                    - type: number
                                    - type: 'null'
                                  users:
                                    anyOf:
                                    - type: number
                                    - type: 'null'
                                required:
                                - variationId
                                - weight
                                - mean
                                - users
                                additionalProperties: false
                          required:
                          - variations
                          additionalProperties: false
                        leaves:
                          type: array
                          items:
                            type: object
                            properties:
                              leafId:
                                type: integer
                              updateMessage:
                                anyOf:
                                - type: string
                                - type: 'null'
                              error:
                                anyOf:
                                - type: string
                                - type: 'null'
                              clauses:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    attribute:
                                      type: string
                                    levels:
                                      type: array
                                      items:
                                        type: string
                                    operator:
                                      type: string
                                      enum:
                                      - in
                                      - not in
                                  required:
                                  - attribute
                                  - levels
                                  - operator
                                  additionalProperties: false
                              variations:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    variationId:
                                      type: string
                                    variationName:
                                      type: string
                                    weight:
                                      anyOf:
                                      - type: number
                                      - type: 'null'
                                    bestArmProbability:
                                      anyOf:
                                      - type: number
                                      - type: 'null'
                                    users:
                                      anyOf:
                                      - type: number
                                      - type: 'null'
                                    mean:
                                      anyOf:
                                      - type: number
                                      - type: 'null'
                                    variance:
                                      anyOf:
                                      - type: number
                                      - type: 'null'
                                  required:
                                  - variationId
                                  - weight
                                  - bestArmProbability
                                  - users
                                  - mean
                                  - variance
                                  additionalProperties: false
                              contexts:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    attributes:
                                      type: object
                                      propertyNames:
                                        type: string
                                      additionalProperties:
                                        type: string
                                    variations:
                                      type: array
                                      items:
                                        type: object
                                        properties:
                                          variationId:
                                            type: string
                                          variationName:
                                            type: string
                                          users:
                                            anyOf:
                                            - type: number
                                            - type: 'null'
                                          mean:
                                            anyOf:
                                            - type: number
                                            - type: 'null'
                                          variance:
                                            anyOf:
                                            - type: number
                                            - type: 'null'
                                        required:
                                        - variationId
                                        - users
                                        - mean
                                        - variance
                                        additionalProperties: false
                                  required:
                                  - attributes
                                  - variations
                                  additionalProperties: false
                            required:
                            - leafId
                            - updateMessage
                            - error
                            - clauses
                            - variations
                            - contexts
                            additionalProperties: false
                      required:
                      - attributes
                      - sseTrajectory
                      - overall
                      - leaves
                      additionalProperties: false
                    - type: 'null'
                  latest:
                    anyOf:
                    - type: object
                      properties:
                        id:
                          type: string
                        status:
                          type: string
                          enum:
                          - running
                          - success
                          - error
                        error:
                          type: string
                        queries:
                          type: array
                          items:
                            type: object
                            properties:
                              query:
                                type: string
                              status:
                                type: string
                                enum:
                                - queued
                                - running
                                - failed
                                - partially-succeeded
                                - succeeded
                              name:
                                type: string
                            required:
                            - query
                            - status
                            - name
                            additionalProperties: false
                        runStarted:
                          anyOf:
                          - type: string
                          - type: 'null'
                        dateCreated:
                          type: string
                        multipleExposures:
                          type: number
                        type:
                          type: string
                        triggeredBy:
                          type: string
                        srm:
                          anyOf:
                          - type: object
                            properties:
                              statistic:
                                type: number
                              pValue:
                                type: number
                              degreesOfFreedom:
                                type: integer
                                minimum: 0
                            required:
                            - statistic
                            - pValue
                            - degreesOfFreedom
                            additionalProperties: false
                          - type: 'null'
                      required:
                      - id
                      - status
                      - error
                      - queries
                      - runStarted
                      - dateCreated
                      - multipleExposures
                      - type
                      - triggeredBy
                      - srm
                      additionalProperties: false
                    - type: 'null'
                required:
                - contextualBanditSnapshot
                - overallWeights
                - results
                - latest
                additionalProperties: false
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v1/contextual-bandits/{id}/results' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v1/contextual-bandits/{id}/linked-features:
    get:
      operationId: getContextualBanditLinkedFeatures
      summary: Get features linked to a Contextual Bandit
      description: Returns the features that reference this contextual bandit via a `contextual-bandit-ref` rule, enriched with each feature's live/draft state, per-environment rule state, and variation values. Same payload the GrowthBook UI uses to render the Linked Features section.
      tags:
      - ContextualBandits
      parameters:
      - name: id
        in: path
        required: true
        description: The Contextual Bandit id
        schema:
          description: The Contextual Bandit id
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  linkedFeatures:
                    type: array
                    items: {}
                  environments:
                    type: array
                    items:
                      type: string
                required:
                - linkedFeatures
                - environments
                additionalProperties: false
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v1/contextual-bandits/{id}/linked-features' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v1/contextual-bandits/{id}/linked-feature/{featureId}:
    post:
      operationId: addContextualBanditLinkedFeature
      summary: Link a feature to a Contextual Bandit
      description: Adds a `contextual-bandit-ref` rule to the bottom of the feature's rule list and links the feature to this contextual bandit. The rule lands in a draft revision that auto-publishes when the contextual bandit starts, unless `autoPublish` is set. Targeting (condition, Saved Groups, prerequisites, coverage) is inherited from the contextual bandit and cannot be set on the rule.
      tags:
      - ContextualBandits
      parameters:
      - name: id
        in: path
        required: true
        description: The Contextual Bandit id
        schema:
          description: The Contextual Bandit id
          type: string
      - name: featureId
        in: path
        required: true
        description: The linked feature id
        schema:
          description: The linked feature id
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                variations:
                  description: One entry per Contextual Bandit variation. Every variation must be covered exactly once.
                  minItems: 1
                  type: array
                  items:
                    type: object
                    properties:
                      variationId:
                        description: Id of the Contextual Bandit variation.
                        type: string
                      value:
                        description: Feature value served for this variation.
                        type: string
                      config:
                        description: Key of the config backing this value, or null when the value is not config-backed. The config supplies the base JSON (and its schema); the value is an override patch merged on top.
                        anyOf:
                        - type: string
                        - type: 'null'
                    required:
                    - variationId
                    - value
                    additionalProperties: false
                description:
                  type: string
                enabled:
                  type: boolean
                allEnvironments:
                  description: Apply the rule in every environment. Defaults to true.
                  type: boolean
                environments:
                  description: Environments to apply the rule in when not all.
                  type: array
                  items:
                    type: string
                allProjects:
                  type: boolean
                projects:
                  type: array
                  items:
                    type: string
                autoPublish:
                  description: Publish the resulting revision immediately instead of leaving it as a draft.
                  type: boolean
                draftVersion:
                  description: Add the rule to this existing draft revision instead of starting a new one.
                  type: integer
              required:
              - variations
              additionalProperties: false
      responses:
        '200':
          description: Resource created
          content:
            application/json:
              schema:
                type: object
                properties:
                  featureId:
                    type: string
                  ruleId:
                    type: string
                  revisionVersion:
                    type: number
                  published:
                    type: boolean
                required:
                - featureId
                - ruleId
                - revisionVersion
                - published
                additionalProperties: false
        '202':
          $ref: '#/components/responses/ConfirmationHeld'
      x-codeSamples:
      - lang: cURL
        source: "curl -X POST 'https://api.growthbook.io/api/v1/contextual-bandits/{id}/linked-feature/{featureId}' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
    put:
      operationId: updateContextualBanditLinkedFeature
      summary: Replace a Contextual Bandit's rule on a linked feature
      description: Replaces every `contextual-bandit-ref` rule pointing at this contextual bandit on the feature, keeping each rule's id and position in the rule list. Every field is replaced, so omitted optional fields revert to their defaults. Returns a 400 when the feature has no such rule on the target revision, or when it has several that are not identical to each other. The change lands in a draft revision that auto-publishes when the contextual bandit starts, unless `autoPublish` is set. Targeting (condition, Saved Groups, prerequisites, coverage) is inherited from the contextual bandit and cannot be set on the rule.
      tags:
      - ContextualBandits
      parameters:
      - name: id
        in: path
        required: true
        description: The Contextual Bandit id
        schema:
          description: The Contextual Bandit id
          type: string
      - name: featureId
        in: path
        required: true
        description: The linked feature id
        schema:
          description: The linked feature id
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                variations:
                  description: One entry per Contextual Bandit variation. Every variation must be covered exactly once.
                  minItems: 1
                  type: array
                  items:
                    type: object
                    properties:
                      variationId:
                        description: Id of the Contextual Bandit variation.
                        type: string
                      value:
                        description: Feature value served for this variation.
                        type: string
                      config:
                        description: Key of the config backing this value, or null when the value is not config-backed. The config supplies the base JSON (and its schema); the value is an override patch merged on top.
                        anyOf:
                        - type: string
                        - type: 'null'
                    required:
                    - variationId
                    - value
                    additionalProperties: false
                description:
                  type: string
                enabled:
                  type: boolean
                allEnvironments:
                  description: Apply the rule in every environment. Defaults to true.
                  type: boolean
                environments:
                  description: Environments to apply the rule in when not all.
                  type: array
                  items:
                    type: string
                allProjects:
                  type: boolean
                projects:
                  type: array
                  items:
                    type: string
                autoPublish:
                  description: Publish the resulting revision immediately instead of leaving it as a draft.
                  type: boolean
                draftVersion:
                  description: Update the rule on this existing draft revision instead of starting a new one.
                  type: integer
              required:
              - variations
              additionalProperties: false
      responses:
        '200':
          description: Resource updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  featureId:
                    type: string
                  ruleIds:
                    type: array
                    items:
                      type: string
                  revisionVersion:
                    type: number
                  published:
                    type: boolean
                required:
                - featureId
                - ruleIds
                - revisionVersion
                - published
                additionalProperties: false
        '202':
          $ref: '#/components/responses/ConfirmationHeld'
      x-codeSamples:
      - lang: cURL
        source: "curl -X PUT 'https://api.growthbook.io/api/v1/contextual-bandits/{id}/linked-feature/{featureId}' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
    delete:
      operationId: deleteContextualBanditLinkedFeature
      summary: Unlink a feature from a Contextual Bandit
      description: Removes every `contextual-bandit-ref` rule pointing at this contextual bandit from the feature and drops the feature from the bandit's linked-feature list. The rule removal lands in a draft revision unless `autoPublish` is set. When the feature has no such rule left, only the linkage is cleared.
      tags:
      - ContextualBandits
      parameters:
      - name: id
        in: path
        required: true
        description: The Contextual Bandit id
        schema:
          description: The Contextual Bandit id
          type: string
      - name: featureId
        in: path
        required: true
        description: The linked feature id
        schema:
          description: The linked feature id
          type: string
      - $ref: '#/components/parameters/autoPublish'
      - $ref: '#/components/parameters/draftVersion'
      responses:
        '200':
          description: Resource deleted
          content:
            application/json:
