  parameters:
    eventId:
      name: eventId
      in: path
      required: true
      description: The event id
      schema:
        description: The event id
        type: string
    snapshotId:
      name: snapshotId
      in: path
      required: true
      description: The snapshot id
      schema:
        description: The snapshot id
        type: string
    draftVersion:
      name: draftVersion
      in: query
      description: Remove the rule from this existing draft revision instead of live. Required when the rule hasn't been published yet — omitting it targets the live revision, which has nothing to remove.
      schema:
        description: Remove the rule from this existing draft revision instead of live. Required when the rule hasn't been published yet — omitting it targets the live revision, which has nothing to remove.
        type: integer
    autoPublish:
      name: autoPublish
      in: query
      description: Publish the resulting revision immediately instead of leaving it as a draft.
      schema:
        description: Publish the resulting revision immediately instead of leaving it as a draft.
        anyOf:
        - type: string
          const: 'true'
        - type: string
          const: 'false'
        - type: string
          const: '0'
        - type: string
          const: '1'
        - type: boolean
  responses:
    ConfirmationHeld:
      description: Held until a person confirms it in GrowthBook. Poll the Location until the confirmation completes.
      headers:
        Location:
          description: The confirmation to poll
          schema:
            type: string
        Retry-After:
          description: Seconds to wait before polling
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConfirmationHeld'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'If using Bearer auth, pass the Secret Key as the token:

        ```bash

        curl https://api.growthbook.io/api/v1/features   -H "Authorization: Bearer secret_abc123DEF456"

        ```

        '
    basicAuth:
      type: http
      scheme: basic
      description: 'If using HTTP Basic auth, pass the Secret Key as the username and leave the password blank:

        ```bash

        curl https://api.growthbook.io/api/v1/features   -u secret_abc123DEF456:

        # The ":" at the end stops curl from asking for a password

        ```

        '
