      name: skipPagination
      in: query
      description: 'If true, return all matching items and ignore limit/offset.

        Self-hosted only. Has no effect unless API_ALLOW_SKIP_PAGINATION is set to true or 1.'
      schema:
        description: 'If true, return all matching items and ignore limit/offset.

