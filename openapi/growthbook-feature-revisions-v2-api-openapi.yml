          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  liveVersion:
                    description: The current live version the merge was computed against. Echo this back as `expectedLiveVersion` when rebasing.
                    type: number
                  draftDateUpdated:
                    format: date-time
                    description: The draft's last-modified timestamp at merge time. Echo this back as `expectedDraftDateUpdated` when rebasing to guard against concurrent draft edits.
                    type: string
                  conflicts:
                    type: array
                    items:
                      $ref: '#/components/schemas/conflicts'
                  result:
                    type: object
                    properties:
                      defaultValue:
                        type: string
                      rules:
                        type: array
                        items: {}
                      environmentsEnabled:
                        type: object
                        propertyNames:
