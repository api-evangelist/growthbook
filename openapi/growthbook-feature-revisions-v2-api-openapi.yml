          type: string
          enum:
          - ignoreWarnings
          - skipSchemaValidation
          - skipHooks
          - bypassApprovalPermission
          - restApiBypassesReviews
          - revertsBypassApproval
      required:
      - type
      - outcome
      - via
      additionalProperties: false
    FeatureSafeRolloutRule:
      allOf:
      - description: 'Common fields shared by all feature rule types. Specific rule types extend

          this base with their own required properties (value, coverage, etc.).

          '
        type: object
        properties:
          description:
            type: string
            maxLength: 10000
          condition:
            type: string
          id:
            type: string
          enabled:
            type: boolean
          scheduleRules:
            description: Simple time-based on/off schedule for this rule
            type: array
            items:
              $ref: '#/components/schemas/ScheduleRule'
          scheduleType:
            description: 'UI hint for which scheduling mode is active:

              - `none` – no schedule

              - `schedule` – simple time-based enable/disable via `scheduleRules`

              - `ramp` – multi-step ramp-up controlled by an associated RampSchedule document

              '
            type: string
            enum:
            - none
            - schedule
            - ramp
          rampScheduleId:
            description: ID of the active RampSchedule document controlling this rule. Present when `scheduleType` is `ramp` and a live schedule exists.
            type: string
          savedGroupTargeting:
            type: array
            items:
              type: object
              properties:
                matchType:
                  type: string
                  enum:
                  - all
                  - any
                  - none
                savedGroups:
                  type: array
                  items:
                    type: string
              required:
              - matchType
              - savedGroups
              additionalProperties: false
          prerequisites:
            type: array
            items:
              type: object
              properties:
                id:
                  description: Feature ID of the prerequisite
                  type: string
                condition:
                  type: string
              required:
              - id
              - condition
              additionalProperties: false
          allProjects:
            description: When true (the default) the rule applies to every project the feature is delivered to. When false the rule is limited to `projects`.
            type: boolean
          projects:
            description: Project IDs this rule is scoped to when `allProjects` is false. An empty array scopes the rule to no project.
            type: array
            items:
              type: string
        required:
        - description
        - id
        - enabled
        additionalProperties: false
      - type: object
        properties:
          type:
            type: string
            const: safe-rollout
          controlValue:
            type: string
          variationValue:
            type: string
          seed:
            type: string
          hashAttribute:
            type: string
          trackingKey:
            type: string
          safeRolloutId:
            type: string
          status:
            type: string
            enum:
            - running
            - released
            - rolled-back
            - stopped
        required:
        - type
        - controlValue
        - variationValue
        additionalProperties: false
    Experiment_Rule:
      description: An experiment rule that links a feature value to an existing experiment.
      type: object
      properties:
        description:
          description: Short note on why the rule exists (e.g. `Beta testers only`).
          type: string
        enabled:
          type: boolean
        condition:
          type: string
        savedGroups:
          type: array
          items:
