      description: 'Submits an `approve`, `request-changes`, or `comment` review on the draft. The verdict belongs to whoever the request acts as; see Naming who asked. No one can rule on a draft they created. Contributors cannot approve their own drafts when `blockSelfApproval` is enabled.


