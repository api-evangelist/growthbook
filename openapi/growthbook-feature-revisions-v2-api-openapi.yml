      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scheduledPublishAt:
                  description: When to publish, as an RFC3339 timestamp (e.g. `2026-01-31T09:00:00Z` or `2026-01-31T02:00:00-07:00`), or `null` to cancel a pending schedule.
