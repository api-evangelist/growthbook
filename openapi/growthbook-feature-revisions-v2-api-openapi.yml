      - name: id
        in: path
        required: true
        description: ''
        schema:
          type: string
      - $ref: '#/components/parameters/version'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  description: Markdown. What changed and why, for reviewers. Replaces the draft's comment; leaving it out clears it.
                  type: string
                autoPublishOnApproval:
                  type: boolean
                scheduledPublishAt:
                  anyOf:
                  - type: string
                    format: date-time
                  - type: 'null'
                scheduledPublishLockEdits:
                  type: boolean
                scheduledPublishLockOthers:
                  type: boolean
              additionalProperties: false
      responses:
        '200':
          description: Resource created
          content:
            application/json:
              schema:
                type: object
                properties:
                  revision:
                    $ref: '#/components/schemas/FeatureRevisionV2'
                required:
                - revision
                additionalProperties: false
        '202':
          $ref: '#/components/responses/ConfirmationHeld'
