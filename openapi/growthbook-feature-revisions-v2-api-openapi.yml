openapi: 3.2.0
info:
  version: 5.1.0
  title: GrowthBook REST Feature Revisions V2 API
  description: 'GrowthBook offers a full REST API for interacting with the application. Request data can use either JSON or Form data encoding (with proper `Content-Type` headers). All response bodies are JSON-encoded. The API base URL for GrowthBook Cloud is `https://api.growthbook.io/api`. For self-hosted deployments, it is the same as your API_HOST environment variable (defaults to `http://localhost:3100/api`). The rest of these docs will assume you are using GrowthBook Cloud. ## Versioning


    Endpoints are versioned by path prefix:


    - `/v1/...` — stable, widely-supported endpoints

    - `/v2/...` — updated endpoints with improved shapes (e.g. unified per-rule environment scope for feature flags)


    New integrations should prefer v2 where available. Feature-flag and metric v1 routes are deprecated: they are tagged **LEGACY** in the sidebar and collapsed by default. Use the matching v2 group when both exist. ## Authentication


    We support both the HTTP Basic and Bearer authentication schemes for convenience. You first need to generate a new API Key in GrowthBook. Different keys have different permissions:


    - **Personal Access Tokens**: These are sensitive and provide the same level of access as the user has to an organization, or less if the token''s permissions are limited. These can be created by going to `Personal Access Tokens` under your user menu. Members with the API Keys **Manage members'' tokens** permission can disable a member''s token under `Settings -> Manage PATs`, and admins can require new tokens to expire within a maximum lifetime. - **Secret Keys**: These are sensitive and provide the level of access of the role they are given, which can be any built-in or custom role, with optional per-project role overrides and environment limits. Managing Secret Keys on behalf of an organization takes the API Keys permissions. These can be created by going to `Settings -> API Keys`, where Admins can also require new Secret Keys to expire within a maximum lifetime. If using HTTP Basic auth, pass the Secret Key as the username and leave the password blank (when using curl, add `:` at the end of the secret to indicate an empty password)


    ```bash

    curl https://api.growthbook.io/api/v1/features \

    -u secret_abc123DEF456:

    ```


    If using Bearer auth, pass the Secret Key as the token:


    ```bash

    curl https://api.growthbook.io/api/v1/features \

    -H "Authorization: Bearer secret_abc123DEF456"

    ```


    If a key has an expiration date, every response includes it in the `X-GrowthBook-Key-Expires-At` header (ISO 8601), so scripts can warn before the key stops working. Requests made with an expired key fail with a `401` that says where to create a replacement. See Expiration for choosing a key''s expiration, the warnings before it lapses, and the organization policies. ## Naming who asked


    Requests made with a Secret Key may add an `X-GrowthBook-Requested-By` header naming the organization member who asked for the change, as a user id or an email address. History, revision logs and webhooks show that member next to the key. Each key''s settings under `Settings -> API Keys`:


    - **Header**: **Optional** (the default) uses the header when it''s sent, **Required** rejects requests without it, and **Rejected** rejects requests that send it, each with a 400. - **Permissions**, when a member is named:

    - **Assume member''s role** (the default): the request acts as that member, with only what both the key and the member can do, so the header can narrow a key but never widen it. Drafts, owners, `mine` filters and reviews are the member''s. The member''s rights over their own drafts, comments and verdicts apply only where the key''s own role allows the same action. - **Use key''s role**: the key acts as itself, with its own permissions, and the name is only recorded in history. Drafts, verdicts and ownership are the key''s, as when no member is named.'
servers:
- url: https://api.growthbook.io/api
  description: GrowthBook Cloud
- url: https://{domain}/api
  description: Self-hosted GrowthBook
  variables:
    domain:
      default: localhost:3100
      description: Your self-hosted GrowthBook host (and port)
security:
- bearerAuth: []
- basicAuth: []
tags:
- name: feature-revisions-v2
  x-displayName: Feature Revisions
  description: 'Draft revisions for feature flags, including rules, scheduling, and approval workflows.


    Revision `rules` is a flat array with per-rule scope fields.'
paths:
  /v2/feature-revisions:
    get:
      operationId: listRevisionsV2
      summary: List revisions across all features
      description: Returns a paginated list of feature revisions across all features in the organization. Use the `featureId` query parameter to filter to a single feature. Revision `rules` is a flat array with per-rule scope.
      tags:
      - feature-revisions-v2
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/skipPagination'
      - $ref: '#/components/parameters/featureId'
      - $ref: '#/components/parameters/status'
      - $ref: '#/components/parameters/author'
      - name: mine
        in: query
        description: If true, return only revisions authored by or contributed to by the calling user.
        schema:
          description: If true, return only revisions authored by or contributed to by the calling user.
          anyOf:
          - type: string
            const: 'true'
          - type: string
            const: 'false'
          - type: string
            const: '0'
          - type: string
            const: '1'
          - type: boolean
      - name: archived
        in: query
        description: Whether to include revisions for archived features. Defaults to `false` (non-archived features only). Pass `true` to include revisions for archived features alongside non-archived ones.
        schema:
          description: Whether to include revisions for archived features. Defaults to `false` (non-archived features only). Pass `true` to include revisions for archived features alongside non-archived ones.
          anyOf:
          - type: string
            const: 'true'
          - type: string
            const: 'false'
          - type: string
            const: '0'
          - type: string
            const: '1'
          - type: boolean
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  revisions:
                    type: array
                    items:
                      $ref: '#/components/schemas/FeatureRevisionV2'
                  limit:
                    type: integer
                  offset:
                    type: integer
                  count:
                    type: integer
                  total:
                    type: integer
                  hasMore:
                    type: boolean
                  nextOffset:
                    anyOf:
                    - type: integer
                    - type: 'null'
                required:
                - revisions
                - limit
                - offset
                - count
                - total
                - hasMore
                - nextOffset
                additionalProperties: false
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v2/feature-revisions' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v2/features/{id}/revisions:
    get:
      operationId: getFeatureRevisionsV2
      summary: List revisions for a feature
      description: Returns a paginated list of revisions for this feature, sorted newest-first. Revision `rules` is a flat array with per-rule scope.
      tags:
      - feature-revisions-v2
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/skipPagination'
      - $ref: '#/components/parameters/status'
      - $ref: '#/components/parameters/author'
      - $ref: '#/components/parameters/mine'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  revisions:
                    type: array
                    items:
                      $ref: '#/components/schemas/FeatureRevisionV2'
                  limit:
                    type: integer
                  offset:
                    type: integer
                  count:
                    type: integer
                  total:
                    type: integer
                  hasMore:
                    type: boolean
                  nextOffset:
                    anyOf:
                    - type: integer
                    - type: 'null'
                required:
                - revisions
                - limit
                - offset
                - count
                - total
                - hasMore
                - nextOffset
                additionalProperties: false
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v2/features/{id}/revisions' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
    post:
      operationId: postFeatureRevisionV2
      summary: Create a draft revision
      description: Creates a new draft revision branched from the current live revision.
      tags:
      - feature-revisions-v2
      parameters:
      - name: id
        in: path
        required: true
        description: ''
        schema:
          type: string
      - $ref: '#/components/parameters/overrideDraftLimit'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  description: Markdown. What changed and why, for reviewers.
                  type: string
                title:
                  description: Short draft title (e.g. `Enable for beta testers`).
                  type: string
                ignoreWarnings:
                  description: Set to true to acknowledge the warnings listed in a blocked response and continue. This covers experiment guards, locked dependents, and references affected by an archive. When the organization treats schema failures as warnings, it also covers schema and invariant warnings. It never bypasses a rejected Custom Hook. On revision publish endpoints, it can also force-publish an out-of-date draft when the caller has Bypass draft approvals access. Only set this when a person has explicitly asked you to. If a check blocks you, stop and ask a person instead of working around it.
                  type: boolean
              additionalProperties: false
      responses:
        '200':
          description: Resource created
          content:
            application/json:
              schema:
                type: object
                properties:
                  revision:
                    $ref: '#/components/schemas/FeatureRevisionV2'
                required:
                - revision
                additionalProperties: false
        '202':
          $ref: '#/components/responses/ConfirmationHeld'
      x-codeSamples:
      - lang: cURL
        source: "curl -X POST 'https://api.growthbook.io/api/v2/features/{id}/revisions' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v2/features/{id}/revisions/latest:
    get:
      operationId: getFeatureRevisionLatestV2
      summary: Get the most recent active draft revision
      description: Returns the most recently updated active draft revision for the feature. Returns 404 if no matching draft exists. Filter by status, author, or use `mine=true` to scope to the calling user's own drafts.
      tags:
      - feature-revisions-v2
      parameters:
      - name: id
        in: path
        required: true
        description: ''
        schema:
          type: string
      - name: mine
        in: query
        description: If true, return only the most recent active draft authored by or contributed to by the calling user.
        schema:
          description: If true, return only the most recent active draft authored by or contributed to by the calling user.
          anyOf:
          - type: string
            const: 'true'
          - type: string
            const: 'false'
          - type: string
            const: '0'
          - type: string
            const: '1'
          - type: boolean
      - $ref: '#/components/parameters/status'
      - name: author
        in: query
        description: Filter to drafts created by this user (userId).
        schema:
          description: Filter to drafts created by this user (userId).
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  revision:
                    $ref: '#/components/schemas/FeatureRevisionV2'
                required:
                - revision
                additionalProperties: false
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v2/features/{id}/revisions/latest' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v2/features/{id}/revisions/{version}:
    get:
      operationId: getFeatureRevisionV2
      summary: Get a single feature revision
      description: Returns the revision at the specified version for this feature. Revision `rules` is a flat array with per-rule environment scope.
      tags:
      - feature-revisions-v2
      parameters:
      - name: id
        in: path
        required: true
        description: ''
        schema:
          type: string
      - $ref: '#/components/parameters/version'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  revision:
                    $ref: '#/components/schemas/FeatureRevisionV2'
                required:
                - revision
                additionalProperties: false
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v2/features/{id}/revisions/{version}' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v2/features/{id}/revisions/{version}/diff:
    get:
      operationId: getFeatureRevisionDiffV2
      summary: Diff a revision against another revision
      description: 'Returns a schema-keyed JSON diff between this revision and a baseline. The same shapes the in-app review surface produces under `Copy as → Minimal JSON` / `Full JSON`: `minimal` lists only what changed (with id-keyed arrays bucketed into added/removed/modified items and reorder detection), while `full` returns the complete before/after content of the revision. Lifecycle fields (version, status, comment, date, createdBy, publishedBy) are excluded from the diff body and echoed via `from` / `to` instead. Defaults to diffing against the revision''s own `baseVersion`; pass `?base=live` to diff against the current live revision, or `?base=` for an arbitrary historical one.'
      tags:
      - feature-revisions-v2
      parameters:
      - name: id
        in: path
        required: true
        description: ''
        schema:
          type: string
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/format'
      - $ref: '#/components/parameters/base'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                anyOf:
                - type: object
                  properties:
                    diff:
                      type: object
                      properties:
                        name:
                          description: The feature key.
                          type: string
                        type:
                          type: string
                          const: feature
                        from:
                          description: Version number this revision was diffed against (the before).
                          type: integer
                        to:
                          description: Version number being diffed (the after).
                          type: integer
                        changes:
                          type: array
                          items:
                            type: object
                            properties:
                              field:
                                type: string
                              change:
                                type: string
                                enum:
                                - added
                                - removed
                                - modified
                            required:
                            - field
                            - change
                            additionalProperties: {}
                        supplemental:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                              type:
                                type: string
                              change:
                                type: string
                                enum:
                                - added
                                - removed
                                - modified
                            required:
                            - name
                            - type
                            - change
                            additionalProperties: {}
                      required:
                      - name
                      - type
                      - from
                      - to
                      - changes
                      additionalProperties: false
                  required:
                  - diff
                  additionalProperties: false
                - type: object
                  properties:
                    diff:
                      type: object
                      properties:
                        name:
                          description: The feature key.
                          type: string
                        type:
                          type: string
                          const: feature
                        from:
                          description: Version number this revision was diffed against (the before).
                          type: integer
                        to:
                          description: Version number being diffed (the after).
                          type: integer
                        before:
                          type: object
                          propertyNames:
                            type: string
                          additionalProperties: {}
                        after:
                          type: object
                          propertyNames:
                            type: string
                          additionalProperties: {}
                        supplemental:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                              type:
                                type: string
                              before:
                                anyOf:
                                - {}
                                - type: 'null'
                              after:
                                anyOf:
                                - {}
                                - type: 'null'
                            required:
                            - name
                            - type
                            - before
                            - after
                            additionalProperties: false
                      required:
                      - name
                      - type
                      - from
                      - to
                      - before
                      - after
                      additionalProperties: false
                  required:
                  - diff
                  additionalProperties: false
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v2/features/{id}/revisions/{version}/diff' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v2/features/{id}/revisions/{version}/metadata:
    put:
      operationId: putFeatureRevisionMetadataV2
      summary: Update revision metadata
      tags:
      - feature-revisions-v2
      parameters:
      - name: id
        in: path
        required: true
        description: ''
        schema:
          type: string
      - name: version
        in: path
        required: true
        description: ''
        schema:
          anyOf:
          - type: integer
          - type: string
            const: new
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  description: Markdown. What changed and why, for reviewers.
                  type: string
                title:
                  description: Short draft title (e.g. `Enable for beta testers`).
                  type: string
                description:
                  description: Markdown. What the Feature Flag gates and why, rollout plan, and links. Put context here, not in the key.
                  type: string
                owner:
                  description: The userId or email address of the owner. If an email address is provided, it will be used to look up the userId of the matching organization member. If an ID is provided, it will be validated as existing in the organization.
                  type: string
                project:
                  type: string
                targetingAllProjects:
                  description: Stage delivering this feature to every project. Requires the `targetFeatures` permission unscoped to any project.
                  type: boolean
                targetingProjects:
                  description: Stage the secondary project IDs this feature is delivered to. Adding a project requires the `targetFeatures` permission (FlagsTarget policy) in that project.
                  type: array
                  items:
                    type: string
                tags:
                  type: array
                  items:
                    type: string
                neverStale:
                  type: boolean
                customFields:
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties: {}
                jsonSchema:
                  description: Validation schema to stage on the draft. The server sets `date`, so don't send it.
                  type: object
                  properties:
                    schemaType:
                      type: string
                      enum:
                      - schema
                      - simple
                    schema:
                      type: string
                    simple:
                      type: object
                      properties:
                        type:
                          type: string
                          enum:
                          - object
                          - object[]
                          - primitive
                          - primitive[]
                        fields:
                          type: array
                          items:
                            type: object
                            properties:
                              key:
                                type: string
                                maxLength: 64
                              type:
                                type: string
                                enum:
                                - integer
                                - float
                                - string
                                - boolean
                              required:
                                type: boolean
                              default:
                                type: string
                                maxLength: 256
                              description:
                                type: string
                                maxLength: 10000
                              enum:
                                maxItems: 256
                                type: array
                                items:
                                  type: string
                                  maxLength: 256
                              min:
                                type: number
                              max:
                                type: number
                              nullable:
                                type: boolean
                              jsonSchema:
                                type: string
                            required:
                            - key
                            - type
                            - required
                            - default
                            - description
                            - enum
                            additionalProperties: false
                        additionalProperties:
                          type: boolean
                        invariants:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                                maxLength: 128
                              rule:
                                type: string
                              message:
                                type: string
                                maxLength: 10000
                            required:
                            - name
                            - rule
                            - message
                            additionalProperties: false
                      required:
                      - type
                      - fields
                      additionalProperties: false
                    enabled:
                      type: boolean
                  required:
                  - schemaType
                  - schema
                  - simple
                  - enabled
                  additionalProperties: false
                ignoreWarnings:
                  description: Set to true to acknowledge the warnings listed in a blocked response and continue. This covers experiment guards, locked dependents, and references affected by an archive. When the organization treats schema failures as warnings, it also covers schema and invariant warnings. It never bypasses a rejected Custom Hook. On revision publish endpoints, it can also force-publish an out-of-date draft when the caller has Bypass draft approvals access. Only set this when a person has explicitly asked you to. If a check blocks you, stop and ask a person instead of working around it.
                  type: boolean
              additionalProperties: false
      responses:
        '200':
          description: Resource updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  revision:
                    $ref: '#/components/schemas/FeatureRevisionV2'
                required:
                - revision
                additionalProperties: false
        '202':
          $ref: '#/components/responses/ConfirmationHeld'
      x-codeSamples:
      - lang: cURL
        source: "curl -X PUT 'https://api.growthbook.io/api/v2/features/{id}/revisions/{version}/metadata' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v2/features/{id}/revisions/{version}/default-value:
    put:
      operationId: putFeatureRevisionDefaultValueV2
      summary: Set the default value in a draft revision
      tags:
      - feature-revisions-v2
      parameters:
      - name: id
        in: path
        required: true
        description: ''
        schema:
          type: string
      - name: version
        in: path
        required: true
        description: ''
        schema:
          anyOf:
          - type: integer
          - type: string
            const: new
      - $ref: '#/components/parameters/skipSchemaValidation'
      - $ref: '#/components/parameters/ignoreWarnings'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                defaultValue:
                  description: 'New default value. In Config mode (feature has `baseConfig`), the default must be exactly a config with no overrides: send `"{}"` to use `baseConfig`, or set `defaultValueConfig` to point at a descendant.'
                  type: string
                defaultValueConfig:
                  description: Key of a config within the feature's `baseConfig` family that the default value resolves to (the base itself or a descendant). The default is exactly that config with no overrides; pass `null` to use `baseConfig`. Do not embed `@config:` in `defaultValue` — use this field.
                  anyOf:
                  - type: string
                  - type: 'null'
                revisionTitle:
                  description: Short draft title (e.g. `Enable for beta testers`). Only used when `version` is "new"; ignored for existing drafts.
                  type: string
                revisionComment:
                  description: Markdown. What changed and why, for reviewers. Only used when `version` is "new"; ignored for existing drafts.
                  type: string
                ignoreWarnings:
                  description: Set to true to acknowledge the warnings listed in a blocked response and continue. This covers experiment guards, locked dependents, and references affected by an archive. When the organization treats schema failures as warnings, it also covers schema and invariant warnings. It never bypasses a rejected Custom Hook. On revision publish endpoints, it can also force-publish an out-of-date draft when the caller has Bypass draft approvals access. Only set this when a person has explicitly asked you to. If a check blocks you, stop and ask a person instead of working around it.
                  type: boolean
                skipSchemaValidation:
                  description: Set to true to publish despite schema validation errors, failed invariants, or schema changes that invalidate dependent resources. This does not bypass a rejected Custom Hook; use `skipHooks` for that. The caller must have Bypass draft approvals access for Feature Flags, Configs, and Constants in every Project. Otherwise, this field is ignored. Only set this when a person has explicitly asked you to. If a check blocks you, stop and ask a person instead of working around it.
                  type: boolean
                skipHooks:
                  description: Set to true to publish despite a Custom Hook rejection. This does not bypass schema validation; use `skipSchemaValidation` for that. The caller must have Bypass draft approvals access for Feature Flags, Configs, and Constants in every Project. Otherwise, this field is ignored. Only set this when a person has explicitly asked you to. If a check blocks you, stop and ask a person instead of working around it.
                  type: boolean
              required:
              - defaultValue
              additionalProperties: false
      responses:
        '200':
          description: Resource updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  revision:
                    $ref: '#/components/schemas/FeatureRevisionV2'
                required:
                - revision
                additionalProperties: false
        '202':
          $ref: '#/components/responses/ConfirmationHeld'
      x-codeSamples:
      - lang: cURL
        source: "curl -X PUT 'https://api.growthbook.io/api/v2/features/{id}/revisions/{version}/default-value' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v2/features/{id}/revisions/{version}/prerequisites:
    put:
      operationId: putFeatureRevisionPrerequisitesV2
      summary: Set feature-level prerequisites in a draft revision
      description: Sets the feature-level prerequisites for this revision. Each prerequisite must be a boolean feature flag; the gate is always 'prerequisite flag is on'. The condition is applied automatically — only the flag ID is required.
      tags:
      - feature-revisions-v2
      parameters:
      - name: id
        in: path
        required: true
        description: ''
        schema:
          type: string
      - name: version
        in: path
        required: true
        description: ''
        schema:
          anyOf:
          - type: integer
          - type: string
            const: new
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prerequisites:
                  description: List of prerequisite boolean flags. When any prerequisite flag is off for a user, this flag returns its defaultValue for that user.
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        description: ID of a boolean feature flag
                        type: string
                    required:
                    - id
                    additionalProperties: false
                revisionTitle:
                  description: Short draft title (e.g. `Enable for beta testers`). Only used when `version` is "new"; ignored for existing drafts.
                  type: string
                revisionComment:
                  description: Markdown. What changed and why, for reviewers. Only used when `version` is "new"; ignored for existing drafts.
