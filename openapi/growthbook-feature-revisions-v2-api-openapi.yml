                  type: string
                ruleId:
                  type: string
                deleteScheduleWhenEmpty:
                  type: boolean
              required:
              - mode
              - rampScheduleId
              - ruleId
              additionalProperties: false
        autoPublishOnApproval:
          description: When true, the revision is armed to publish automatically once governance allows (immediately on approval, or on `scheduledPublishAt` if set).
          type: boolean
        scheduledPublishAt:
          description: Target date for a deferred (scheduled) publish. Null/absent means publish as soon as approved.
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
        scheduledPublishLockEdits:
          description: When true, content edits to this draft are frozen while the schedule is pending (rebasing is still allowed).
          type: boolean
        scheduledPublishLockOthers:
          description: When true, publishing other drafts of this feature is blocked while the schedule is pending.
          type: boolean
        scheduledPublishBypassApproval:
          description: Whether the schedule was created for an unapproved draft by a caller with Bypass draft approvals access. This kind of schedule cannot be edited; cancel it and create a new schedule instead. Anyone with Publish access can cancel it.
          type: boolean
        scheduledPublishLastError:
          description: Set when a due scheduled publish keeps failing (e.g. still awaiting approval, merge conflict). Indicates the schedule is stuck and retrying.
          type: string
        autoPublishEnabledBy:
          description: User or API key the deferred publish runs as, re-checked when it fires. A key that assumed a member's role is recorded as `<keyId>:<memberId>`.
          type: string
        autoPublishEnabledByUser:
          description: Who armed the deferred publish, with an API key's name
          $ref: '#/components/schemas/EventUser'
        scheduledPublishAttempts:
          description: How many times the poller has tried to publish this revision. Read with `scheduledPublishGaveUpAt` to tell a schedule that is still retrying from one that has been parked.
          type: integer
        scheduledPublishGaveUpAt:
          format: date-time
          description: When the poller stopped retrying. Giving up CLEARS the schedule and disarms auto-publish, so nothing fires again until the revision is re-armed. The draft is left open, with `scheduledPublishLastError` preserved for context.
          type: string
        reviews:
          description: Reviewer verdicts for the current review cycle (one entry per reviewer). Verdicts flip to their -stale variants when draft content changes after submission; the list is cleared when a new review cycle starts. Absent on revisions that predate this field.
          type: array
          items:
            type: object
            properties:
              userId:
                description: 'Who reviewed: a member''s user ID, or an API key''s ID when it reviewed as itself'
                type: string
              user:
                $ref: '#/components/schemas/EventUser'
              status:
                type: string
                enum:
                - approved
                - changes-requested
                - approved-stale
                - changes-requested-stale
              timestamp:
                format: date-time
                type: string
            required:
            - userId
            - status
            - timestamp
            additionalProperties: false
