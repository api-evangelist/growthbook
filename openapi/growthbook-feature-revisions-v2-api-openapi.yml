                enum:
                - all
                - none
                - any
              ids:
                type: array
                items:
                  type: string
            required:
            - match
            - ids
            additionalProperties: false
        prerequisites:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              condition:
                type: string
            required:
            - id
            - condition
            additionalProperties: false
        allEnvironments:
          description: When true the rule applies to all environments. Omit both scope fields to apply to all environments.
          type: boolean
        environments:
          description: Environment IDs the rule applies to. Ignored when allEnvironments is true; with allEnvironments false, an omitted or empty list scopes the rule to no environment.
          type: array
          items:
            type: string
        type:
          description: Must be "experiment-ref" for an experiment rule.
          type: string
          const: experiment-ref
        experimentId:
          description: ID of the linked experiment.
          type: string
        variations:
          type: array
          items:
            type: object
            properties:
              variationId:
                type: string
              value:
                type: string
              config:
                description: Key of a config to back this variation value. When set, `value` is a JSON override patch merged on top of the config; omit or null for a plain value.
