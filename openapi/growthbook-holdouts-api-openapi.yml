openapi: 3.2.0
info:
  version: 5.1.0
  title: GrowthBook REST Holdouts API
  description: 'GrowthBook offers a full REST API for interacting with the application. Request data can use either JSON or Form data encoding (with proper `Content-Type` headers). All response bodies are JSON-encoded. The API base URL for GrowthBook Cloud is `https://api.growthbook.io/api`. For self-hosted deployments, it is the same as your API_HOST environment variable (defaults to `http://localhost:3100/api`). The rest of these docs will assume you are using GrowthBook Cloud. ## Versioning


    Endpoints are versioned by path prefix:


    - `/v1/...` — stable, widely-supported endpoints

    - `/v2/...` — updated endpoints with improved shapes (e.g. unified per-rule environment scope for feature flags)


    New integrations should prefer v2 where available. Feature-flag and metric v1 routes are deprecated: they are tagged **LEGACY** in the sidebar and collapsed by default. Use the matching v2 group when both exist. ## Authentication


    We support both the HTTP Basic and Bearer authentication schemes for convenience. You first need to generate a new API Key in GrowthBook. Different keys have different permissions:


    - **Personal Access Tokens**: These are sensitive and provide the same level of access as the user has to an organization, or less if the token''s permissions are limited. These can be created by going to `Personal Access Tokens` under your user menu. Members with the API Keys **Manage members'' tokens** permission can disable a member''s token under `Settings -> Manage PATs`, and admins can require new tokens to expire within a maximum lifetime. - **Secret Keys**: These are sensitive and provide the level of access of the role they are given, which can be any built-in or custom role, with optional per-project role overrides and environment limits. Managing Secret Keys on behalf of an organization takes the API Keys permissions. These can be created by going to `Settings -> API Keys`, where Admins can also require new Secret Keys to expire within a maximum lifetime. If using HTTP Basic auth, pass the Secret Key as the username and leave the password blank (when using curl, add `:` at the end of the secret to indicate an empty password)


    ```bash

    curl https://api.growthbook.io/api/v1/features \

    -u secret_abc123DEF456:

    ```


    If using Bearer auth, pass the Secret Key as the token:


    ```bash

    curl https://api.growthbook.io/api/v1/features \

    -H "Authorization: Bearer secret_abc123DEF456"

    ```


    If a key has an expiration date, every response includes it in the `X-GrowthBook-Key-Expires-At` header (ISO 8601), so scripts can warn before the key stops working. Requests made with an expired key fail with a `401` that says where to create a replacement. See Expiration for choosing a key''s expiration, the warnings before it lapses, and the organization policies. ## Naming who asked


    Requests made with a Secret Key may add an `X-GrowthBook-Requested-By` header naming the organization member who asked for the change, as a user id or an email address. History, revision logs and webhooks show that member next to the key. Each key''s settings under `Settings -> API Keys`:


    - **Header**: **Optional** (the default) uses the header when it''s sent, **Required** rejects requests without it, and **Rejected** rejects requests that send it, each with a 400. - **Permissions**, when a member is named:

    - **Assume member''s role** (the default): the request acts as that member, with only what both the key and the member can do, so the header can narrow a key but never widen it. Drafts, owners, `mine` filters and reviews are the member''s. The member''s rights over their own drafts, comments and verdicts apply only where the key''s own role allows the same action. - **Use key''s role**: the key acts as itself, with its own permissions, and the name is only recorded in history. Drafts, verdicts and ownership are the key''s, as when no member is named.'
servers:
- url: https://api.growthbook.io/api
  description: GrowthBook Cloud
- url: https://{domain}/api
  description: Self-hosted GrowthBook
  variables:
    domain:
      default: localhost:3100
      description: Your self-hosted GrowthBook host (and port)
security:
- bearerAuth: []
- basicAuth: []
tags:
- name: Holdouts
  x-displayName: Holdouts
  description: Hold a share of traffic out of all experiments to measure their combined effect.
paths:
  /v1/holdouts/{id}:
    get:
      operationId: getHoldout
      summary: Get a single holdout
      tags:
      - Holdouts
      parameters:
      - name: id
        in: path
        required: true
        description: ''
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  holdout:
                    $ref: '#/components/schemas/Holdout'
                required:
                - holdout
                additionalProperties: false
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v1/holdouts/{id}' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
    put:
      operationId: updateHoldout
      summary: Update a single holdout
      description: Updates a Holdout. Use the start, start-analysis, and stop endpoints to move it through its lifecycle.
      tags:
      - Holdouts
      parameters:
      - name: id
        in: path
        required: true
        description: ''
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: Short display name. Put details in `description`.
                  type: string
                  minLength: 1
                description:
                  description: Markdown. Put context here, not in the name.
                  type: string
                  maxLength: 10000
                projects:
                  description: Project IDs this Holdout applies to. Send an empty array for All Projects.
                  type: array
                  items:
                    type: string
                owner:
                  description: The userId or email address of the owner. If an email address is provided, it will be used to look up the userId of the matching organization member. If an ID is provided, it will be validated as existing in the organization.
                  type: string
                tags:
                  description: Tags for filtering and grouping. Use these instead of encoding groups in names.
                  type: array
                  items:
                    type: string
                archived:
                  type: boolean
                skipAsDefaultHoldout:
                  description: When true, this Holdout is not selected automatically when creating Feature Flags or Experiments in Projects assigned to the Holdout.
                  type: boolean
                holdoutSize:
                  description: Proportion of traffic placed in the holdout group (e.g. 0.05 for 5%). An equally sized comparison group is sampled from the remaining traffic for measurement, so 2× this value enters the holdout experiment in total. Must be greater than 0 and at most 0.5.
                  type: number
                  exclusiveMinimum: 0
                  maximum: 0.5
                hashAttribute:
                  type: string
                targetingCondition:
                  type: string
                savedGroupTargeting:
                  type: array
                  items:
                    type: object
                    properties:
                      match:
                        type: string
                        enum:
                        - all
                        - none
                        - any
                      ids:
                        type: array
                        items:
                          type: string
                    required:
                    - match
                    - ids
                    additionalProperties: false
                datasourceId:
                  type: string
                assignmentQuery:
                  description: The assignment query, grouping its ID with the identifier type analyzed on. Mutually exclusive with the deprecated `assignmentQueryId`.
                  type: object
                  properties:
                    id:
                      description: The ID of one of the data source's assignment queries.
                      type: string
                    identifierType:
                      description: The identifier type to analyze on, which the query must declare. Required when selecting a different assignment query that declares several. Otherwise defaults to the current identifier type, or the query's only one. Null is treated as omitted, so a response's value can be sent back.
                      anyOf:
                      - type: string
                      - type: 'null'
                  required:
                  - id
                  additionalProperties: false
                assignmentQueryId:
                  deprecated: true
                  description: 'Deprecated: use `assignmentQuery`. Rejected when selecting a different assignment query that declares several identifier types; set `assignmentQuery.identifierType` instead.'
                  type: string
                goalMetrics:
                  type: array
                  items:
                    type: string
                secondaryMetrics:
                  type: array
                  items:
                    type: string
                statsEngine:
                  description: Statistics engine used to analyze this Holdout.
                  type: string
                  enum:
                  - bayesian
                  - frequentist
                environments:
                  description: Replaces the entire per-environment state. Environments not listed are disabled.
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties:
                    type: object
                    properties:
                      enabled:
                        description: Whether the Holdout is active in this environment.
                        type: boolean
                    required:
                    - enabled
                    additionalProperties: false
                statusUpdateSchedule:
                  anyOf:
                  - description: 'Automatic stage transitions for the Holdout. Dates must be consecutive: `startAt` before `startAnalysisPeriodAt` before `stopAt`. Send `null` to delete the schedule.'
                    type: object
                    properties:
                      startAt:
                        description: ISO datetime to move the Holdout from `draft` to `running`. Must be in the future while the Holdout is still a draft.
                        type: string
                        format: date-time
                      startAnalysisPeriodAt:
                        description: ISO datetime to move the Holdout from `running` to `analysis-period`. Requires `startAt` while the Holdout is still a draft.
                        type: string
                        format: date-time
                      stopAt:
                        description: ISO datetime to stop the Holdout. Requires `startAnalysisPeriodAt` unless the analysis period has already begun.
                        type: string
                        format: date-time
                    additionalProperties: false
                  - type: 'null'
              additionalProperties: false
      responses:
        '200':
          description: Resource updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  holdout:
                    $ref: '#/components/schemas/Holdout'
                required:
                - holdout
                additionalProperties: false
        '202':
          $ref: '#/components/responses/ConfirmationHeld'
      x-codeSamples:
      - lang: cURL
        source: "curl -X PUT 'https://api.growthbook.io/api/v1/holdouts/{id}' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v1/holdouts:
    post:
      operationId: createHoldout
      summary: Create a single holdout
      description: Creates a Holdout. The Holdout starts in the `draft` stage. Use the start endpoint to start it.
      tags:
      - Holdouts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: Short display name. Put details in `description`.
                  type: string
                  minLength: 1
                description:
                  description: Markdown. Put context here, not in the name.
                  type: string
                  maxLength: 10000
                projects:
                  description: Project IDs this Holdout applies to. Omit or send an empty array for All Projects.
                  type: array
                  items:
                    type: string
                owner:
                  description: The userId or email address of the owner. If an email address is provided, it will be used to look up the userId of the matching organization member. If an ID is provided, it will be validated as existing in the organization.
                  type: string
                tags:
                  description: Tags for filtering and grouping. Use these instead of encoding groups in names.
                  type: array
                  items:
                    type: string
                skipAsDefaultHoldout:
                  description: When true, this Holdout is not selected automatically when creating Feature Flags or Experiments in Projects assigned to the Holdout.
                  type: boolean
                holdoutSize:
                  description: Proportion of traffic held out, expressed as a decimal (e.g. 0.05 for 5%). An equally-sized control group is bucketed alongside it. Defaults to 0.05. Maximum 0.5.
                  type: number
                  exclusiveMinimum: 0
                  maximum: 0.5
                hashAttribute:
                  type: string
                targetingCondition:
                  description: Targeting condition as a JSON string.
                  type: string
                savedGroupTargeting:
                  type: array
                  items:
                    type: object
                    properties:
                      match:
                        type: string
                        enum:
                        - all
                        - none
                        - any
                      ids:
                        type: array
                        items:
                          type: string
                    required:
                    - match
                    - ids
                    additionalProperties: false
                datasourceId:
                  type: string
                assignmentQuery:
                  description: The assignment query, grouping its ID with the identifier type analyzed on. Mutually exclusive with the deprecated `assignmentQueryId`.
                  type: object
                  properties:
                    id:
                      description: The ID of one of the data source's assignment queries.
                      type: string
                    identifierType:
                      description: The identifier type to analyze on, which the query must declare. Required when selecting a different assignment query that declares several. Otherwise defaults to the current identifier type, or the query's only one. Null is treated as omitted, so a response's value can be sent back.
                      anyOf:
                      - type: string
                      - type: 'null'
                  required:
                  - id
                  additionalProperties: false
                assignmentQueryId:
                  deprecated: true
                  description: 'Deprecated: use `assignmentQuery`. Rejected when selecting a different assignment query that declares several identifier types; set `assignmentQuery.identifierType` instead.'
                  type: string
                goalMetrics:
                  type: array
                  items:
                    type: string
                secondaryMetrics:
                  type: array
                  items:
                    type: string
                statsEngine:
                  description: Statistics engine used to analyze this Holdout.
                  type: string
                  enum:
                  - bayesian
                  - frequentist
                environments:
                  description: Per-environment state, keyed by environment ID. Environments not listed are disabled.
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties:
                    type: object
                    properties:
                      enabled:
                        description: Whether the Holdout is active in this environment.
                        type: boolean
                    required:
                    - enabled
                    additionalProperties: false
                statusUpdateSchedule:
                  description: 'Automatic stage transitions for the Holdout. Dates must be consecutive: `startAt` before `startAnalysisPeriodAt` before `stopAt`. Send `null` to delete the schedule.'
                  type: object
                  properties:
                    startAt:
                      description: ISO datetime to move the Holdout from `draft` to `running`. Must be in the future while the Holdout is still a draft.
                      type: string
                      format: date-time
                    startAnalysisPeriodAt:
                      description: ISO datetime to move the Holdout from `running` to `analysis-period`. Requires `startAt` while the Holdout is still a draft.
                      type: string
                      format: date-time
                    stopAt:
                      description: ISO datetime to stop the Holdout. Requires `startAnalysisPeriodAt` unless the analysis period has already begun.
                      type: string
                      format: date-time
                  additionalProperties: false
              required:
              - name
              additionalProperties: false
      responses:
        '200':
          description: Resource created
          content:
            application/json:
              schema:
                type: object
                properties:
                  holdout:
                    $ref: '#/components/schemas/Holdout'
                required:
                - holdout
                additionalProperties: false
        '202':
          $ref: '#/components/responses/ConfirmationHeld'
      x-codeSamples:
      - lang: cURL
        source: "curl -X POST 'https://api.growthbook.io/api/v1/holdouts' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
    get:
      operationId: listHoldouts
      summary: Get all holdouts
      tags:
      - Holdouts
      parameters:
      - name: projectId
        in: query
        description: ''
        schema:
          type: string
      - name: datasourceId
        in: query
        description: ''
        schema:
          type: string
      - $ref: '#/components/parameters/stage'
      - name: archived
        in: query
        description: Filter by archived state. Omit to return both archived and unarchived Holdouts.
        schema:
          description: Filter by archived state. Omit to return both archived and unarchived Holdouts.
          anyOf:
          - type: string
            const: 'true'
          - type: string
            const: 'false'
          - type: string
            const: '0'
          - type: string
            const: '1'
          - type: boolean
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  holdouts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Holdout'
                required:
                - holdouts
                additionalProperties: false
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v1/holdouts' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v1/holdouts/{id}/start:
    post:
      operationId: startHoldout
      summary: Start the Holdout's Active Period
      description: Feature Flags and Experiments can be added during this period while the Holdout measures their cumulative impact.
      tags:
      - Holdouts
      parameters:
      - name: id
        in: path
        required: true
        description: ''
        schema:
          type: string
      responses:
        '200':
          description: Resource created
          content:
            application/json:
              schema:
                type: object
                properties:
                  holdout:
                    $ref: '#/components/schemas/Holdout'
                required:
                - holdout
                additionalProperties: false
        '202':
          $ref: '#/components/responses/ConfirmationHeld'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                description: Resource is not in a valid status for this operation
                properties:
                  message:
                    type: string
                  code:
                    type: string
                    enum:
                    - invalid_status
                  details:
                    $ref: '#/components/schemas/ApiErrorInvalidStatusDetails'
                required:
                - message
                - code
                - details
      x-codeSamples:
      - lang: cURL
        source: "curl -X POST 'https://api.growthbook.io/api/v1/holdouts/{id}/start' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v1/holdouts/{id}/start-analysis:
    post:
      operationId: startHoldoutAnalysis
      summary: Start the Holdout's Analysis Period
      description: Move the holdout into an analysis phase. New Feature Flags and Experiments can no longer be added, but existing traffic splits remain active for existing and new traffic. Results exclude data from before the analysis period so you can measure the cumulative impact after changes are frozen.
      tags:
      - Holdouts
      parameters:
      - name: id
        in: path
        required: true
        description: ''
        schema:
          type: string
      responses:
        '200':
          description: Resource created
          content:
            application/json:
              schema:
                type: object
                properties:
                  holdout:
                    $ref: '#/components/schemas/Holdout'
                required:
                - holdout
                additionalProperties: false
        '202':
          $ref: '#/components/responses/ConfirmationHeld'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                description: Resource is not in a valid status for this operation
                properties:
                  message:
                    type: string
                  code:
                    type: string
                    enum:
                    - invalid_status
                  details:
                    $ref: '#/components/schemas/ApiErrorInvalidStatusDetails'
                required:
                - message
                - code
                - details
      x-codeSamples:
      - lang: cURL
        source: "curl -X POST 'https://api.growthbook.io/api/v1/holdouts/{id}/start-analysis' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v1/holdouts/{id}/stop:
    post:
      operationId: stopHoldout
      summary: Stop a Holdout
      tags:
      - Holdouts
      parameters:
      - name: id
        in: path
        required: true
        description: ''
        schema:
          type: string
      responses:
        '200':
          description: Resource created
          content:
            application/json:
              schema:
                type: object
                properties:
                  holdout:
                    $ref: '#/components/schemas/Holdout'
                required:
                - holdout
                additionalProperties: false
        '202':
          $ref: '#/components/responses/ConfirmationHeld'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                description: Resource is not in a valid status for this operation
                properties:
                  message:
                    type: string
                  code:
                    type: string
                    enum:
                    - invalid_status
                  details:
                    $ref: '#/components/schemas/ApiErrorInvalidStatusDetails'
                required:
                - message
                - code
                - details
      x-codeSamples:
      - lang: cURL
        source: "curl -X POST 'https://api.growthbook.io/api/v1/holdouts/{id}/stop' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
components:
  parameters:
    stage:
      name: stage
      in: query
      description: ''
      schema:
        type: string
        enum:
        - draft
        - running
        - analysis-period
        - stopped
  responses:
    ConfirmationHeld:
      description: Held until a person confirms it in GrowthBook. Poll the Location until the confirmation completes.
      headers:
        Location:
          description: The confirmation to poll
          schema:
            type: string
        Retry-After:
          description: Seconds to wait before polling
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConfirmationHeld'
  schemas:
    Holdout:
      type: object
      properties:
        id:
          type: string
        dateCreated:
          type: string
          format: date-time
        dateUpdated:
          type: string
          format: date-time
        name:
          type: string
        description:
          type: string
          maxLength: 10000
        projects:
          description: Project IDs this Holdout applies to. An empty array means All Projects.
          type: array
          items:
            type: string
        owner:
          description: The userId of the owner (or raw owner name/email for legacy records)
          type: string
        ownerEmail:
          description: The email address of the owner, when the owner can be resolved to a known user.
          type: string
        tags:
          type: array
          items:
            type: string
        archived:
          type: boolean
        stage:
          description: Lifecycle stage of the Holdout. Use the start, start-analysis, and stop endpoints to move through the lifecycle.
          type: string
          enum:
          - draft
          - running
          - analysis-period
          - stopped
        trackingKey:
          type: string
        experimentId:
          description: ID of the companion experiment that stores this Holdout's analysis. Use it with the experiment results endpoints (e.g. GET /experiments/{experimentId}/results). Pass phase=0 for results across the whole Holdout period, or phase=1 for results limited to the analysis period.
          type: string
        skipAsDefaultHoldout:
          description: When true, this Holdout is not selected automatically when creating Feature Flags or experiments in Projects assigned to the Holdout.
          type: boolean
        holdoutSize:
          description: Proportion of traffic placed in the holdout group (e.g. 0.05 for 5%). An equally sized comparison group is sampled from the remaining traffic for measurement, so 2× this value enters the holdout experiment in total. Must be greater than 0 and at most 0.5.
          type: number
          exclusiveMinimum: 0
          maximum: 0.5
        hashAttribute:
          description: Attribute used to assign users to the Holdout.
          type: string
        targetingCondition:
          description: Targeting condition as a JSON string.
          type: string
        savedGroupTargeting:
          type: array
          items:
            type: object
            properties:
              match:
                type: string
                enum:
                - all
                - none
                - any
              ids:
                type: array
                items:
                  type: string
            required:
            - match
            - ids
            additionalProperties: false
        datasourceId:
          type: string
        assignmentQuery:
          description: The assignment query, grouping its ID with the identifier type analyzed on.
          type: object
          properties:
            id:
              description: The ID of one of the data source's assignment queries.
              type: string
            identifierType:
              description: 'The identifier type analyzed on. Null when none can be resolved: no assignment query is selected, or a record saved before identifier types were stored points at a query that no longer exists.'
              anyOf:
              - type: string
              - type: 'null'
          required:
          - id
          - identifierType
          additionalProperties: false
        assignmentQueryId:
          description: 'Deprecated: use `assignmentQuery`.'
          deprecated: true
          type: string
        goalMetrics:
          type: array
          items:
            type: string
        secondaryMetrics:
          type: array
          items:
            type: string
        statsEngine:
          description: Statistics engine used to analyze this Holdout.
          type: string
          enum:
          - bayesian
          - frequentist
        variations:
          type: array
          items:
            type: object
            properties:
              variationId:
                type: string
              key:
                type: string
              name:
                type: string
              description:
                type: string
                maxLength: 10000
            required:
            - variationId
            - key
            - name
            additionalProperties: false
        environments:
          description: Per-environment state, keyed by environment ID. Environments not present are disabled.
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: object
            properties:
              enabled:
                description: Whether the Holdout is active in this environment.
                type: boolean
            required:
            - enabled
            additionalProperties: false
        linkedFeatures:
          description: Feature Flags held out by this Holdout. Manage these through the Feature Flag endpoints.
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              dateAdded:
                type: string
                format: date-time
            required:
            - id
            - dateAdded
            additionalProperties: false
        linkedExperiments:
          description: Experiments held out by this Holdout. Manage these through the experiment endpoints.
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              dateAdded:
                type: string
                format: date-time
            required:
            - id
            - dateAdded
            additionalProperties: false
        dateStarted:
          type: string
          format: date-time
        analysisStartDate:
          description: When the Holdout entered its analysis period.
          type: string
          format: date-time
        dateStopped:
          type: string
          format: date-time
        statusUpdateSchedule:
          anyOf:
          - description: 'Automatic stage transitions for the Holdout. Dates must be consecutive: `startAt` before `startAnalysisPeriodAt` before `stopAt`. Send `null` to delete the schedule.'
            type: object
            properties:
              startAt:
                description: ISO datetime to move the Holdout from `draft` to `running`. Must be in the future while the Holdout is still a draft.
                type: string
                format: date-time
              startAnalysisPeriodAt:
                description: ISO datetime to move the Holdout from `running` to `analysis-period`. Requires `startAt` while the Holdout is still a draft.
                type: string
                format: date-time
              stopAt:
                description: ISO datetime to stop the Holdout. Requires `startAnalysisPeriodAt` unless the analysis period has already begun.
                type: string
                format: date-time
            additionalProperties: false
          - type: 'null'
        nextScheduledStatusUpdate:
          anyOf:
          - description: The next stage transition that will run automatically.
            type: object
            properties:
              type:
                type: string
                enum:
                - start
                - startAnalysisPeriod
                - stop
              date:
                type: string
                format: date-time
            required:
            - type
            - date
            additionalProperties: false
          - type: 'null'
