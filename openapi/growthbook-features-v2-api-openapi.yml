              additionalProperties: false
        prerequisites:
          description: Feature-level prerequisites captured in this revision. Each entry is a boolean flag ID that must evaluate to true for this flag to be active for a given user.
          type: array
          items:
            type: object
            properties:
              id:
                description: Feature ID of the prerequisite boolean flag
                type: string
            required:
            - id
            additionalProperties: false
        metadata:
