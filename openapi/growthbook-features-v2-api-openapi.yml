openapi: 3.2.0
info:
  version: 5.1.0
  title: GrowthBook REST Features V2 API
  description: 'GrowthBook offers a full REST API for interacting with the application. Request data can use either JSON or Form data encoding (with proper `Content-Type` headers). All response bodies are JSON-encoded. The API base URL for GrowthBook Cloud is `https://api.growthbook.io/api`. For self-hosted deployments, it is the same as your API_HOST environment variable (defaults to `http://localhost:3100/api`). The rest of these docs will assume you are using GrowthBook Cloud. ## Versioning


    Endpoints are versioned by path prefix:


    - `/v1/...` — stable, widely-supported endpoints

    - `/v2/...` — updated endpoints with improved shapes (e.g. unified per-rule environment scope for feature flags)


    New integrations should prefer v2 where available. Feature-flag and metric v1 routes are deprecated: they are tagged **LEGACY** in the sidebar and collapsed by default. Use the matching v2 group when both exist. ## Authentication


    We support both the HTTP Basic and Bearer authentication schemes for convenience. You first need to generate a new API Key in GrowthBook. Different keys have different permissions:


    - **Personal Access Tokens**: These are sensitive and provide the same level of access as the user has to an organization, or less if the token''s permissions are limited. These can be created by going to `Personal Access Tokens` under your user menu. Members with the API Keys **Manage members'' tokens** permission can disable a member''s token under `Settings -> Manage PATs`, and admins can require new tokens to expire within a maximum lifetime. - **Secret Keys**: These are sensitive and provide the level of access of the role they are given, which can be any built-in or custom role, with optional per-project role overrides and environment limits. Managing Secret Keys on behalf of an organization takes the API Keys permissions. These can be created by going to `Settings -> API Keys`, where Admins can also require new Secret Keys to expire within a maximum lifetime. If using HTTP Basic auth, pass the Secret Key as the username and leave the password blank (when using curl, add `:` at the end of the secret to indicate an empty password)


    ```bash

    curl https://api.growthbook.io/api/v1/features \

    -u secret_abc123DEF456:

    ```


    If using Bearer auth, pass the Secret Key as the token:


    ```bash

    curl https://api.growthbook.io/api/v1/features \

    -H "Authorization: Bearer secret_abc123DEF456"

    ```


    If a key has an expiration date, every response includes it in the `X-GrowthBook-Key-Expires-At` header (ISO 8601), so scripts can warn before the key stops working. Requests made with an expired key fail with a `401` that says where to create a replacement. See Expiration for choosing a key''s expiration, the warnings before it lapses, and the organization policies. ## Naming who asked


    Requests made with a Secret Key may add an `X-GrowthBook-Requested-By` header naming the organization member who asked for the change, as a user id or an email address. History, revision logs and webhooks show that member next to the key. Each key''s settings under `Settings -> API Keys`:


    - **Header**: **Optional** (the default) uses the header when it''s sent, **Required** rejects requests without it, and **Rejected** rejects requests that send it, each with a 400. - **Permissions**, when a member is named:

    - **Assume member''s role** (the default): the request acts as that member, with only what both the key and the member can do, so the header can narrow a key but never widen it. Drafts, owners, `mine` filters and reviews are the member''s. The member''s rights over their own drafts, comments and verdicts apply only where the key''s own role allows the same action. - **Use key''s role**: the key acts as itself, with its own permissions, and the name is only recorded in history. Drafts, verdicts and ownership are the key''s, as when no member is named.'
servers:
- url: https://api.growthbook.io/api
  description: GrowthBook Cloud
- url: https://{domain}/api
  description: Self-hosted GrowthBook
  variables:
    domain:
      default: localhost:3100
      description: Your self-hosted GrowthBook host (and port)
security:
- bearerAuth: []
- basicAuth: []
tags:
- name: Features v2
  x-displayName: Feature Flags
  description: 'Control your feature flags programmatically.


    Rules are returned as a unified top-level array; each rule carries `allEnvironments` / `environments` scope fields instead of being bucketed by environment.'
paths:
  /v2/features:
    get:
      operationId: listFeaturesV2
      summary: Get all features
      description: Returns features with pagination. Rules are returned as a unified top-level array with per-rule environment scope.
      tags:
      - Features v2
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/projectId'
      - $ref: '#/components/parameters/clientKey'
      - $ref: '#/components/parameters/archived'
      - $ref: '#/components/parameters/skipPagination'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    features:
                      type: array
                      items:
                        $ref: '#/components/schemas/FeatureV2'
                  required:
                  - features
                  additionalProperties: false
                - $ref: '#/components/schemas/PaginationFields'
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v2/features' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
    post:
      operationId: postFeatureV2
      summary: Create a single feature
      description: 'Creates a new Feature Flag. The caller needs Create access in its Project, plus Publish access for any environment the Feature Flag starts enabled in — one that starts disabled everywhere needs Create alone. Rules are supplied as a top-level `rules` array; each rule includes `allEnvironments` / `environments` scope fields.


        ### Naming for human review


        The `id` is the Feature Flag''s permanent name in the UI and code. Keep it short (`checkout-express-pay`) and put context in `description`. To create it disabled, list every environment in `environments` with `enabled: false`.


        ### Config-backed features (Config mode)


        A JSON feature can be backed by a shared **config** — the config supplies the base JSON value and schema, and the feature''s *rule* values become override *patches* merged on top (nested objects deep-merge; arrays and scalars replace). The default value is exactly a config with no overrides (see below). Config backing is set exclusively through dedicated fields — never a raw `$extends: ["@config:…"]` inside a value string (that is rejected). `@const:` references inside values still work.


        - **Top-level (`baseConfig`):** set `valueType: "json"` and `baseConfig: ""` to put the Feature Flag in Config mode. The config must be live. This is the family root and the base the default value patches.

        - **Default value:** unlike rules, the default is exactly a config with no overrides of its own — send `defaultValue: "{}"` to use `baseConfig`. To resolve the default to a *descendant* of `baseConfig` instead, set `defaultValueConfig` to that descendant''s key (it must be within `baseConfig`''s family); omit/null to use `baseConfig` directly.

        - **Rules & experiment variations:** each carries its own `config` field naming the family config that value patches (omit/null to patch the base). `value` is the override patch.


        Example:


        ```json

        {

        "id": "checkout-config",

        "valueType": "json",

        "baseConfig": "purchase-flow",

        "defaultValue": "{}",

        "rules": [

        { "type": "force", "config": "purchase-flow-vip", "value": "{\"maxItems\": 20}", "allEnvironments": true }

        ]

        }

        ```'
      tags:
      - Features v2
      parameters:
      - $ref: '#/components/parameters/skipSchemaValidation'
      - $ref: '#/components/parameters/ignoreWarnings'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  pattern: ^[a-zA-Z0-9_.:\|\-]+$
                  description: Unique, permanent key, shown as the Feature Flag's name in the UI and used in code. Keep it short. If `featureRegexValidator` in `GET /api/v1/settings` is set, follow it (`featureKeyExample` shows the format); otherwise use kebab-case (e.g. `checkout-express-pay`). Put context in `description`.
                  type: string
                  minLength: 1
                archived:
                  type: boolean
                description:
                  description: Markdown. What the Feature Flag gates and why, rollout plan, and links. Put context here, not in the key.
                  type: string
                  maxLength: 10000
                owner:
                  description: 'The userId or email address of the owner. If an email address is provided, it will be used to look up the userId of the matching organization member. If an ID is provided, it will be validated as existing in the organization. When omitted, it defaults to the requesting member: a personal access token''s owner, or the member an organization API key assumes. An organization API key acting as itself must send it, or the request fails with a 400.'
                  type: string
                project:
                  description: An associated project ID
                  type: string
                targetingAllProjects:
                  description: Make this feature discoverable in — and served to — every project, beyond its primary `project`. Requires the `targetFeatures` permission (FlagsTarget policy) unscoped to any project. Governance stays with `project`.
                  type: boolean
                targetingProjects:
                  description: Secondary project IDs this feature is targeted in and served to, beyond its primary `project`. Adding a project requires the `targetFeatures` permission (FlagsTarget policy) in that project. Governance stays with `project`.
                  type: array
                  items:
                    type: string
                valueType:
                  description: The data type of the feature payload. Boolean by default.
                  type: string
                  enum:
                  - boolean
                  - string
                  - number
                  - json
                defaultValue:
                  description: 'Default value when feature is enabled. Type must match `valueType`. In Config mode (`baseConfig` set) the default must be exactly a config with no overrides: send `"{}"` to use `baseConfig`, or set `defaultValueConfig` to point at a descendant.'
                  type: string
                baseConfig:
                  description: 'Key of the config backing this flag ("Config mode"). Requires `valueType: "json"` and a live config. The config supplies the base JSON and schema; `defaultValue` and rule values are override patches on top. null or omitted for a plain flag.'
                  anyOf:
                  - type: string
                  - type: 'null'
                defaultValueConfig:
                  description: Optional. A config within `baseConfig`'s family that the default value resolves to instead of `baseConfig` itself. null or omitted means the default is `baseConfig`. The default is exactly this config and carries no overrides of its own.
                  anyOf:
                  - type: string
                  - type: 'null'
                tags:
                  description: Tags for filtering and grouping. Use these instead of encoding groups in names.
                  type: array
                  items:
                    type: string
                rules:
                  description: Feature rules. Each rule carries its own environment scope via `allEnvironments` / `environments`.
                  type: array
                  items:
                    anyOf:
                    - type: object
                      properties:
                        description:
                          description: Short note on why the rule exists (e.g. `Beta testers only`).
                          type: string
                          maxLength: 10000
                        condition:
                          type: string
                        savedGroups:
                          type: array
                          items:
                            type: object
                            properties:
                              match:
                                type: string
                                enum:
                                - all
                                - none
                                - any
                              ids:
                                type: array
                                items:
                                  type: string
                            required:
                            - match
                            - ids
                            additionalProperties: false
                        savedGroupTargeting:
                          description: Deprecated — use `savedGroups`. Accepted so a GET response can be posted back unchanged; `savedGroups` takes precedence if both are sent.
                          deprecated: true
                          type: array
                          items:
                            type: object
                            properties:
                              matchType:
                                type: string
                                enum:
                                - all
                                - any
                                - none
                              savedGroups:
                                type: array
                                items:
                                  type: string
                            required:
                            - matchType
                            - savedGroups
                            additionalProperties: false
                        pendingRamp:
                          description: Read-only; ignored on write. Accepted so a GET response can be posted back unchanged.
                        rampScheduleId:
                          description: Read-only; ignored on write. Accepted so a GET response can be posted back unchanged.
                        scheduleType:
                          description: Read-only; ignored on write. Accepted so a GET response can be posted back unchanged.
                        prerequisites:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                description: Feature ID
                                type: string
                              condition:
                                type: string
                            required:
                            - id
                            - condition
                            additionalProperties: false
                        scheduleRules:
                          type: array
                          items:
                            type: object
                            properties:
                              timestamp:
                                description: ISO 8601 date-time, e.g. "2025-06-01T00:00:00Z".
                                anyOf:
                                - type: string
                                  format: date-time
                                - type: 'null'
                              enabled:
                                type: boolean
                            required:
                            - timestamp
                            - enabled
                            additionalProperties: false
                        id:
                          type: string
                        enabled:
                          type: boolean
                        type:
                          type: string
                          const: force
                        value:
                          type: string
                        config:
                          description: Key of a config to back this value. When set, `value` is a JSON override patch merged on top of the config; omit or null for a plain value.
                          anyOf:
                          - type: string
                          - type: 'null'
                        sparse:
                          description: JSON features only. When true, the rule value is a partial object merged onto the feature's default value instead of replacing it.
                          type: boolean
                        allEnvironments:
                          description: When true the rule applies to all environments (default).
                          type: boolean
                        environments:
                          description: Environment IDs the rule applies to. Ignored when allEnvironments is true; with allEnvironments false, an omitted or empty list scopes the rule to no environment.
                          type: array
                          items:
                            type: string
                        allProjects:
                          description: When true (the default) the rule applies to every project the feature is delivered to. Set false and supply `projects` to scope the rule.
                          type: boolean
                        projects:
                          description: Specific project IDs this rule applies to. Used when allProjects is false. An empty array scopes the rule to no project. When the organization requires registered attributes with project scoping, the rule's attributes are validated against these projects rather than the whole feature's.
                          type: array
                          items:
                            type: string
                      required:
                      - type
                      - value
                      additionalProperties: false
                    - type: object
                      properties:
                        description:
                          description: Short note on why the rule exists (e.g. `Beta testers only`).
                          type: string
                          maxLength: 10000
