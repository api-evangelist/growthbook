          description: 'Key of the config backing this flag ("Config mode"). Requires `valueType: "json"` and a live config. The config supplies the base JSON and schema; `defaultValue` and rule values are override patches on top. null or omitted for a plain flag.'
          anyOf:
          - type: string
          - type: 'null'
        defaultValueConfig:
          description: Optional. A config within `baseConfig`'s family that the default value resolves to instead of `baseConfig` itself. null or omitted means the default is `baseConfig`. The default is exactly this config and carries no overrides of its own.
          anyOf:
          - type: string
          - type: 'null'
        tags:
          type: array
          items:
            type: string
