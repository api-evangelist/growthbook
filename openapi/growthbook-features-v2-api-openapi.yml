components:
  schemas:
    bypassedGates:
      type: object
      properties:
        type:
          description: The gate that was bypassed (e.g. "approval-required", "stale-base", "schema-break").
          type: string
        outcome:
          type: string
          const: bypassed
        via:
          description: How the gate was bypassed. The value identifies a request field (`ignoreWarnings`, `skipSchemaValidation`, or `skipHooks`), the caller's permission (`bypassApprovalPermission`), or an organization setting (`restApiBypassesReviews`, or `revertsBypassApproval` on a revert).
          type: string
          enum:
          - ignoreWarnings
          - skipSchemaValidation
          - skipHooks
          - bypassApprovalPermission
          - restApiBypassesReviews
          - revertsBypassApproval
      required:
      - type
      - outcome
      - via
      additionalProperties: false
    FeatureRevisionSummary:
      type: object
      properties:
        id:
          description: Stable id of the feature's live revision.
          type: string
        version:
          type: integer
        comment:
          type: string
        date:
          format: date-time
          type: string
        createdBy:
          $ref: '#/components/schemas/EventUser'
        publishedBy:
          $ref: '#/components/schemas/EventUser'
      required:
      - version
      - comment
      - date
      additionalProperties: false
    FeatureSafeRolloutRule:
      allOf:
      - description: 'Common fields shared by all feature rule types. Specific rule types extend

          this base with their own required properties (value, coverage, etc.).

          '
        type: object
        properties:
          description:
            type: string
            maxLength: 10000
          condition:
            type: string
          id:
            type: string
          enabled:
            type: boolean
          scheduleRules:
            description: Simple time-based on/off schedule for this rule
            type: array
            items:
              $ref: '#/components/schemas/ScheduleRule'
          scheduleType:
            description: 'UI hint for which scheduling mode is active:

              - `none` – no schedule

              - `schedule` – simple time-based enable/disable via `scheduleRules`

              - `ramp` – multi-step ramp-up controlled by an associated RampSchedule document

              '
            type: string
            enum:
            - none
            - schedule
            - ramp
          rampScheduleId:
            description: ID of the active RampSchedule document controlling this rule. Present when `scheduleType` is `ramp` and a live schedule exists.
            type: string
          savedGroupTargeting:
            type: array
            items:
              type: object
              properties:
                matchType:
                  type: string
                  enum:
                  - all
                  - any
                  - none
                savedGroups:
                  type: array
                  items:
                    type: string
              required:
              - matchType
              - savedGroups
              additionalProperties: false
          prerequisites:
            type: array
            items:
              type: object
              properties:
                id:
                  description: Feature ID of the prerequisite
                  type: string
                condition:
                  type: string
              required:
              - id
              - condition
              additionalProperties: false
          allProjects:
            description: When true (the default) the rule applies to every project the feature is delivered to. When false the rule is limited to `projects`.
            type: boolean
          projects:
            description: Project IDs this rule is scoped to when `allProjects` is false. An empty array scopes the rule to no project.
            type: array
            items:
              type: string
        required:
        - description
        - id
        - enabled
        additionalProperties: false
      - type: object
        properties:
          type:
            type: string
            const: safe-rollout
          controlValue:
            type: string
          variationValue:
            type: string
          seed:
            type: string
          hashAttribute:
            type: string
          trackingKey:
            type: string
          safeRolloutId:
            type: string
          status:
            type: string
            enum:
            - running
            - released
            - rolled-back
            - stopped
        required:
        - type
        - controlValue
        - variationValue
        additionalProperties: false
    FeatureBaseRule:
      type: object
      properties:
        description:
          type: string
          maxLength: 10000
        condition:
          type: string
        id:
          type: string
        enabled:
          type: boolean
        scheduleRules:
          description: Simple time-based on/off schedule for this rule
          type: array
          items:
            $ref: '#/components/schemas/ScheduleRule'
        scheduleType:
          description: 'UI hint for which scheduling mode is active:

            - `none` – no schedule

            - `schedule` – simple time-based enable/disable via `scheduleRules`

            - `ramp` – multi-step ramp-up controlled by an associated RampSchedule document

            '
          type: string
          enum:
          - none
          - schedule
          - ramp
        rampScheduleId:
          description: ID of the active RampSchedule document controlling this rule. Present when `scheduleType` is `ramp` and a live schedule exists.
          type: string
        savedGroupTargeting:
          type: array
          items:
            type: object
            properties:
              matchType:
                type: string
                enum:
                - all
                - any
                - none
              savedGroups:
                type: array
                items:
                  type: string
            required:
            - matchType
            - savedGroups
            additionalProperties: false
        prerequisites:
          type: array
          items:
            type: object
            properties:
              id:
                description: Feature ID of the prerequisite
                type: string
              condition:
                type: string
            required:
            - id
            - condition
            additionalProperties: false
        allProjects:
          description: When true (the default) the rule applies to every project the feature is delivered to. When false the rule is limited to `projects`.
          type: boolean
        projects:
          description: Project IDs this rule is scoped to when `allProjects` is false. An empty array scopes the rule to no project.
          type: array
          items:
            type: string
      required:
      - description
      - id
      - enabled
      additionalProperties: false
    FeatureRevisionV2:
      type: object
      properties:
        id:
          description: Stable revision id. Newer revisions carry opaque ids; older ones a derived `frev_<version>_<featureId>` form. Both work wherever revision ids are accepted.
          type: string
        featureId:
          description: The feature this revision belongs to
          type: string
        baseVersion:
          type: integer
        version:
          type: integer
        comment:
          type: string
        date:
