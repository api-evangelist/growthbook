        publishedBy:
          $ref: '#/components/schemas/EventUser'
        defaultValue:
          description: The default value at the time this revision was created. When the feature is in Config mode, this is the JSON override patch merged on top of the config (its own keys win); otherwise it is the full value.
          type: string
        defaultValueConfig:
          description: Optional. A config within `baseConfig`'s family that the default value resolves to instead of `baseConfig` itself. null or omitted means the default is `baseConfig`. The default is exactly this config and carries no overrides of its own.
