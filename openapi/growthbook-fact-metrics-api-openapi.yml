openapi: 3.2.0
info:
  version: 5.1.0
  title: GrowthBook REST Fact Metrics API
  description: 'GrowthBook offers a full REST API for interacting with the application. Request data can use either JSON or Form data encoding (with proper `Content-Type` headers). All response bodies are JSON-encoded. The API base URL for GrowthBook Cloud is `https://api.growthbook.io/api`. For self-hosted deployments, it is the same as your API_HOST environment variable (defaults to `http://localhost:3100/api`). The rest of these docs will assume you are using GrowthBook Cloud. ## Versioning


    Endpoints are versioned by path prefix:


    - `/v1/...` — stable, widely-supported endpoints

    - `/v2/...` — updated endpoints with improved shapes (e.g. unified per-rule environment scope for feature flags)


    New integrations should prefer v2 where available. Feature-flag and metric v1 routes are deprecated: they are tagged **LEGACY** in the sidebar and collapsed by default. Use the matching v2 group when both exist. ## Authentication


    We support both the HTTP Basic and Bearer authentication schemes for convenience. You first need to generate a new API Key in GrowthBook. Different keys have different permissions:


    - **Personal Access Tokens**: These are sensitive and provide the same level of access as the user has to an organization, or less if the token''s permissions are limited. These can be created by going to `Personal Access Tokens` under your user menu. Members with the API Keys **Manage members'' tokens** permission can disable a member''s token under `Settings -> Manage PATs`, and admins can require new tokens to expire within a maximum lifetime. - **Secret Keys**: These are sensitive and provide the level of access of the role they are given, which can be any built-in or custom role, with optional per-project role overrides and environment limits. Managing Secret Keys on behalf of an organization takes the API Keys permissions. These can be created by going to `Settings -> API Keys`, where Admins can also require new Secret Keys to expire within a maximum lifetime. If using HTTP Basic auth, pass the Secret Key as the username and leave the password blank (when using curl, add `:` at the end of the secret to indicate an empty password)


    ```bash

    curl https://api.growthbook.io/api/v1/features \

    -u secret_abc123DEF456:

    ```


    If using Bearer auth, pass the Secret Key as the token:


    ```bash

    curl https://api.growthbook.io/api/v1/features \

    -H "Authorization: Bearer secret_abc123DEF456"

    ```


    If a key has an expiration date, every response includes it in the `X-GrowthBook-Key-Expires-At` header (ISO 8601), so scripts can warn before the key stops working. Requests made with an expired key fail with a `401` that says where to create a replacement. See Expiration for choosing a key''s expiration, the warnings before it lapses, and the organization policies. ## Naming who asked


    Requests made with a Secret Key may add an `X-GrowthBook-Requested-By` header naming the organization member who asked for the change, as a user id or an email address. History, revision logs and webhooks show that member next to the key. Each key''s settings under `Settings -> API Keys`:


    - **Header**: **Optional** (the default) uses the header when it''s sent, **Required** rejects requests without it, and **Rejected** rejects requests that send it, each with a 400. - **Permissions**, when a member is named:

    - **Assume member''s role** (the default): the request acts as that member, with only what both the key and the member can do, so the header can narrow a key but never widen it. Drafts, owners, `mine` filters and reviews are the member''s. The member''s rights over their own drafts, comments and verdicts apply only where the key''s own role allows the same action. - **Use key''s role**: the key acts as itself, with its own permissions, and the name is only recorded in history. Drafts, verdicts and ownership are the key''s, as when no member is named.'
servers:
- url: https://api.growthbook.io/api
  description: GrowthBook Cloud
- url: https://{domain}/api
  description: Self-hosted GrowthBook
  variables:
    domain:
      default: localhost:3100
      description: Your self-hosted GrowthBook host (and port)
security:
- bearerAuth: []
- basicAuth: []
tags:
- name: fact-metrics
  x-displayName: Fact Metrics
  description: Fact Metrics are metrics built on top of Fact Table definitions
paths:
  /v1/fact-metrics:
    get:
      operationId: listFactMetrics
      summary: Get all fact metrics
      tags:
      - fact-metrics
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/datasourceId'
      - $ref: '#/components/parameters/projectId'
      - name: factTableId
        in: query
        description: Filter by Fact Table Id (for ratio metrics, only the numerator is considered)
        schema:
          description: Filter by Fact Table Id (for ratio metrics, only the numerator is considered)
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    factMetrics:
                      type: array
                      items:
                        $ref: '#/components/schemas/FactMetric'
                  required:
                  - factMetrics
                  additionalProperties: false
                - $ref: '#/components/schemas/PaginationFields'
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v1/fact-metrics' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
    post:
      operationId: postFactMetric
      summary: Create a single fact metric
      tags:
      - fact-metrics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: Short display name (e.g. `Purchases per user`). Put the definition in `description`.
                  type: string
                description:
                  description: Markdown. Put context here, not in the name.
                  type: string
                  maxLength: 10000
                owner:
                  description: The userId or email address of the owner. If an email address is provided, it will be used to look up the userId of the matching organization member. If an ID is provided, it will be validated as existing in the organization.
                  type: string
                projects:
                  type: array
                  items:
                    type: string
                tags:
                  description: Tags for filtering and grouping. Use these instead of encoding groups in names.
                  type: array
                  items:
                    type: string
                metricType:
                  type: string
                  enum:
                  - proportion
                  - retention
                  - mean
                  - quantile
                  - ratio
                  - dailyParticipation
                  - funnel
                numerator:
                  anyOf:
                  - type: object
                    properties:
                      factTableId:
                        type: string
                      column:
                        description: 'Must be empty for proportion metrics and dailyParticipation metrics. Otherwise, the column name or one of the special values: ''$$distinctUsers'' or ''$$count'' (or ''$$distinctDates'' if metricType is ''mean'' or ''ratio'' or ''quantile'' and quantileSettings.type is ''unit'')'
                        type: string
                      aggregation:
                        description: 'User aggregation of selected column. Either sum or max for numeric columns; count distinct for string columns; hll merge / kll merge for pre-built sketch columns (requires data-source support); ignored for special columns. Default: sum. If you specify a string column you must explicitly specify count distinct. Not used for proportion metrics; for event quantile metrics only kll merge is applicable.'
                        type: string
                        enum:
                        - sum
                        - max
                        - count distinct
                        - hll merge
                        - kll merge
                      filters:
                        deprecated: true
                        description: Array of Fact Table Filter Ids. Deprecated, use rowFilters instead.
                        type: array
                        items:
                          type: string
                      inlineFilters:
                        deprecated: true
                        description: Inline filters to apply to the fact table. Keys are column names, values are arrays of values to filter by. Deprecated, use rowFilters instead.
                        type: object
                        propertyNames:
                          type: string
                        additionalProperties:
                          type: array
                          items:
                            type: string
                      rowFilters:
                        description: Filters to apply to the rows of the fact table before aggregation.
                        type: array
                        items:
                          type: object
                          properties:
                            operator:
                              type: string
                              enum:
                              - '='
                              - '!='
                              - '>'
                              - <
                              - '>='
                              - <=
                              - between
                              - not_between
                              - in
                              - not_in
                              - is_null
                              - not_null
                              - is_true
                              - is_false
                              - contains
                              - not_contains
                              - matches_pattern
                              - not_matches_pattern
                              - starts_with
                              - ends_with
                              - sql_expr
                              - saved_filter
                            values:
                              description: Not required for is_null, not_null, is_true, is_false operators. The between and not_between operators take at most two values, a lower and an upper bound in that order; leave a bound as an empty string for an open-ended range.
                              type: array
                              items:
                                type: string
                            column:
                              description: Required for all operators except sql_expr and saved_filter.
                              type: string
                          required:
                          - operator
                          additionalProperties: false
                      aggregateFilterColumn:
                        description: Column to use to filter users after aggregation. Either '$$count' of rows or the name of a numeric column that will be summed by user. Must specify `aggregateFilter` if using this. Only can be used with 'retention' and 'proportion' metrics.
                        type: string
                      aggregateFilter:
                        description: Simple comparison operator and value to apply after aggregation (e.g. '= 10' or '>= 1'). Requires `aggregateFilterColumn`.
                        type: string
                    required:
                    - factTableId
                    additionalProperties: false
                  - type: 'null'
                denominator:
                  description: Only when metricType is 'ratio'
                  type: object
                  properties:
                    factTableId:
                      type: string
                    column:
                      description: 'The column name or one of the special values: ''$$distinctUsers'' or ''$$count'' (or ''$$distinctDates'' if metricType is ''mean'' or ''ratio'' or ''quantile'' and quantileSettings.type is ''unit'')'
                      type: string
                    aggregation:
                      description: 'User aggregation of selected column. Either sum or max for numeric columns; count distinct for string columns; hll merge / kll merge for pre-built sketch columns (requires data-source support); ignored for special columns. Default: sum. If you specify a string column you must explicitly specify count distinct. Not used for proportion metrics; for event quantile metrics only kll merge is applicable.'
                      type: string
                      enum:
                      - sum
                      - max
                      - count distinct
                      - hll merge
                      - kll merge
                    filters:
                      deprecated: true
                      description: Array of Fact Table Filter Ids. Deprecated, use rowFilters instead.
                      type: array
                      items:
                        type: string
                    inlineFilters:
                      deprecated: true
                      description: Inline filters to apply to the fact table. Keys are column names, values are arrays of values to filter by. Deprecated, use rowFilters instead.
                      type: object
                      propertyNames:
                        type: string
                      additionalProperties:
                        type: array
                        items:
                          type: string
                    rowFilters:
                      description: Filters to apply to the rows of the fact table before aggregation.
                      type: array
                      items:
                        type: object
                        properties:
                          operator:
                            type: string
                            enum:
                            - '='
                            - '!='
                            - '>'
                            - <
                            - '>='
                            - <=
                            - between
                            - not_between
                            - in
                            - not_in
                            - is_null
                            - not_null
                            - is_true
                            - is_false
                            - contains
                            - not_contains
                            - matches_pattern
                            - not_matches_pattern
                            - starts_with
                            - ends_with
                            - sql_expr
                            - saved_filter
                          values:
                            description: Not required for is_null, not_null, is_true, is_false operators. The between and not_between operators take at most two values, a lower and an upper bound in that order; leave a bound as an empty string for an open-ended range.
                            type: array
                            items:
                              type: string
                          column:
                            description: Required for all operators except sql_expr and saved_filter.
                            type: string
                        required:
                        - operator
                        additionalProperties: false
                  required:
                  - factTableId
                  - column
                  additionalProperties: false
                inverse:
                  description: Set to true for things like Bounce Rate, where you want the metric to decrease
                  type: boolean
                quantileSettings:
                  description: Controls the settings for quantile metrics (mandatory if metricType is "quantile")
                  type: object
                  properties:
                    type:
                      description: Whether the quantile is over unit aggregations or raw event values
                      type: string
                      enum:
                      - event
                      - unit
                    ignoreZeros:
                      description: If true, zero values will be ignored when calculating the quantile
                      type: boolean
                    quantile:
                      description: The quantile value (from 0.001 to 0.999)
                      type: number
                      minimum: 0.001
                      maximum: 0.999
                      multipleOf: 0.001
                    quantileEventCountColumn:
                      description: Optional override for the source-column name used to recover per-row event counts when numerator.aggregation is 'kll merge'. Defaults to '<numerator.column>_n_events'. Only valid for event-quantile metrics with a 'kll merge' numerator.
                      type: string
                  required:
                  - type
                  - ignoreZeros
                  - quantile
                  additionalProperties: false
                funnelSettings:
                  description: Funnel metric settings (required when metricType is "funnel")
                  type: object
                  properties:
                    steps:
                      description: Ordered list of funnel steps. Minimum 2 steps required.
                      minItems: 2
                      maxItems: 20
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            description: Display name for the funnel step
                            type: string
                          factTableId:
                            description: The fact table this step draws events from
                            type: string
                          rowFilters:
                            description: Filters that decide whether an event row counts as this step
                            type: array
                            items:
                              type: object
                              properties:
                                operator:
                                  type: string
                                  enum:
                                  - '='
                                  - '!='
                                  - '>'
                                  - <
                                  - '>='
                                  - <=
                                  - between
                                  - not_between
                                  - in
                                  - not_in
                                  - is_null
                                  - not_null
                                  - is_true
                                  - is_false
                                  - contains
                                  - not_contains
                                  - matches_pattern
                                  - not_matches_pattern
                                  - starts_with
                                  - ends_with
                                  - sql_expr
                                  - saved_filter
                                values:
                                  description: Not required for is_null, not_null, is_true, is_false operators. The between and not_between operators take at most two values, a lower and an upper bound in that order; leave a bound as an empty string for an open-ended range.
                                  type: array
                                  items:
                                    type: string
                                column:
                                  description: Required for all operators except sql_expr and saved_filter.
                                  type: string
                              required:
                              - operator
                              additionalProperties: false
                          optional:
                            description: When true, this step still counts for its own conversion but does not anchor later steps. Later steps window off the nearest prior required step (or exposure, for experiment funnel metrics, when every prior step is optional).
                            type: boolean
                          conversionWindow:
                            anyOf:
                            - description: Bounds how long after the nearest prior required step (or exposure, for the first step / after only-optional priors of an experiment funnel metric) this step's event can occur.
                              type: object
                              properties:
                                unit:
                                  type: string
                                  enum:
                                  - weeks
                                  - days
                                  - hours
                                  - minutes
                                value:
                                  type: number
                                  exclusiveMinimum: 0
                              required:
                              - unit
                              - value
                              additionalProperties: false
                            - type: 'null'
                        required:
                        - name
                        - factTableId
                        - rowFilters
                        - optional
                        additionalProperties: false
                    ordering:
                      description: Step ordering mode. Only 'sequential' is supported in v1.
                      type: string
                      enum:
                      - sequential
                    concurrencyWindowSeconds:
                      description: Out-of-order tolerance between adjacent steps in seconds. Defaults to 0.
                      type: integer
                      minimum: 0
                  required:
                  - steps
                  additionalProperties: false
                cappingSettings:
                  description: 'Upper cap. Omit on update to preserve it. Use type: none to disable it explicitly. Invalid values are rejected.'
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                      - none
                      - absolute
                      - percentile
                    value:
                      description: When type is absolute, this must be a finite number greater than zero. When type is percentile, this must be strictly between 0 and 1. Required when enabling capping or changing type; omitted values are preserved only for same-type updates.
                      type: number
                    ignoreZeros:
                      description: If true and capping is `percentile`, zeros will be ignored when calculating the percentile.
                      type: boolean
                  required:
                  - type
                  additionalProperties: false
                lowerCappingSettings:
                  description: 'Independent lower cap. Omit on update to preserve it. Use null or type: none to disable it explicitly. Invalid values are rejected. For mixed cap types, the absolute bound takes precedence if thresholds cross.'
                  anyOf:
                  - description: Independent lower-tail capping settings. Configured separately from the upper tail, so the type can differ.
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - none
                        - absolute
                        - percentile
                      value:
                        description: When type is absolute, this is a finite lower bound, including zero or negative values. When type is percentile, this must be strictly between 0 and 1. Required when enabling capping or changing type; omitted values are preserved only for same-type updates.
                        type: number
                      ignoreZeros:
                        description: If true and capping is `percentile`, zeros will be ignored when calculating the percentile.
                        type: boolean
                    required:
                    - type
                    additionalProperties: false
                  - type: 'null'
                windowSettings:
                  description: Controls the conversion window for the metric
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                      - none
                      - conversion
                      - lookback
                    delayHours:
                      deprecated: true
                      description: Wait this many hours after experiment exposure before counting conversions. Ignored if delayValue is set.
                      type: number
                    delayValue:
                      description: Wait this long after experiment exposure before counting conversions.
                      type: number
                    delayUnit:
                      description: Default `hours`.
                      type: string
                      enum:
                      - minutes
                      - hours
                      - days
                      - weeks
                    windowValue:
                      type: number
                    windowUnit:
                      description: Default `hours`.
                      type: string
                      enum:
                      - minutes
                      - hours
                      - days
                      - weeks
                  required:
                  - type
                  additionalProperties: false
                priorSettings:
                  description: Controls the bayesian prior for the metric. If omitted, organization defaults will be used.
                  type: object
                  properties:
                    override:
                      description: If false, the organization default settings will be used instead of the other settings in this object
                      type: boolean
                    proper:
                      description: If true, the `mean` and `stddev` will be used, otherwise we will use an improper flat prior.
                      type: boolean
                    mean:
                      description: The mean of the prior distribution of relative effects in proportion terms (e.g. 0.01 is 1%)
                      type: number
                    stddev:
                      description: Must be > 0. The standard deviation of the prior distribution of relative effects in proportion terms.
                      type: number
                      exclusiveMinimum: 0
                  required:
                  - override
                  - proper
                  - mean
                  - stddev
                  additionalProperties: false
                regressionAdjustmentSettings:
                  description: Controls the regression adjustment (CUPED) settings for the metric
                  type: object
                  properties:
                    override:
                      description: If false, the organization default settings will be used
                      type: boolean
                    enabled:
                      description: Controls whether or not regression adjustment is applied to the metric
                      type: boolean
                    days:
                      description: Number of pre-exposure days to use for the regression adjustment
                      type: number
                  required:
                  - override
                  additionalProperties: false
                riskThresholdSuccess:
                  deprecated: true
                  description: No longer used. Threshold for Risk to be considered low enough, as a proportion (e.g. put 0.0025 for 0.25%). <br/> Must be a non-negative number and must not be higher than `riskThresholdDanger`.
                  type: number
                  minimum: 0
                riskThresholdDanger:
                  deprecated: true
                  description: No longer used. Threshold for Risk to be considered too high, as a proportion (e.g. put 0.0125 for 1.25%). <br/> Must be a non-negative number.
                  type: number
                  minimum: 0
                displayAsPercentage:
                  description: If true and the metric is a ratio or dailyParticipation metric, variation means will be displayed as a percentage. Defaults to true for dailyParticipation metrics and false for ratio metrics.
                  type: boolean
                minPercentChange:
                  description: Minimum percent change to consider uplift significant, as a proportion (e.g. put 0.005 for 0.5%)
                  type: number
                  minimum: 0
                maxPercentChange:
                  description: Maximum percent change to consider uplift significant, as a proportion (e.g. put 0.5 for 50%)
                  type: number
                  minimum: 0
                minSampleSize:
                  type: number
                  minimum: 0
                targetMDE:
                  description: The percentage change that you want to reliably detect before ending an experiment, as a proportion (e.g. put 0.1 for 10%). This is used to estimate the "Days Left" for running experiments.
                  type: number
                  minimum: 0
                managedBy:
                  description: Set this to "api" to disable editing in the GrowthBook UI
                  type: string
                  enum:
                  - ''
                  - api
                  - admin
                metricAutoSlices:
                  description: Array of slice column names that will be automatically included in metric analysis. This is an enterprise feature.
                  type: array
                  items:
                    type: string
                replaces:
                  description: Ids of older metrics (legacy or fact) that this metric supersedes, for example the legacy metric it was migrated from. Cannot include this metric's own id. Informational only - GrowthBook uses it to link the old and new definitions in the UI and to keep showing results from a snapshot that was created before an experiment switched to this metric. This field can only be set through the API.
                  type: array
                  items:
                    type: string
              required:
              - name
              - metricType
              additionalProperties: false
      responses:
        '200':
          description: Resource created
          content:
            application/json:
              schema:
                type: object
                properties:
                  factMetric:
                    $ref: '#/components/schemas/FactMetric'
                required:
                - factMetric
                additionalProperties: false
        '202':
          $ref: '#/components/responses/ConfirmationHeld'
      x-codeSamples:
      - lang: cURL
        source: "curl -X POST 'https://api.growthbook.io/api/v1/fact-metrics' \\\n  -H 'Authorization: Bearer YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"name\":\"Purchased\",\"metricType\":\"proportion\",\"numerator\":{\"factTableId\":\"ftb_abc123\",\"column\":\"$$distinctUsers\",\"filters\":[]},\"priorSettings\":{\"override\":false,\"proper\":false,\"mean\":0,\"stddev\":0.3}}'"
  /v1/fact-metrics/{id}:
    get:
      operationId: getFactMetric
      summary: Get a single fact metric
      tags:
      - fact-metrics
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  factMetric:
                    $ref: '#/components/schemas/FactMetric'
                required:
                - factMetric
                additionalProperties: false
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v1/fact-metrics/abc123' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
    post:
      operationId: updateFactMetric
      summary: Update a single fact metric
      tags:
      - fact-metrics
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: Short display name (e.g. `Purchases per user`). Put the definition in `description`.
                  type: string
                description:
                  description: Markdown. Put context here, not in the name.
                  type: string
                  maxLength: 10000
                owner:
                  description: The userId or email address of the owner. If an email address is provided, it will be used to look up the userId of the matching organization member. If an ID is provided, it will be validated as existing in the organization.
                  type: string
                projects:
                  type: array
                  items:
                    type: string
                tags:
                  description: Tags for filtering and grouping. Use these instead of encoding groups in names.
                  type: array
                  items:
                    type: string
                metricType:
                  type: string
                  enum:
                  - proportion
                  - retention
                  - mean
                  - quantile
                  - ratio
                  - dailyParticipation
                  - funnel
                numerator:
                  anyOf:
                  - type: object
                    properties:
                      factTableId:
                        type: string
                      column:
                        description: 'Must be empty for proportion metrics and dailyParticipation metrics. Otherwise, the column name or one of the special values: ''$$distinctUsers'' or ''$$count'' (or ''$$distinctDates'' if metricType is ''mean'' or ''ratio'' or ''quantile'' and quantileSettings.type is ''unit'')'
                        type: string
                      aggregation:
                        description: 'User aggregation of selected column. Either sum or max for numeric columns; count distinct for string columns; hll merge / kll merge for pre-built sketch columns (requires data-source support); ignored for special columns. Default: sum. If you specify a string column you must explicitly specify count distinct. Not used for proportion metrics; for event quantile metrics only kll merge is applicable.'
                        type: string
                        enum:
                        - sum
                        - max
                        - count distinct
                        - hll merge
                        - kll merge
                      filters:
                        deprecated: true
                        description: Array of Fact Table Filter Ids. Deprecated, use rowFilters instead.
                        type: array
                        items:
                          type: string
                      inlineFilters:
                        deprecated: true
                        description: Inline filters to apply to the fact table. Keys are column names, values are arrays of values to filter by. Deprecated, use rowFilters instead.
                        type: object
                        propertyNames:
                          type: string
                        additionalProperties:
                          type: array
                          items:
                            type: string
                      rowFilters:
                        description: Filters to apply to the rows of the fact table before aggregation.
                        type: array
                        items:
                          type: object
                          properties:
                            operator:
                              type: string
                              enum:
                              - '='
                              - '!='
                              - '>'
                              - <
                              - '>='
                              - <=
                              - between
                              - not_between
                              - in
                              - not_in
                              - is_null
                              - not_null
                              - is_true
                              - is_false
                              - contains
                              - not_contains
                              - matches_pattern
                              - not_matches_pattern
                              - starts_with
                              - ends_with
                              - sql_expr
                              - saved_filter
                            values:
                              description: Not required for is_null, not_null, is_true, is_false operators. The between and not_between operators take at most two values, a lower and an upper bound in that order; leave a bound as an empty string for an open-ended range.
                              type: array
                              items:
                                type: string
                            column:
                              description: Required for all operators except sql_expr and saved_filter.
                              type: string
                          required:
                          - operator
                          additionalProperties: false
                      aggregateFilterColumn:
                        description: Column to use to filter users after aggregation. Either '$$count' of rows or the name of a numeric column that will be summed by user. Must specify `aggregateFilter` if using this. Only can be used with 'retention' and 'proportion' metrics.
                        type: string
                      aggregateFilter:
                        description: Simple comparison operator and value to apply after aggregation (e.g. '= 10' or '>= 1'). Requires `aggregateFilterColumn`.
                        type: string
                    required:
                    - factTableId
                    additionalProperties: false
                  - type: 'null'
                denominator:
                  description: Only when metricType is 'ratio'
                  type: object
                  properties:
                    factTableId:
                      type: string
                    column:
                      description: 'The column name or one of the special values: ''$$distinctUsers'' or ''$$count'' (or ''$$distinctDates'' if metricType is ''mean'' or ''ratio'' or ''quantile'' and quantileSettings.type is ''unit'')'
                      type: string
                    aggregation:
                      description: 'User aggregation of selected column. Either sum or max for numeric columns; count distinct for string columns; hll merge / kll merge for pre-built sketch columns (requires data-source support); ignored for special columns. Default: sum. If you specify a string column you must explicitly specify count distinct. Not used for proportion metrics; for event quantile metrics only kll merge is applicable.'
                      type: string
                      enum:
                      - sum
                      - max
                      - count distinct
                      - hll merge
                      - kll merge
                    filters:
                      deprecated: true
                      description: Array of Fact Table Filter Ids. Deprecated, use rowFilters instead.
                      type: array
                      items:
                        type: string
                    inlineFilters:
                      deprecated: true
                      description: Inline filters to apply to the fact table. Keys are column names, values are arrays of values to filter by. Deprecated, use rowFilters instead.
                      type: object
                      propertyNames:
                        type: string
                      additionalProperties:
                        type: array
                        items:
                          type: string
                    rowFilters:
                      description: Filters to apply to the rows of the fact table before aggregation.
                      type: array
                      items:
                        type: object
                        properties:
                          operator:
                            type: string
                            enum:
                            - '='
                            - '!='
                            - '>'
                            - <
                            - '>='
                            - <=
                            - between
                            - not_between
                            - in
                            - not_in
                            - is_null
                            - not_null
                            - is_true
                            - is_false
                            - contains
                            - not_contains
                            - matches_pattern
                            - not_matches_pattern
                            - starts_with
                            - ends_with
                            - sql_expr
                            - saved_filter
                          values:
                            description: Not required for is_null, not_null, is_true, is_false operators. The between and not_between operators take at most two values, a lower and an upper bound in that order; leave a bound as an empty string for an open-ended range.
                            type: array
                            items:
                              type: string
                          column:
                            description: Required for all operators except sql_expr and saved_filter.
                            type: string
                        required:
                        - operator
                        additionalProperties: false
                  required:
                  - factTableId
                  - column
                  additionalProperties: false
                inverse:
                  description: Set to true for things like Bounce Rate, where you want the metric to decrease
                  type: boolean
                quantileSettings:
                  description: Controls the settings for quantile metrics (mandatory if metricType is "quantile")
                  type: object
                  properties:
                    type:
                      description: Whether the quantile is over unit aggregations or raw event values
                      type: string
                      enum:
                      - event
                      - unit
                    ignoreZeros:
                      description: If true, zero values will be ignored when calculating the quantile
                      type: boolean
                    quantile:
                      description: The quantile value (from 0.001 to 0.999)
                      type: number
                      minimum: 0.001
                      maximum: 0.999
                      multipleOf: 0.001
                    quantileEventCountColumn:
                      description: Optional override for the source-column name used to recover per-row event counts when numerator.aggregation is 'kll merge'. Defaults to '<numerator.column>_n_events'. Only valid for event-quantile metrics with a 'kll merge' numerator.
                      type: string
                  required:
                  - type
                  - ignoreZeros
                  - quantile
                  additionalProperties: false
                funnelSettings:
                  description: Funnel metric settings (required when metricType is "funnel")
                  type: object
                  properties:
                    steps:
                      description: Ordered list of funnel steps. Minimum 2 steps required.
                      minItems: 2
                      maxItems: 20
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            description: Display name for the funnel step
                            type: string
                          factTableId:
                            description: The fact table this step draws events from
                            type: string
                          rowFilters:
                            description: Filters that decide whether an event row counts as this step
                            type: array
                            items:
                              type: object
                              properties:
                                operator:
                                  type: string
                                  enum:
                                  - '='
                                  - '!='
                                  - '>'
                                  - <
                                  - '>='
                                  - <=
                                  - between
                                  - not_between
                                  - in
                                  - not_in
                                  - is_null
                                  - not_null
                                  - is_true
                                  - is_false
                                  - contains
                                  - not_contains
                                  - matches_pattern
                                  - not_matches_pattern
                                  - starts_with
                                  - ends_with
                                  - sql_expr
                                  - saved_filter
                                values:
                                  description: Not required for is_null, not_null, is_true, is_false operators. The between and not_between operators take at most two values, a lower and an upper bound in that order; leave a bound as an empty string for an open-ended range.
                                  type: array
                                  items:
                                    type: string
                                column:
                                  description: Required for all operators except sql_expr and saved_filter.
                                  type: string
                              required:
                              - operator
                              additionalProperties: false
                          optional:
                            description: When true, this step still counts for its own conversion but does not anchor later steps. Later steps window off the nearest prior required step (or exposure, for experiment funnel metrics, when every prior step is optional).
                            type: boolean
                          conversionWindow:
                            anyOf:
                            - description: Bounds how long after the nearest prior required step (or exposure, for the first step / after only-optional priors of an experiment funnel metric) this step's event can occur.
                              type: object
                              properties:
                                unit:
                                  type: string
                                  enum:
                                  - weeks
                                  - days
                                  - hours
                                  - minutes
                                value:
                                  type: number
                                  exclusiveMinimum: 0
                              required:
                              - unit
                              - value
                              additionalProperties: false
                            - type: 'null'
                        required:
                        - name
                        - factTableId
                        - rowFilters
                        - optional
                        additionalProperties: false
                    ordering:
                      description: Step ordering mode. Only 'sequential' is supported in v1.
                      type: string
                      enum:
                      - sequential
                    concurrencyWindowSeconds:
                      description: Out-of-order tolerance between adjacent steps in seconds. Defaults to 0.
                      type: integer
                      minimum: 0
                  required:
                  - steps
                  additionalProperties: false
                cappingSettings:
                  description: 'Upper cap. Omit on update to preserve it. Use type: none to disable it explicitly. Invalid values are rejected.'
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                      - none
                      - absolute
                      - percentile
                    value:
                      description: When type is absolute, this must be a finite number greater than zero. When type is percentile, this must be strictly between 0 and 1. Required when enabling capping or changing type; omitted values are preserved only for same-type updates.
                      type: number
                    ignoreZeros:
                      description: If true and capping is `percentile`, zeros will be ignored when calculating the percentile.
                      type: boolean
                  required:
                  - type
                  additionalProperties: false
                lowerCappingSettings:
                  description: 'Independent lower cap. Omit on update to preserve it. Use null or type: none to disable it explicitly. Invalid values are rejected. For mixed cap types, the absolute bound takes precedence if thresholds cross.'
                  anyOf:
                  - description: Independent lower-tail capping settings. Configured separately from the upper tail, so the type can differ.
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - none
                        - absolute
                        - percentile
                      value:
                        description: When type is absolute, this is a finite lower bound, including zero or negative values. When type is percentile, this must be strictly between 0 and 1. Required when enabling capping or changing type; omitted values are preserved only for same-type updates.
                        type: number
                      ignoreZeros:
                        description: If true and capping is `percentile`, zeros will be ignored when calculating the percentile.
                        type: boolean
                    required:
                    - type
                    additionalProperties: false
                  - type: 'null'
