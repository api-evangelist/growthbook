              description: When type is absolute, this is the absolute value. When type is percentile, this is the percentile value (from 0.0 to 1.0).
              type: number
            ignoreZeros:
              description: If true and capping is `percentile`, zeros will be ignored when calculating the percentile.
              type: boolean
          required:
          - type
          additionalProperties: false
        lowerCappingSettings:
          anyOf:
          - description: Independent lower-tail capping settings. Configured separately from the upper tail, so the type can differ.
            type: object
            properties:
              type:
                type: string
                enum:
                - none
                - absolute
                - percentile
              value:
                description: When type is absolute, this is the lower bound. When type is percentile, this is the lower percentile (from 0.0 to 1.0).
                type: number
              ignoreZeros:
                description: If true and capping is `percentile`, zeros will be ignored when calculating the percentile.
                type: boolean
            required:
            - type
            additionalProperties: false
          - type: 'null'
        windowSettings:
          description: Controls the conversion window for the metric
          type: object
          properties:
            type:
              type: string
              enum:
              - none
              - conversion
              - lookback
            delayValue:
              description: Wait this long after experiment exposure before counting conversions.
              type: number
            delayUnit:
              type: string
              enum:
              - minutes
              - hours
              - days
              - weeks
            windowValue:
              type: number
            windowUnit:
              type: string
              enum:
              - minutes
              - hours
              - days
              - weeks
          required:
          - type
          additionalProperties: false
        priorSettings:
          description: Controls the bayesian prior for the metric
          type: object
          properties:
            override:
              description: If false, the organization default settings will be used instead of the other settings in this object
              type: boolean
            proper:
              description: If true, the `mean` and `stddev` will be used, otherwise we will use an improper flat prior.
              type: boolean
            mean:
              description: The mean of the prior distribution of relative effects in proportion terms (e.g. 0.01 is 1%)
              type: number
            stddev:
              description: Must be > 0. The standard deviation of the prior distribution of relative effects in proportion terms.
              type: number
          required:
          - override
          - proper
          - mean
          - stddev
          additionalProperties: false
        regressionAdjustmentSettings:
          description: Controls the regression adjustment (CUPED) settings for the metric
          type: object
          properties:
            override:
              description: If false, the organization default settings will be used
              type: boolean
            enabled:
              description: Controls whether or not regression adjustment is applied to the metric
              type: boolean
            days:
              description: Number of pre-exposure days to use for the regression adjustment
              type: number
          required:
          - override
          additionalProperties: false
        riskThresholdSuccess:
          type: number
        riskThresholdDanger:
          type: number
        displayAsPercentage:
          description: If true and the metric is a ratio metric, variation means will be displayed as a percentage
          type: boolean
        minPercentChange:
          type: number
        maxPercentChange:
          type: number
        minSampleSize:
          type: number
        targetMDE:
          type: number
        managedBy:
          description: Where this fact metric must be managed from. If not set (empty string), it can be managed from anywhere.
          type: string
          enum:
          - ''
          - api
          - admin
        dateCreated:
          format: date-time
          type: string
        dateUpdated:
          format: date-time
          type: string
        archived:
          type: boolean
        metricAutoSlices:
          description: Array of slice column names that will be automatically included in metric analysis. This is an enterprise feature.
          type: array
          items:
            type: string
        replaces:
          description: Ids of older metrics (legacy or fact) that this metric supersedes, for example the legacy metric it was migrated from. Informational only - GrowthBook uses it to link the old and new definitions in the UI and to keep showing results from a snapshot that was created before an experiment switched to this metric.
          type: array
          items:
            type: string
