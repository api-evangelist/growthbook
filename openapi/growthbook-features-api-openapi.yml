  /v1/features/{id}/toggle:
    post:
      operationId: toggleFeature
      summary: Toggle a feature in one or more environments
      description: '**Deprecated.** Use [POST /v2/features/:id/toggle](#operation/toggleFeatureV2) instead.


        Enables or disables a feature in one or more environments simultaneously. Accepts a map of environment name → boolean and immediately publishes the change.


        Returns 403 if the API key lacks permission or if approval rules are enabled for an affected environment and the org setting "REST API always bypasses approval requirements" is off.

        '
      deprecated: true
      tags:
      - features
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                environments:
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties:
                    anyOf:
                    - type: boolean
                      const: true
                    - type: boolean
                      const: false
                    - type: string
                      const: 'true'
                    - type: string
                      const: 'false'
                    - type: string
                      const: '1'
                    - type: string
                      const: '0'
                    - type: number
                      const: 1
                    - type: number
                      const: 0
                    - type: string
                      const: ''
              required:
              - environments
              additionalProperties: false
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  feature:
                    $ref: '#/components/schemas/Feature'
                required:
                - feature
                additionalProperties: false
      x-codeSamples:
      - lang: cURL
        source: "curl -X POST 'https://api.growthbook.io/api/v1/features/{id}/toggle' \\\n  -H 'Authorization: Bearer YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"reason\":\"Kill switch activated\",\"environments\":{\"production\":false}}'"
  /v1/features/{id}/revert:
    post:
      operationId: revertFeature
      summary: Revert a feature to a specific revision
      description: '**Deprecated.** Use [POST /v2/features/:id/revert](#operation/revertFeatureV2) instead.


        Creates a new revision whose rules and values match a previously-published revision, then immediately publishes it. This leaves a clear audit trail of the revert action in the revision history.


        Returns 403 if the API key lacks permission or if approval rules are enabled for an affected environment and the org setting "REST API always bypasses approval requirements" is off.

        '
      deprecated: true
      tags:
      - features
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                revision:
                  type: number
                comment:
                  type: string
              required:
              - revision
              additionalProperties: false
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  feature:
                    $ref: '#/components/schemas/Feature'
                required:
                - feature
                additionalProperties: false
      x-codeSamples:
      - lang: cURL
        source: "curl -X POST 'https://api.growthbook.io/api/v1/features/{id}/revert' \\\n  -H 'Authorization: Bearer YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"revision\":3,\"comment\":\"Bug found\"}'"
  /v1/feature-keys:
    get:
      operationId: getFeatureKeys
      summary: Get list of feature keys
      description: '**Deprecated.** Use [GET /v2/feature-keys](#operation/getFeatureKeysV2) instead.'
      deprecated: true
