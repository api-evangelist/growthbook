                                        type: string
                                  required:
                                  - matchType
                                  - savedGroups
                                  additionalProperties: false
                              prerequisites:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    id:
                                      description: Feature ID
                                      type: string
                                    condition:
                                      type: string
                                  required:
                                  - id
                                  - condition
                                  additionalProperties: false
                              scheduleRules:
                                type: array
                                items:
                                  $ref: '#/components/schemas/ScheduleRule'
                              id:
                                type: string
                              enabled:
                                description: Enabled by default
                                type: boolean
                              type:
                                type: string
                                const: force
                              value:
                                type: string
                              sparse:
                                description: JSON features only. When true, the rule value is a partial object merged onto the feature's default value instead of replacing it.
                                type: boolean
