                  type: string
                tempRollout:
                  description: 'Present when a reachable rule still serves a stopped experiment''s released variation (a temporary rollout that can be cleaned up). `old-temp-rollout` once the experiment has been stopped for more than 30 days.

                    '
                  type: string
                  enum:
                  - temp-rollout
                  - old-temp-rollout
              required:
              - isStale
              - reason
              additionalProperties: false
