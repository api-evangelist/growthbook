components:
  schemas:
    FeatureWithRevisions:
      allOf:
      - $ref: '#/components/schemas/Feature'
      - type: object
        properties:
          revisions:
            type: array
            items:
              $ref: '#/components/schemas/FeatureRevision'
        additionalProperties: false
    Feature:
      type: object
      properties:
        id:
          type: string
        dateCreated:
          format: date-time
          type: string
        dateUpdated:
          format: date-time
          type: string
        archived:
          type: boolean
        description:
          type: string
        owner:
          description: The userId of the owner (or raw owner name/email for legacy records)
          type: string
        ownerEmail:
          description: The email address of the owner, when the owner can be resolved to a known user.
          type: string
        project:
          type: string
        valueType:
          type: string
          enum:
          - boolean
          - string
          - number
          - json
        defaultValue:
          type: string
        tags:
          type: array
          items:
            type: string
        environments:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            $ref: '#/components/schemas/FeatureEnvironment'
        prerequisites:
          description: Feature IDs. Each feature must evaluate to `true`
          type: array
          items:
            type: string
        revision:
          type: object
          properties:
            version:
              type: integer
            comment:
              type: string
            date:
              format: date-time
              type: string
            createdBy:
              type: string
            publishedBy:
              type: string
          required:
          - version
          - comment
          - date
          - createdBy
          - publishedBy
          additionalProperties: false
        customFields:
          type: object
          propertyNames:
            type: string
          additionalProperties: {}
        holdout:
          anyOf:
          - type: object
            properties:
              id:
                description: Holdout ID
                type: string
              value:
                description: The feature value assigned to users in the holdout treatment group
                type: string
            required:
            - id
            - value
            additionalProperties: false
          - type: 'null'
      required:
      - id
      - dateCreated
      - dateUpdated
      - archived
      - description
      - owner
      - project
      - valueType
      - defaultValue
      - tags
      - environments
      - revision
      additionalProperties: false
    FeatureExperimentRule:
      allOf:
      - description: 'Common fields shared by all feature rule types. Specific rule types extend

          this base with their own required properties (value, coverage, etc.).

          '
        type: object
        properties:
          description:
            type: string
          condition:
            type: string
          id:
            type: string
          enabled:
            type: boolean
          scheduleRules:
            description: Simple time-based on/off schedule for this rule
            type: array
            items:
              $ref: '#/components/schemas/ScheduleRule'
          scheduleType:
            description: 'UI hint for which scheduling mode is active:

              - `none` – no schedule

              - `schedule` – simple time-based enable/disable via `scheduleRules`

              - `ramp` – multi-step ramp-up controlled by an associated RampSchedule document

              '
            type: string
            enum:
            - none
            - schedule
            - ramp
          savedGroupTargeting:
            type: array
            items:
              type: object
              properties:
                matchType:
                  type: string
                  enum:
                  - all
                  - any
                  - none
                savedGroups:
                  type: array
                  items:
                    type: string
              required:
              - matchType
              - savedGroups
              additionalProperties: false
          prerequisites:
            type: array
            items:
              type: object
              properties:
                id:
                  description: Feature ID of the prerequisite
                  type: string
                condition:
                  type: string
              required:
              - id
              - condition
              additionalProperties: false
        required:
        - description
        - id
        - enabled
        additionalProperties: false
      - type: object
        properties:
          type:
            type: string
            const: experiment
          trackingKey:
            type: string
          hashAttribute:
            type: string
          fallbackAttribute:
            type: string
          disableStickyBucketing:
            type: boolean
          bucketVersion:
            type: number
          minBucketVersion:
            type: number
          namespace:
            type: object
            properties:
              enabled:
                type: boolean
              name:
                type: string
              range:
                minItems: 2
                maxItems: 2
                type: array
                items:
                  type: number
            required:
            - enabled
            - name
            - range
            additionalProperties: false
          coverage:
            type: number
            minimum: 0
            maximum: 1
          value:
            description: Variation values with weights
            type: array
            items:
              type: object
              properties:
                value:
                  type: string
                weight:
                  type: number
                name:
                  type: string
              required:
              - value
              - weight
              additionalProperties: false
        required:
        - type
        additionalProperties: false
    FeatureRolloutRule:
      allOf:
      - description: 'Common fields shared by all feature rule types. Specific rule types extend

          this base with their own required properties (value, coverage, etc.).

          '
        type: object
        properties:
          description:
            type: string
          condition:
            type: string
          id:
            type: string
          enabled:
            type: boolean
          scheduleRules:
            description: Simple time-based on/off schedule for this rule
            type: array
            items:
              $ref: '#/components/schemas/ScheduleRule'
          scheduleType:
            description: 'UI hint for which scheduling mode is active:

              - `none` – no schedule

              - `schedule` – simple time-based enable/disable via `scheduleRules`

              - `ramp` – multi-step ramp-up controlled by an associated RampSchedule document

              '
            type: string
            enum:
            - none
            - schedule
            - ramp
          savedGroupTargeting:
            type: array
            items:
              type: object
              properties:
                matchType:
                  type: string
                  enum:
                  - all
                  - any
                  - none
                savedGroups:
                  type: array
                  items:
                    type: string
              required:
              - matchType
              - savedGroups
              additionalProperties: false
          prerequisites:
            type: array
            items:
              type: object
              properties:
                id:
                  description: Feature ID of the prerequisite
                  type: string
                condition:
                  type: string
              required:
              - id
              - condition
              additionalProperties: false
        required:
        - description
        - id
        - enabled
        additionalProperties: false
      - type: object
        properties:
          type:
            type: string
            const: rollout
          value:
            type: string
          coverage:
            type: number
            minimum: 0
            maximum: 1
          hashAttribute:
            type: string
          seed:
            description: Optional seed for the hash function; defaults to the rule id
            type: string
        required:
        - type
        - value
        - coverage
        - hashAttribute
        additionalProperties: false
    features:
      description: Map of feature ID to stale status. Only requested features that were found and readable are included.
      type: object
      propertyNames:
        type: string
      additionalProperties:
        type: object
        properties:
          featureId:
            description: The feature key
            type: string
          isStale:
            description: Whether the feature is considered stale overall (all enabled environments are stale). Always false when neverStale is true.
            type: boolean
          staleReason:
            description: 'Reason for the feature''s stale or non-stale status. `never-stale` when stale detection is disabled. Non-stale reasons: `recently-updated`, `active-draft`, `has-dependents`. Stale reasons: `no-rules`, `rules-one-sided`, `abandoned-draft`, `toggled-off`. Null when non-stale with no single cause (see staleByEnv).

              '
            anyOf:
            - type: string
              enum:
              - never-stale
              - recently-updated
              - active-draft
              - has-dependents
              - no-rules
              - rules-one-sided
              - abandoned-draft
              - toggled-off
              - active-experiment
              - has-rules
            - type: 'null'
          neverStale:
            description: When true the feature is permanently excluded from stale detection.
            type: boolean
          staleByEnv:
            description: Per-environment staleness breakdown, keyed by environment ID. Present when environments exist and neverStale is false.
            type: object
            propertyNames:
              type: string
            additionalProperties:
              type: object
              properties:
                isStale:
                  description: Whether this environment is stale
                  type: boolean
                reason:
                  description: Reason for the stale status in this environment
                  anyOf:
                  - type: string
                    enum:
                    - no-rules
                    - rules-one-sided
                    - abandoned-draft
                    - toggled-off
                    - active-experiment
