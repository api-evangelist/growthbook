        type: string
      additionalProperties:
        type: object
        properties:
          featureId:
            description: The feature key
            type: string
          isStale:
            description: Whether the feature is considered stale overall (all enabled environments are stale). Always false when neverStale is true.
            type: boolean
          staleReason:
            description: 'Reason for the feature''s stale or non-stale status. `never-stale` when stale detection is disabled. Non-stale reasons: `recently-updated`, `active-draft`, `has-dependents`, `temp-rollout` (a rule serves a recently stopped experiment''s released variation). Stale reasons: `no-rules`, `rules-one-sided`, `abandoned-draft`, `toggled-off`, `old-temp-rollout` (the environment only serves the released variation of an experiment stopped more than 30 days ago). Null when non-stale with no single cause (see staleByEnv).

              '
            anyOf:
            - type: string
              enum:
              - never-stale
              - recently-updated
              - active-draft
              - has-dependents
              - no-rules
              - rules-one-sided
              - abandoned-draft
              - toggled-off
              - active-experiment
              - temp-rollout
              - old-temp-rollout
              - has-rules
            - type: 'null'
          neverStale:
            description: When true the feature is permanently excluded from stale detection.
            type: boolean
          staleByEnv:
            description: Per-environment staleness breakdown, keyed by environment ID. Present when environments exist and neverStale is false.
            type: object
            propertyNames:
              type: string
            additionalProperties:
              type: object
              properties:
                isStale:
                  description: Whether this environment is stale
                  type: boolean
                reason:
                  description: Reason for the stale status in this environment
                  anyOf:
                  - type: string
                    enum:
                    - no-rules
                    - rules-one-sided
                    - abandoned-draft
                    - toggled-off
                    - active-experiment
                    - temp-rollout
                    - old-temp-rollout
                    - has-rules
                    - recently-updated
                    - active-draft
                    - has-dependents
                  - type: 'null'
                evaluatesTo:
                  description: 'The deterministic value this feature evaluates to in this environment. Uses the same raw string encoding as `feature.defaultValue`. Only present when the value is deterministic or the environment is toggled off.

