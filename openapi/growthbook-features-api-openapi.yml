openapi: 3.2.0
info:
  version: 5.1.0
  title: GrowthBook REST Features API
  description: 'GrowthBook offers a full REST API for interacting with the application. Request data can use either JSON or Form data encoding (with proper `Content-Type` headers). All response bodies are JSON-encoded. The API base URL for GrowthBook Cloud is `https://api.growthbook.io/api`. For self-hosted deployments, it is the same as your API_HOST environment variable (defaults to `http://localhost:3100/api`). The rest of these docs will assume you are using GrowthBook Cloud. ## Versioning


    Endpoints are versioned by path prefix:


    - `/v1/...` — stable, widely-supported endpoints

    - `/v2/...` — updated endpoints with improved shapes (e.g. unified per-rule environment scope for feature flags)


    New integrations should prefer v2 where available. Feature-flag and metric v1 routes are deprecated: they are tagged **LEGACY** in the sidebar and collapsed by default. Use the matching v2 group when both exist. ## Authentication


    We support both the HTTP Basic and Bearer authentication schemes for convenience. You first need to generate a new API Key in GrowthBook. Different keys have different permissions:


    - **Personal Access Tokens**: These are sensitive and provide the same level of access as the user has to an organization, or less if the token''s permissions are limited. These can be created by going to `Personal Access Tokens` under your user menu. Members with the API Keys **Manage members'' tokens** permission can disable a member''s token under `Settings -> Manage PATs`, and admins can require new tokens to expire within a maximum lifetime. - **Secret Keys**: These are sensitive and provide the level of access of the role they are given, which can be any built-in or custom role, with optional per-project role overrides and environment limits. Managing Secret Keys on behalf of an organization takes the API Keys permissions. These can be created by going to `Settings -> API Keys`, where Admins can also require new Secret Keys to expire within a maximum lifetime. If using HTTP Basic auth, pass the Secret Key as the username and leave the password blank (when using curl, add `:` at the end of the secret to indicate an empty password)


    ```bash

    curl https://api.growthbook.io/api/v1/features \

    -u secret_abc123DEF456:

    ```


    If using Bearer auth, pass the Secret Key as the token:


    ```bash

    curl https://api.growthbook.io/api/v1/features \

    -H "Authorization: Bearer secret_abc123DEF456"

    ```


    If a key has an expiration date, every response includes it in the `X-GrowthBook-Key-Expires-At` header (ISO 8601), so scripts can warn before the key stops working. Requests made with an expired key fail with a `401` that says where to create a replacement. See Expiration for choosing a key''s expiration, the warnings before it lapses, and the organization policies. ## Naming who asked


    Requests made with a Secret Key may add an `X-GrowthBook-Requested-By` header naming the organization member who asked for the change, as a user id or an email address. History, revision logs and webhooks show that member next to the key. Each key''s settings under `Settings -> API Keys`:


    - **Header**: **Optional** (the default) uses the header when it''s sent, **Required** rejects requests without it, and **Rejected** rejects requests that send it, each with a 400. - **Permissions**, when a member is named:

    - **Assume member''s role** (the default): the request acts as that member, with only what both the key and the member can do, so the header can narrow a key but never widen it. Drafts, owners, `mine` filters and reviews are the member''s. The member''s rights over their own drafts, comments and verdicts apply only where the key''s own role allows the same action. - **Use key''s role**: the key acts as itself, with its own permissions, and the name is only recorded in history. Drafts, verdicts and ownership are the key''s, as when no member is named.'
servers:
- url: https://api.growthbook.io/api
  description: GrowthBook Cloud
- url: https://{domain}/api
  description: Self-hosted GrowthBook
  variables:
    domain:
      default: localhost:3100
      description: Your self-hosted GrowthBook host (and port)
security:
- bearerAuth: []
- basicAuth: []
tags:
- name: Features
  x-displayName: Feature Flags (legacy)
  description: 'Control your feature flags programmatically.


    **These are v1 endpoints.** New integrations should use the v2 Feature Flags endpoints, which expose a unified per-rule environment scope instead of per-environment rule arrays.'
paths:
  /v1/features:
    get:
      operationId: listFeatures
      summary: Get all features
      description: '**Deprecated.** Use GET /v2/features instead.


        Returns features with pagination. The skipPagination query parameter is

        honored only when API_ALLOW_SKIP_PAGINATION is set (self-hosted deployments).'
      deprecated: true
      tags:
      - Features
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/projectId'
      - $ref: '#/components/parameters/clientKey'
      - $ref: '#/components/parameters/skipPagination'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    features:
                      type: array
                      items:
                        $ref: '#/components/schemas/FeatureV1'
                  required:
                  - features
                  additionalProperties: false
                - $ref: '#/components/schemas/PaginationFields'
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v1/features' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
    post:
      operationId: postFeature
      summary: Create a single feature
      description: '**Deprecated.** Use POST /v2/features instead.'
      deprecated: true
      tags:
      - Features
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  pattern: ^[a-zA-Z0-9_.:\|\-]+$
                  description: Unique, permanent key, shown as the Feature Flag's name in the UI and used in code. Keep it short. If `featureRegexValidator` in `GET /api/v1/settings` is set, follow it (`featureKeyExample` shows the format); otherwise use kebab-case (e.g. `checkout-express-pay`). Put context in `description`.
                  type: string
                  minLength: 1
                archived:
                  type: boolean
                description:
                  description: Markdown. What the Feature Flag gates and why, rollout plan, and links. Put context here, not in the key.
                  type: string
                  maxLength: 10000
                owner:
                  description: 'The userId or email address of the owner. If an email address is provided, it will be used to look up the userId of the matching organization member. If an ID is provided, it will be validated as existing in the organization. When omitted, it defaults to the requesting member: a personal access token''s owner, or the member an organization API key assumes. An organization API key acting as itself must send it, or the request fails with a 400.'
                  type: string
                project:
                  description: An associated project ID
                  type: string
                targetingAllProjects:
                  description: Make this feature discoverable in — and served to — every project, beyond its primary `project`. Requires the `targetFeatures` permission (FlagsTarget policy) unscoped to any project. Governance stays with `project`.
                  type: boolean
                targetingProjects:
                  description: Secondary project IDs this feature is targeted in and served to, beyond its primary `project`. Adding a project requires the `targetFeatures` permission (FlagsTarget policy) in that project. Governance stays with `project`.
                  type: array
                  items:
                    type: string
                valueType:
                  description: The data type of the feature payload. Boolean by default.
                  type: string
                  enum:
                  - boolean
                  - string
                  - number
                  - json
                defaultValue:
                  description: Default value when feature is enabled. Type must match `valueType`. In Config mode (`baseConfig` set) this is the JSON override patch merged on top of the config.
                  type: string
                baseConfig:
                  description: 'Key of the config backing this flag ("Config mode"). Requires `valueType: "json"` and a live config; `defaultValue` and rule values become override patches on top. null or omitted for a plain flag.'
                  anyOf:
                  - type: string
                  - type: 'null'
                tags:
                  description: Tags for filtering and grouping. Use these instead of encoding groups in names.
                  type: array
                  items:
                    type: string
                environments:
                  description: Settings for each environment, keyed by environment ID. Any environment you leave out is enabled or disabled per that environment's "Default state for new features" setting.
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                      rules:
                        type: array
                        items:
                          anyOf:
                          - type: object
                            properties:
                              allProjects:
                                description: When true (default), the rule applies to every project the feature is delivered to. When false, `projects` scopes it.
                                type: boolean
                              projects:
                                description: Project IDs this rule is scoped to when `allProjects` is false. An empty array scopes the rule to no project.
                                type: array
                                items:
                                  type: string
                              rampScheduleId:
                                description: Read-only; ignored on write. Accepted so a GET response can be posted back unchanged.
                              scheduleType:
                                description: Read-only; ignored on write. Accepted so a GET response can be posted back unchanged.
                              description:
                                description: Short note on why the rule exists (e.g. `Beta testers only`).
                                type: string
                                maxLength: 10000
                              condition:
                                description: Applied to everyone by default.
                                type: string
                              savedGroups:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    match:
                                      type: string
                                      enum:
                                      - all
                                      - none
                                      - any
                                    ids:
                                      type: array
                                      items:
                                        type: string
                                  required:
                                  - match
                                  - ids
                                  additionalProperties: false
                              savedGroupTargeting:
                                description: Deprecated — use `savedGroups`. Accepted so a GET response can be posted back unchanged; `savedGroups` takes precedence if both are sent.
                                deprecated: true
                                type: array
                                items:
