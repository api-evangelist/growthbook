components:
  parameters:
    offset:
      name: offset
      in: query
      description: How many items to skip (use in conjunction with limit for pagination)
      schema:
        default: 0
        description: How many items to skip (use in conjunction with limit for pagination)
        type: integer
        minimum: 0
    id:
      name: id
      in: path
      required: true
      description: The id of the requested resource
      schema:
        description: The id of the requested resource
        type: string
    projectId:
      name: projectId
      in: query
      description: Filter by project id
      schema:
        description: Filter by project id
        type: string
    limit:
      name: limit
      in: query
      description: The number of items to return
      schema:
        default: 10
        description: The number of items to return
        type: integer
        minimum: 1
        maximum: 100
    datasourceId:
      name: datasourceId
      in: query
      description: Filter by Data Source
      schema:
        description: Filter by Data Source
        type: string
  schemas:
    Metric:
      type: object
      properties:
        id:
          type: string
        managedBy:
          description: Where this metric must be managed from. If not set (empty string), it can be managed from anywhere.
          type: string
          enum:
          - ''
          - api
          - config
          - admin
        dateCreated:
          type: string
        dateUpdated:
          type: string
        owner:
          description: The userId of the owner (or raw owner name/email for legacy records)
          type: string
        ownerEmail:
          description: The email address of the owner, when the owner can be resolved to a known user.
          type: string
        datasourceId:
          type: string
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum:
          - binomial
          - count
          - duration
          - revenue
        tags:
          type: array
          items:
            type: string
        projects:
          type: array
          items:
            type: string
        archived:
          type: boolean
        behavior:
          type: object
          properties:
            goal:
              type: string
              enum:
              - increase
              - decrease
            cappingSettings:
              description: Controls how outliers are handled
              type: object
              properties:
                type:
                  type: string
                  enum:
                  - none
                  - absolute
                  - percentile
                value:
                  description: When type is absolute, this is the absolute value. When type is percentile, this is the percentile value (from 0.0 to 1.0).
                  type: number
                ignoreZeros:
                  description: If true and capping is `percentile`, zeros will be ignored when calculating the percentile.
                  type: boolean
              required:
              - type
              additionalProperties: false
            cap:
              deprecated: true
              type: number
            capping:
              deprecated: true
