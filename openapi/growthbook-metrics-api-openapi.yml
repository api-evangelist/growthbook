                additionalProperties: false
        '202':
          $ref: '#/components/responses/ConfirmationHeld'
      x-codeSamples:
      - lang: cURL
        source: "curl -X PUT 'https://api.growthbook.io/api/v1/metrics/abc123' \\\n  -H 'Authorization: Bearer YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"name\":\"net revenue\",\"description\":\"revenue minus lacroix spend\"}'"
    delete:
      operationId: deleteMetric
      summary: Deletes a metric
      tags:
      - Metrics
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Resource deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deletedId:
                    type: string
                required:
                - deletedId
                additionalProperties: false
        '202':
          $ref: '#/components/responses/ConfirmationHeld'
      x-codeSamples:
      - lang: cURL
        source: "curl -X DELETE 'https://api.growthbook.io/api/v1/metrics/abc123' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v1/metrics/{id}/experiments:
    get:
      operationId: listMetricExperiments
      summary: Get results for all experiments that use a metric
      description: 'Returns, for each experiment that uses the given metric (directly or via a metric group), the per-variation results for that metric from the latest snapshot. Supports the same filtering as the experiment list views via a raw search string or structured query params. Note: at most the 1000 most recent experiments using the metric are considered; filters and pagination are applied within that set, so results may be incomplete for metrics used by more than 1000 experiments.'
      tags:
      - Metrics
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/q'
      - name: projectId
        in: query
        description: Filter by comma-separated project ids or names
        schema:
          description: Filter by comma-separated project ids or names
          type: string
      - $ref: '#/components/parameters/owner'
      - name: status
        in: query
        description: Filter by comma-separated statuses (draft, running, stopped)
        schema:
