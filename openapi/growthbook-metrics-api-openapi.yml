                          type: number
                        delayUnit:
                          description: Default `hours`.
                          type: string
                          enum:
                          - minutes
                          - hours
                          - days
                          - weeks
                        windowValue:
                          type: number
                        windowUnit:
                          type: string
                          enum:
                          - minutes
                          - hours
                          - days
