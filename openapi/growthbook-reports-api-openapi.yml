                    type: string
                  dateStarted:
                    type: string
                  dateEnded:
                    type: string
                  coverage:
                    description: Traffic coverage (0–1)
                    type: number
                additionalProperties: false
          additionalProperties: false
        results:
          $ref: '#/components/schemas/ExperimentResults'
