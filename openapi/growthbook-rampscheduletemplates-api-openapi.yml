openapi: 3.2.0
info:
  version: 5.1.0
  title: GrowthBook REST Ramp Schedule Templates API
  description: 'GrowthBook offers a full REST API for interacting with the application. Request data can use either JSON or Form data encoding (with proper `Content-Type` headers). All response bodies are JSON-encoded. The API base URL for GrowthBook Cloud is `https://api.growthbook.io/api`. For self-hosted deployments, it is the same as your API_HOST environment variable (defaults to `http://localhost:3100/api`). The rest of these docs will assume you are using GrowthBook Cloud. ## Versioning


    Endpoints are versioned by path prefix:


    - `/v1/...` — stable, widely-supported endpoints

    - `/v2/...` — updated endpoints with improved shapes (e.g. unified per-rule environment scope for feature flags)


    New integrations should prefer v2 where available. Feature-flag and metric v1 routes are deprecated: they are tagged **LEGACY** in the sidebar and collapsed by default. Use the matching v2 group when both exist. ## Authentication


    We support both the HTTP Basic and Bearer authentication schemes for convenience. You first need to generate a new API Key in GrowthBook. Different keys have different permissions:


    - **Personal Access Tokens**: These are sensitive and provide the same level of access as the user has to an organization, or less if the token''s permissions are limited. These can be created by going to `Personal Access Tokens` under your user menu. Members with the API Keys **Manage members'' tokens** permission can disable a member''s token under `Settings -> Manage PATs`, and admins can require new tokens to expire within a maximum lifetime. - **Secret Keys**: These are sensitive and provide the level of access of the role they are given, which can be any built-in or custom role, with optional per-project role overrides and environment limits. Managing Secret Keys on behalf of an organization takes the API Keys permissions. These can be created by going to `Settings -> API Keys`, where Admins can also require new Secret Keys to expire within a maximum lifetime. If using HTTP Basic auth, pass the Secret Key as the username and leave the password blank (when using curl, add `:` at the end of the secret to indicate an empty password)


    ```bash

    curl https://api.growthbook.io/api/v1/features \

    -u secret_abc123DEF456:

    ```


    If using Bearer auth, pass the Secret Key as the token:


    ```bash

    curl https://api.growthbook.io/api/v1/features \

    -H "Authorization: Bearer secret_abc123DEF456"

    ```


    If a key has an expiration date, every response includes it in the `X-GrowthBook-Key-Expires-At` header (ISO 8601), so scripts can warn before the key stops working. Requests made with an expired key fail with a `401` that says where to create a replacement. See Expiration for choosing a key''s expiration, the warnings before it lapses, and the organization policies. ## Naming who asked


    Requests made with a Secret Key may add an `X-GrowthBook-Requested-By` header naming the organization member who asked for the change, as a user id or an email address. History, revision logs and webhooks show that member next to the key. Each key''s settings under `Settings -> API Keys`:


    - **Header**: **Optional** (the default) uses the header when it''s sent, **Required** rejects requests without it, and **Rejected** rejects requests that send it, each with a 400. - **Permissions**, when a member is named:

    - **Assume member''s role** (the default): the request acts as that member, with only what both the key and the member can do, so the header can narrow a key but never widen it. Drafts, owners, `mine` filters and reviews are the member''s. The member''s rights over their own drafts, comments and verdicts apply only where the key''s own role allows the same action. - **Use key''s role**: the key acts as itself, with its own permissions, and the name is only recorded in history. Drafts, verdicts and ownership are the key''s, as when no member is named.'
servers:
- url: https://api.growthbook.io/api
  description: GrowthBook Cloud
- url: https://{domain}/api
  description: Self-hosted GrowthBook
  variables:
    domain:
      default: localhost:3100
      description: Your self-hosted GrowthBook host (and port)
security:
- bearerAuth: []
- basicAuth: []
tags:
- name: RampScheduleTemplates
  x-displayName: Ramp Schedule Templates
  description: Reusable step configurations for ramp schedules.
paths:
  /v1/ramp-schedule-templates/{id}:
    get:
      operationId: getRampScheduleTemplate
      summary: Get a single rampScheduleTemplate
      tags:
      - RampScheduleTemplates
      parameters:
      - name: id
        in: path
        required: true
        description: ''
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  rampScheduleTemplate:
                    $ref: '#/components/schemas/RampScheduleTemplate'
                required:
                - rampScheduleTemplate
                additionalProperties: false
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v1/ramp-schedule-templates/{id}' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
    delete:
      operationId: deleteRampScheduleTemplate
      summary: Delete a single rampScheduleTemplate
      tags:
      - RampScheduleTemplates
      parameters:
      - name: id
        in: path
        required: true
        description: ''
        schema:
          type: string
      responses:
        '200':
          description: Resource deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deletedId:
                    type: string
                required:
                - deletedId
                additionalProperties: false
        '202':
          $ref: '#/components/responses/ConfirmationHeld'
      x-codeSamples:
      - lang: cURL
        source: "curl -X DELETE 'https://api.growthbook.io/api/v1/ramp-schedule-templates/{id}' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
    put:
      operationId: updateRampScheduleTemplate
      summary: Update a single rampScheduleTemplate
      tags:
      - RampScheduleTemplates
      parameters:
      - name: id
        in: path
        required: true
        description: ''
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                steps:
                  type: array
                  items:
                    type: object
                    properties:
                      interval:
                        description: Hold duration in seconds before this step's gates are evaluated. null = no time gate (advance as soon as holdConditions clear).
                        anyOf:
                        - type: number
                          exclusiveMinimum: 0
                        - type: 'null'
                      approvalNotes:
                        anyOf:
                        - type: string
                        - type: 'null'
                      monitored:
                        description: 'When true, this step runs A/B traffic analysis while active. Treatment = [0, coverage), control = [0.5, 0.5+coverage). Arms are equal-sized and non-adjacent: step-ups only add users, never reassign existing ones. The UI caps monitored-step coverage at 0.5 so control end never exceeds 1.0. The SDK uses explicit hash ranges on the experiment rule to prevent bucketing shifts across monitored/unmonitored transitions.'
                        type: boolean
                      holdConditions:
                        type: object
                        properties:
                          minSampleSize:
                            type: integer
                            exclusiveMinimum: 0
                          requiresApproval:
                            type: boolean
                        additionalProperties: false
                      actions:
                        type: array
                        items:
                          type: object
                          properties:
                            targetType:
                              type: string
                              const: feature-rule
                            targetId:
                              type: string
                            patch:
                              type: object
                              properties:
                                ruleId:
                                  type: string
                                coverage:
                                  description: 'Traffic fraction (0–1). For monitored steps the rollout rule is promoted to an experiment: treatment = [0, coverage), control = [0.5, 0.5+coverage). Both arms are equal-sized and non-adjacent, so a step-up only adds new users to each arm — no existing user changes group. The REST API enforces coverage ≤ 0.5 on monitored steps so control end never exceeds 1.0. The SDK uses explicit hash ranges on bucketingV2 clients to keep bucketing stable across monitored/unmonitored transitions.'
                                  anyOf:
                                  - type: number
                                    minimum: 0
                                    maximum: 1
                                  - type: 'null'
                                condition:
                                  anyOf:
                                  - type: string
                                  - type: 'null'
                                savedGroups:
                                  anyOf:
                                  - type: array
                                    items:
                                      type: object
                                      properties:
                                        match:
                                          type: string
                                          enum:
                                          - all
                                          - none
                                          - any
                                        ids:
                                          type: array
                                          items:
                                            type: string
                                      required:
                                      - match
                                      - ids
                                      additionalProperties: false
                                  - type: 'null'
                                prerequisites:
                                  anyOf:
                                  - type: array
                                    items:
                                      type: object
                                      properties:
                                        id:
                                          type: string
                                        condition:
                                          type: string
                                      required:
                                      - id
                                      - condition
                                      additionalProperties: false
                                  - type: 'null'
                                allEnvironments:
                                  anyOf:
                                  - type: boolean
                                  - type: 'null'
                                environments:
                                  anyOf:
                                  - type: array
                                    items:
                                      type: string
                                  - type: 'null'
                                enabled:
                                  anyOf:
                                  - type: boolean
                                  - type: 'null'
                                force:
                                  description: 'Ignored: templates never carry force values. Accepted so a schedule''s steps can be copied into a template.'
                              required:
                              - ruleId
                              additionalProperties: false
                          required:
                          - targetType
                          - targetId
                          - patch
                          additionalProperties: false
                    required:
                    - interval
                    - actions
                    additionalProperties: false
                endPatch:
                  type: object
                  properties:
                    coverage:
                      type: number
                      minimum: 0
                      maximum: 1
                    condition:
                      type: string
                    savedGroups:
                      type: array
                      items:
                        type: object
                        properties:
                          match:
                            type: string
                            enum:
                            - all
                            - none
                            - any
                          ids:
                            type: array
                            items:
                              type: string
                        required:
                        - match
                        - ids
                        additionalProperties: false
                    prerequisites:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          condition:
                            type: string
                        required:
                        - id
                        - condition
                        additionalProperties: false
                    allEnvironments:
                      type: boolean
                    environments:
                      type: array
                      items:
                        type: string
                  additionalProperties: false
                official:
                  type: boolean
                monitoringConfig:
                  anyOf:
                  - type: object
                    properties:
                      datasourceId:
                        type: string
                      guardrailMetricIds:
                        minItems: 1
                        type: array
                        items:
                          type: string
                      signalMetricIds:
                        type: array
                        items:
                          type: string
                      updateScheduleMinutes:
                        anyOf:
                        - type: number
                          minimum: 10
                        - type: 'null'
                      monitoringMode:
                        type: string
                        enum:
                        - auto
                        - manual
                      autoUpdate:
                        type: boolean
                      srmAction:
                        type: string
                        enum:
                        - rollback
                        - hold
                        - warn
                      noTrafficAction:
                        type: string
                        enum:
                        - rollback
                        - hold
                        - warn
                      noTrafficGracePeriodHours:
                        description: How long to wait for traffic before applying `noTrafficAction`. Defaults to 24 hours when null or not set.
                        anyOf:
                        - type: number
                          exclusiveMinimum: 0
                        - type: 'null'
                      multipleExposureAction:
                        type: string
                        enum:
                        - rollback
                        - hold
                        - warn
                      exposureQuery:
                        description: The assignment query, grouping its ID with the identifier type analyzed on. Mutually exclusive with the deprecated `exposureQueryId`.
                        type: object
                        properties:
                          id:
                            description: The ID of one of the data source's assignment queries.
                            type: string
                          identifierType:
                            description: The identifier type to analyze on, which the query must declare. Required when selecting a different assignment query that declares several. Otherwise defaults to the current identifier type, or the query's only one. Null is treated as omitted, so a response's value can be sent back.
                            anyOf:
                            - type: string
                            - type: 'null'
                        required:
                        - id
                        additionalProperties: false
                      exposureQueryId:
                        deprecated: true
                        description: 'Deprecated: use `exposureQuery`. Rejected when selecting a different assignment query that declares several identifier types; set `exposureQuery.identifierType` instead.'
                        type: string
                    required:
                    - datasourceId
                    - guardrailMetricIds
                    additionalProperties: false
                  - type: 'null'
                lockdownConfig:
                  type: object
                  properties:
                    mode:
                      type: string
                      enum:
                      - none
                      - locked
                  required:
                  - mode
                  additionalProperties: false
                order:
                  description: Display order within the org (lower sorts first).
                  type: number
              additionalProperties: false
      responses:
        '200':
          description: Resource updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  rampScheduleTemplate:
                    $ref: '#/components/schemas/RampScheduleTemplate'
                required:
                - rampScheduleTemplate
                additionalProperties: false
        '202':
          $ref: '#/components/responses/ConfirmationHeld'
      x-codeSamples:
      - lang: cURL
        source: "curl -X PUT 'https://api.growthbook.io/api/v1/ramp-schedule-templates/{id}' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
