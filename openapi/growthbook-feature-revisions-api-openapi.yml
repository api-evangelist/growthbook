                              - any
                            ids:
                              type: array
                              items:
                                type: string
                          required:
                          - match
                          - ids
                          additionalProperties: false
                      prerequisites:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            condition:
                              type: string
                          required:
                          - id
                          - condition
                          additionalProperties: false
                      scheduleRules:
                        type: array
                        items:
                          type: object
                          properties:
                            timestamp:
                              anyOf:
                              - type: string
                              - type: 'null'
                            enabled:
                              type: boolean
                          required:
                          - timestamp
                          - enabled
                          additionalProperties: false
                      scheduleType:
                        type: string
                        enum:
                        - none
                        - schedule
                        - ramp
                      type:
                        type: string
                        const: safe-rollout
                      controlValue:
                        type: string
                      variationValue:
                        type: string
                      hashAttribute:
                        type: string
                      trackingKey:
                        type: string
                      seed:
                        type: string
                      safeRolloutFields:
                        type: object
                        properties:
                          datasourceId:
                            type: string
                          exposureQueryId:
                            type: string
                          guardrailMetricIds:
                            type: array
                            items:
                              type: string
                          maxDuration:
                            type: object
                            properties:
                              amount:
                                type: number
                                exclusiveMinimum: 0
                              unit:
                                type: string
                                enum:
                                - weeks
                                - days
                                - hours
                                - minutes
                            required:
                            - amount
                            - unit
                            additionalProperties: false
                          autoRollback:
                            type: boolean
                          rampUpSchedule:
                            type: object
                            properties:
                              enabled:
                                type: boolean
                              steps:
                                minItems: 1
                                type: array
                                items:
                                  type: object
                                  properties:
                                    percent:
                                      type: number
                                      minimum: 0
                                      maximum: 1
                                  required:
                                  - percent
                                  additionalProperties: false
                            required:
                            - enabled
                            additionalProperties: false
                        required:
                        - datasourceId
                        - exposureQueryId
                        - guardrailMetricIds
                        - maxDuration
                        additionalProperties: false
                    required:
                    - type
                    - controlValue
                    - variationValue
                    - hashAttribute
                    - safeRolloutFields
                    additionalProperties: false
                  - type: object
                    properties:
                      description:
                        type: string
                      enabled:
                        type: boolean
                      condition:
                        type: string
                      savedGroups:
                        type: array
                        items:
                          type: object
                          properties:
                            match:
                              type: string
                              enum:
                              - all
                              - none
                              - any
                            ids:
                              type: array
                              items:
                                type: string
                          required:
                          - match
                          - ids
                          additionalProperties: false
                      prerequisites:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            condition:
                              type: string
                          required:
                          - id
                          - condition
                          additionalProperties: false
                      scheduleRules:
                        type: array
                        items:
                          type: object
                          properties:
                            timestamp:
                              anyOf:
                              - type: string
                              - type: 'null'
                            enabled:
                              type: boolean
                          required:
                          - timestamp
                          - enabled
                          additionalProperties: false
                      scheduleType:
                        type: string
                        enum:
                        - none
                        - schedule
