components:
  schemas:
    FeatureRuleV1:
      anyOf:
      - title: Feature Force Rule
        $ref: '#/components/schemas/FeatureForceRule'
      - title: Feature Rollout Rule
        $ref: '#/components/schemas/FeatureRolloutRule'
      - title: Feature Experiment Rule
        $ref: '#/components/schemas/FeatureExperimentRule'
      - title: Feature Experiment Ref Rule
        $ref: '#/components/schemas/FeatureExperimentRefRule'
      - title: Feature Contextual Bandit Ref Rule
        $ref: '#/components/schemas/FeatureContextualBanditRefRule'
      - title: Feature Safe Rollout Rule
        $ref: '#/components/schemas/FeatureSafeRolloutRule'
    bypassedGates:
      type: object
      properties:
        type:
          description: The gate that was bypassed (e.g. "approval-required", "stale-base", "schema-break").
          type: string
        outcome:
          type: string
          const: bypassed
        via:
          description: How the gate was bypassed. The value identifies a request field (`ignoreWarnings`, `skipSchemaValidation`, or `skipHooks`), the caller's permission (`bypassApprovalPermission`), or an organization setting (`restApiBypassesReviews`, or `revertsBypassApproval` on a revert).
          type: string
          enum:
          - ignoreWarnings
          - skipSchemaValidation
          - skipHooks
          - bypassApprovalPermission
          - restApiBypassesReviews
          - revertsBypassApproval
      required:
      - type
      - outcome
      - via
      additionalProperties: false
    FeatureSafeRolloutRule:
      allOf:
      - description: 'Common fields shared by all feature rule types. Specific rule types extend

          this base with their own required properties (value, coverage, etc.).

          '
        type: object
        properties:
          description:
            type: string
            maxLength: 10000
          condition:
            type: string
          id:
            type: string
          enabled:
            type: boolean
          scheduleRules:
            description: Simple time-based on/off schedule for this rule
            type: array
            items:
              $ref: '#/components/schemas/ScheduleRule'
          scheduleType:
            description: 'UI hint for which scheduling mode is active:

              - `none` – no schedule

              - `schedule` – simple time-based enable/disable via `scheduleRules`

              - `ramp` – multi-step ramp-up controlled by an associated RampSchedule document

              '
            type: string
            enum:
            - none
            - schedule
            - ramp
          rampScheduleId:
            description: ID of the active RampSchedule document controlling this rule. Present when `scheduleType` is `ramp` and a live schedule exists.
            type: string
          savedGroupTargeting:
            type: array
            items:
              type: object
              properties:
                matchType:
                  type: string
                  enum:
                  - all
                  - any
                  - none
                savedGroups:
                  type: array
                  items:
                    type: string
              required:
              - matchType
              - savedGroups
              additionalProperties: false
          prerequisites:
            type: array
            items:
              type: object
              properties:
                id:
                  description: Feature ID of the prerequisite
                  type: string
                condition:
                  type: string
              required:
              - id
              - condition
