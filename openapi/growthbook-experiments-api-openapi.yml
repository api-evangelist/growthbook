openapi: 3.2.0
info:
  version: 5.1.0
  title: GrowthBook REST Experiments API
  description: 'GrowthBook offers a full REST API for interacting with the application. Request data can use either JSON or Form data encoding (with proper `Content-Type` headers). All response bodies are JSON-encoded. The API base URL for GrowthBook Cloud is `https://api.growthbook.io/api`. For self-hosted deployments, it is the same as your API_HOST environment variable (defaults to `http://localhost:3100/api`). The rest of these docs will assume you are using GrowthBook Cloud. ## Versioning


    Endpoints are versioned by path prefix:


    - `/v1/...` — stable, widely-supported endpoints

    - `/v2/...` — updated endpoints with improved shapes (e.g. unified per-rule environment scope for feature flags)


    New integrations should prefer v2 where available. Feature-flag and metric v1 routes are deprecated: they are tagged **LEGACY** in the sidebar and collapsed by default. Use the matching v2 group when both exist. ## Authentication


    We support both the HTTP Basic and Bearer authentication schemes for convenience. You first need to generate a new API Key in GrowthBook. Different keys have different permissions:


    - **Personal Access Tokens**: These are sensitive and provide the same level of access as the user has to an organization, or less if the token''s permissions are limited. These can be created by going to `Personal Access Tokens` under your user menu. Members with the API Keys **Manage members'' tokens** permission can disable a member''s token under `Settings -> Manage PATs`, and admins can require new tokens to expire within a maximum lifetime. - **Secret Keys**: These are sensitive and provide the level of access of the role they are given, which can be any built-in or custom role, with optional per-project role overrides and environment limits. Managing Secret Keys on behalf of an organization takes the API Keys permissions. These can be created by going to `Settings -> API Keys`, where Admins can also require new Secret Keys to expire within a maximum lifetime. If using HTTP Basic auth, pass the Secret Key as the username and leave the password blank (when using curl, add `:` at the end of the secret to indicate an empty password)


    ```bash

    curl https://api.growthbook.io/api/v1/features \

    -u secret_abc123DEF456:

    ```


    If using Bearer auth, pass the Secret Key as the token:


    ```bash

    curl https://api.growthbook.io/api/v1/features \

    -H "Authorization: Bearer secret_abc123DEF456"

    ```


    If a key has an expiration date, every response includes it in the `X-GrowthBook-Key-Expires-At` header (ISO 8601), so scripts can warn before the key stops working. Requests made with an expired key fail with a `401` that says where to create a replacement. See Expiration for choosing a key''s expiration, the warnings before it lapses, and the organization policies. ## Naming who asked


    Requests made with a Secret Key may add an `X-GrowthBook-Requested-By` header naming the organization member who asked for the change, as a user id or an email address. History, revision logs and webhooks show that member next to the key. Each key''s settings under `Settings -> API Keys`:


    - **Header**: **Optional** (the default) uses the header when it''s sent, **Required** rejects requests without it, and **Rejected** rejects requests that send it, each with a 400. - **Permissions**, when a member is named:

    - **Assume member''s role** (the default): the request acts as that member, with only what both the key and the member can do, so the header can narrow a key but never widen it. Drafts, owners, `mine` filters and reviews are the member''s. The member''s rights over their own drafts, comments and verdicts apply only where the key''s own role allows the same action. - **Use key''s role**: the key acts as itself, with its own permissions, and the name is only recorded in history. Drafts, verdicts and ownership are the key''s, as when no member is named.'
servers:
- url: https://api.growthbook.io/api
  description: GrowthBook Cloud
- url: https://{domain}/api
  description: Self-hosted GrowthBook
  variables:
    domain:
      default: localhost:3100
      description: Your self-hosted GrowthBook host (and port)
security:
- bearerAuth: []
- basicAuth: []
tags:
- name: Experiments
  x-displayName: Experiments
  description: Experiments (A/B Tests)
paths:
  /v1/experiments:
    get:
      operationId: listExperiments
      summary: Get all experiments
      tags:
      - Experiments
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/projectId'
      - $ref: '#/components/parameters/datasourceId'
      - $ref: '#/components/parameters/trackingKey'
      - $ref: '#/components/parameters/experimentId'
      - name: status
        in: query
        description: ''
        schema:
          type: string
          enum:
          - draft
          - running
          - stopped
      - $ref: '#/components/parameters/q'
      - $ref: '#/components/parameters/owner'
      - $ref: '#/components/parameters/result'
      - $ref: '#/components/parameters/tag'
      - $ref: '#/components/parameters/implementationType'
      - $ref: '#/components/parameters/metricId'
      - $ref: '#/components/parameters/bandits'
      - name: archived
        in: query
        description: Filter by archived status. Set to `true` to return only archived experiments, `false` to exclude them. If omitted, both archived and non-archived experiments are returned.
        schema:
          description: Filter by archived status. Set to `true` to return only archived experiments, `false` to exclude them. If omitted, both archived and non-archived experiments are returned.
          anyOf:
          - type: string
            const: 'true'
          - type: string
            const: 'false'
          - type: string
            const: '0'
          - type: string
            const: '1'
          - type: boolean
      - $ref: '#/components/parameters/sortBy'
      - $ref: '#/components/parameters/sortOrder'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    experiments:
                      type: array
                      items:
                        $ref: '#/components/schemas/Experiment'
                  required:
                  - experiments
                  additionalProperties: false
                - $ref: '#/components/schemas/PaginationFields'
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v1/experiments' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
    post:
      operationId: postExperiment
      summary: Create a single experiment
      description: 'Creates a new experiment.


        ### Naming for human review


        Keep `name` short; put reasoning in `hypothesis` and context in `description`. `trackingKey` is sent with exposure events, so keep it short and stable.'
      tags:
      - Experiments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                datasourceId:
                  description: ID for the [DataSource](#tag/DataSource_model). Can only be set if a templateId is not provided.
                  type: string
                assignmentQuery:
                  description: The assignment query, grouping its ID with the identifier type analyzed on. Mutually exclusive with the deprecated `assignmentQueryId`. Can only be set if a templateId is not provided.
                  type: object
                  properties:
                    id:
                      description: The ID of one of the data source's assignment queries.
                      type: string
                    identifierType:
                      description: The identifier type to analyze on, which the query must declare. Required when selecting a different assignment query that declares several. Otherwise defaults to the current identifier type, or the query's only one. Null is treated as omitted, so a response's value can be sent back.
                      anyOf:
                      - type: string
                      - type: 'null'
                  required:
                  - id
                  additionalProperties: false
                assignmentQueryId:
                  deprecated: true
                  description: 'Deprecated: use `assignmentQuery`. Rejected when selecting a different assignment query that declares several identifier types; set `assignmentQuery.identifierType` instead. Can only be set if a templateId is not provided.'
                  type: string
                trackingKey:
                  description: Key sent with exposure events. Keep it short, in kebab-case (usually the Feature Flag key). If your organization requires a tracking key format, a key that doesn't match is rejected with `invalid_tracking_key`. Changing it after launch splits exposures across two keys.
                  type: string
                bypassDuplicateKeyCheck:
                  description: If true, allow creating an experiment even if another experiment with the same tracking key already exists. This is ignored if the organization requires unique tracking keys as a rule. Only set this when a person has explicitly asked you to. If a check blocks you, stop and ask a person instead of working around it.
                  type: boolean
                name:
                  description: Short display name (e.g. `Express checkout button`). Put reasoning in `hypothesis` and context in `description`.
                  type: string
                type:
                  type: string
                  enum:
                  - standard
                  - multi-armed-bandit
                project:
                  description: Project ID which the experiment belongs to
                  type: string
                templateId:
                  description: ID of the [ExperimentTemplate](#tag/ExperimentTemplate_model) this experiment was created from. Template fields are applied by default and overridden by explicitly provided payload fields.
                  type: string
                hypothesis:
                  description: Markdown. If we change X, metric Y will move because Z.
                  type: string
                description:
                  description: Markdown. Put context here, not in the name.
                  type: string
                  maxLength: 10000
                tags:
                  description: Tags for filtering and grouping. Use these instead of encoding groups in names.
                  type: array
                  items:
                    type: string
                metrics:
                  type: array
                  items:
                    type: string
                secondaryMetrics:
                  type: array
                  items:
                    type: string
                guardrailMetrics:
                  type: array
                  items:
                    type: string
                activationMetric:
                  description: Users must convert on this metric before being included
                  type: string
                segmentId:
                  description: Only users in this segment will be included
                  type: string
                queryFilter:
                  description: WHERE clause to add to the default experiment query
                  type: string
                owner:
                  description: 'The userId or email address of the owner. If an email address is provided, it will be used to look up the userId of the matching organization member. If an ID is provided, it will be validated as existing in the organization. When omitted, it defaults to the requesting member: a personal access token''s owner, or the member an organization API key assumes. An organization API key acting as itself leaves it empty.'
                  type: string
                archived:
                  type: boolean
                status:
                  type: string
                  enum:
                  - draft
                  - running
                  - stopped
                autoRefresh:
                  type: boolean
                hashAttribute:
                  type: string
                fallbackAttribute:
                  type: string
                attributeScopeAllProjects:
                  description: 'Picker preference: show attributes from all projects in this experiment''s targeting UI instead of only those in scope for its project and linked features. Does not loosen enforcement — when the organization requires registered attributes with project scoping, out-of-scope attributes are still rejected.'
                  type: boolean
                hashVersion:
                  anyOf:
                  - type: number
                    const: 1
                  - type: number
                    const: 2
                disableStickyBucketing:
                  description: When true, disables Sticky Bucketing for this experiment. If omitted, defaults to your organization's Sticky Bucketing setting for new experiments. Sticky Bucketing only takes effect when it is also enabled at the organization level.
                  type: boolean
                bucketVersion:
                  type: integer
                  minimum: 0
                minBucketVersion:
                  type: integer
                  minimum: 0
                releasedVariationId:
                  type: string
                excludeFromPayload:
                  type: boolean
                inProgressConversions:
                  type: string
                  enum:
                  - loose
                  - strict
                attributionModel:
                  description: Setting attribution model to `"experimentDuration"` is the same as selecting "Ignore Conversion Windows" for the Conversion Window Override. Setting it to `"lookbackOverride"` requires a `lookbackOverride` object to be provided.
                  type: string
                  enum:
                  - firstExposure
                  - experimentDuration
                  - lookbackOverride
                lookbackOverride:
                  description: Controls the lookback override for the experiment. For type "window", value must be a non-negative number and valueUnit is required.
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                      - date
                      - window
                    value:
                      description: For "window" type - non-negative numeric value (e.g. 7 for 7 days). For "date" type a date string.
                      anyOf:
                      - description: For "window" type - non-negative numeric value (e.g. 7 for 7 days). For "date" type a date string.
                        type: number
                      - format: date-time
                        description: For "window" type - non-negative numeric value (e.g. 7 for 7 days). For "date" type a date string.
                        type: string
                    valueUnit:
                      description: Used when type is "window". Defaults to "days".
                      type: string
                      enum:
                      - minutes
                      - hours
                      - days
                      - weeks
                  required:
                  - type
                  - value
                  additionalProperties: false
                statsEngine:
                  type: string
                  enum:
                  - bayesian
                  - frequentist
                variations:
                  minItems: 2
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        description: Stable variation id. On update, an omitted id is filled from the stored variation with the same key, or the same position, when the number of variations is unchanged.
                        type: string
                      variationId:
                        description: Alias for `id`. Mirrors the GET response. `id` takes precedence.
                        type: string
                      key:
                        description: Key sent with exposure events (e.g. `0`, `1`). Changing it after launch splits exposures.
                        type: string
                      name:
                        description: Short label shown in results (e.g. `Control`).
                        type: string
                      description:
                        description: What this variation changes.
                        type: string
                        maxLength: 10000
                      screenshots:
                        type: array
                        items:
                          type: object
                          properties:
                            path:
                              type: string
                            width:
                              type: number
                            height:
                              type: number
                            description:
                              type: string
                              maxLength: 10000
                          required:
                          - path
                          additionalProperties: false
                    required:
                    - key
                    - name
                    additionalProperties: false
                phases:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        description: Short phase label (e.g. `Main`).
                        type: string
                      dateStarted:
                        format: date-time
                        type: string
                      dateEnded:
                        format: date-time
                        type: string
                      reasonForStopping:
                        type: string
                      seed:
                        type: string
                      coverage:
                        type: number
                        minimum: 0
                        maximum: 1
                      namespace:
                        type: object
                        properties:
                          namespaceId:
                            type: string
                          enabled:
                            type: boolean
                          range:
                            minItems: 2
                            maxItems: 2
                            type: array
                            items:
                              type: number
                          ranges:
                            type: array
                            items:
                              type: array
                              prefixItems:
                              - type: number
                              - type: number
                        required:
                        - namespaceId
                        additionalProperties: false
                      prerequisites:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              description: Feature ID
                              type: string
                            condition:
                              type: string
                          required:
                          - id
                          - condition
                          additionalProperties: false
                      reason:
                        description: 'Deprecated: use `reasonForStopping`. Takes precedence if set.'
                        deprecated: true
                        type: string
                      condition:
                        description: 'Deprecated: use `targetingCondition`. Takes precedence if set.'
                        deprecated: true
                        type: string
                      targetingCondition:
                        description: Targeting condition as a JSON string. Mirrors the GET response.
                        type: string
                      savedGroups:
                        type: array
                        items:
                          type: object
                          properties:
                            match:
                              type: string
                              enum:
                              - all
                              - none
                              - any
                            ids:
                              type: array
                              items:
                                type: string
                          required:
                          - match
                          - ids
                          additionalProperties: false
                      savedGroupTargeting:
                        description: Deprecated — use `savedGroups`. Accepted so a GET response can be posted back unchanged; `savedGroups` takes precedence if both are sent.
                        deprecated: true
                        type: array
                        items:
                          type: object
                          properties:
                            matchType:
                              type: string
                              enum:
                              - all
                              - any
                              - none
                            savedGroups:
                              type: array
                              items:
                                type: string
                          required:
                          - matchType
                          - savedGroups
                          additionalProperties: false
                      variationWeights:
                        description: 'Deprecated: use `trafficSplit`. Takes precedence if set.'
                        deprecated: true
                        type: array
                        items:
                          type: number
                          minimum: 0
                          maximum: 1
                      trafficSplit:
                        description: Per-variation weights. Mirrors the GET response.
                        type: array
                        items:
                          type: object
                          properties:
                            variationId:
                              type: string
                            weight:
                              type: number
                              minimum: 0
                              maximum: 1
                          required:
                          - variationId
                          - weight
                          additionalProperties: false
                    required:
                    - name
                    - dateStarted
                    additionalProperties: false
                regressionAdjustmentEnabled:
                  description: Controls whether regression adjustment (CUPED) is enabled for experiment analyses
                  type: boolean
                sequentialTestingEnabled:
                  description: Only applicable to frequentist analyses
                  type: boolean
                sequentialTestingTuningParameter:
                  type: number
                shareLevel:
                  type: string
                  enum:
                  - public
                  - organization
                banditScheduleValue:
                  type: number
                banditScheduleUnit:
                  type: string
                  enum:
                  - days
                  - hours
                banditBurnInValue:
                  type: number
                banditBurnInUnit:
                  type: string
                  enum:
                  - days
                  - hours
                banditConversionWindowValue:
                  type: number
                banditConversionWindowUnit:
                  type: string
                  enum:
                  - days
                  - hours
                postStratificationEnabled:
                  description: When null, the organization default is used.
                  anyOf:
                  - description: When null, the organization default is used.
                    type: boolean
                  - description: When null, the organization default is used.
                    type: 'null'
                decisionFrameworkSettings:
                  description: Controls the decision framework and metric overrides for the experiment. Replaces the entire stored object on update (does not patch individual fields).
                  type: object
                  properties:
                    decisionCriteriaId:
                      type: string
                    decisionFrameworkMetricOverrides:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            description: ID of the metric to override settings for.
                            type: string
                          targetMDE:
                            description: The target relative MDE to use for the metric, expressed as proportions (e.g. use 0.1 for 10%). Must be greater than 0.
                            type: number
                            exclusiveMinimum: 0
                        required:
                        - id
                        additionalProperties: false
                  additionalProperties: false
                metricOverrides:
                  description: Per-metric analysis overrides for this experiment. Replaces the entire stored array (does not patch individual entries).
                  type: array
                  items:
                    description: Per-metric analysis overrides stored on the experiment (matches internal metricOverrides).
                    type: object
                    properties:
                      id:
                        description: ID of the metric to override settings for.
                        type: string
                      windowType:
                        type: string
                        enum:
                        - conversion
                        - lookback
                        - ''
                      windowHours:
                        type: number
                      delayHours:
                        type: number
                      properPriorOverride:
                        description: Must be true for the override to take effect. If true, the other proper prior settings in this object will be used if present.
                        type: boolean
                      properPriorEnabled:
                        type: boolean
                      properPriorMean:
                        type: number
                      properPriorStdDev:
                        type: number
                        exclusiveMinimum: 0
                      regressionAdjustmentOverride:
                        description: Must be true for the override to take effect. If true, the other regression adjustment settings in this object will be used if present.
                        type: boolean
                      regressionAdjustmentEnabled:
                        type: boolean
                      regressionAdjustmentDays:
                        type: number
                    required:
                    - id
                    additionalProperties: false
                defaultDashboardId:
                  description: ID of the default dashboard for this experiment.
                  type: string
                customFields:
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties:
                    type: string
                customMetricSlices:
                  description: Custom slices that apply to ALL applicable metrics in the experiment
                  type: array
                  items:
                    type: object
                    properties:
                      slices:
                        type: array
                        items:
                          type: object
                          properties:
                            column:
                              type: string
                            levels:
                              type: array
                              items:
                                type: string
                          required:
                          - column
                          - levels
                          additionalProperties: false
                    required:
                    - slices
                    additionalProperties: false
                precomputedUnitDimensionIds:
                  maxItems: 3
                  type: array
                  items:
                    type: string
                statusUpdateSchedule:
                  type: object
                  properties:
                    startAt:
                      description: ISO datetime when the experiment should start. Must be in the future. Setting or clearing this field invalidates any existing staged start (`nextScheduledStatusUpdate`); call POST /experiments/{id}/start to stage the new schedule.
                      format: date-time
                      type: string
                    stopAt:
                      description: ISO datetime when the experiment should stop. Resolved from `stopAfter` at start when a relative end was set.
                      format: date-time
                      type: string
                    stopAfter:
                      description: 'Relative end offset. Deferred: resolved to a concrete `stopAt` at the experiment''s actual start (or off `dateStarted` when already running).'
                      type: object
                      properties:
                        value:
                          type: integer
                          exclusiveMinimum: 0
                        unit:
                          type: string
                          enum:
                          - hours
                          - days
                      required:
                      - value
                      - unit
                      additionalProperties: false
                    scheduledStopPlan:
                      description: End-of-experiment automation applied at the scheduled end. Required whenever a `stopAt` or `stopAfter` is set (any mode, including `notify`).
                      $ref: '#/components/schemas/ScheduledStopPlan'
                  additionalProperties: false
                ignoreWarnings:
                  description: Set to true to acknowledge the warnings listed in a blocked response and continue. This covers experiment guards, locked dependents, and references affected by an archive. When the organization treats schema failures as warnings, it also covers schema and invariant warnings. It never bypasses a rejected Custom Hook. On revision publish endpoints, it can also force-publish an out-of-date draft when the caller has Bypass draft approvals access. Only set this when a person has explicitly asked you to. If a check blocks you, stop and ask a person instead of working around it.
                  type: boolean
              required:
              - trackingKey
              - name
              - variations
              additionalProperties: false
      responses:
        '200':
          description: Resource created
          content:
            application/json:
              schema:
                type: object
                properties:
                  experiment:
                    $ref: '#/components/schemas/Experiment'
                required:
                - experiment
                additionalProperties: false
        '202':
          $ref: '#/components/responses/ConfirmationHeld'
      x-codeSamples:
      - lang: cURL
        source: "curl -X POST 'https://api.growthbook.io/api/v1/experiments' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v1/experiments/results:
    get:
      operationId: listExperimentResults
      summary: Get latest results for many experiments
      description: 'Returns the latest non-dimension snapshot for each experiment matching the filters. Use this to scan results across a portfolio in one call.


        Pagination semantics:

        - `total` is the count of experiments matching the filters.

        - `count` is the length of the returned `experimentResults` array.

        - Experiments without a completed snapshot are omitted from `experimentResults`, so `count` may be less than the page slice and a page may legitimately return `count: 0` while `hasMore: true`.

        - `hasMore` and `nextOffset` advance over experiments matching the filters, not over returned results.


        Use the per-experiment `GET /experiments/{id}/results` endpoint to inspect specific phases or dimensions.'
      tags:
      - Experiments
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/projectId'
      - $ref: '#/components/parameters/datasourceId'
      - $ref: '#/components/parameters/trackingKey'
      - name: status
        in: query
        description: ''
        schema:
          type: string
          enum:
          - draft
          - running
          - stopped
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    experimentResults:
                      type: array
                      items:
                        $ref: '#/components/schemas/ExperimentResults'
                  required:
                  - experimentResults
                  additionalProperties: false
                - $ref: '#/components/schemas/PaginationFields'
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v1/experiments/results' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v1/experiments/{id}:
    get:
      operationId: getExperiment
      summary: Get a single experiment
      tags:
      - Experiments
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  experiment:
                    $ref: '#/components/schemas/ExperimentWithEnhancedStatus'
                required:
                - experiment
                additionalProperties: false
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v1/experiments/abc123' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
    post:
      operationId: updateExperiment
      summary: Update a single experiment
      tags:
      - Experiments
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                datasourceId:
                  description: Can only be set if existing experiment does not have a datasource
                  type: string
                assignmentQuery:
                  description: The assignment query, grouping its ID with the identifier type analyzed on. Mutually exclusive with the deprecated `assignmentQueryId`.
                  type: object
                  properties:
                    id:
                      description: The ID of one of the data source's assignment queries.
                      type: string
                    identifierType:
                      description: The identifier type to analyze on, which the query must declare. Required when selecting a different assignment query that declares several. Otherwise defaults to the current identifier type, or the query's only one. Null is treated as omitted, so a response's value can be sent back.
                      anyOf:
                      - type: string
                      - type: 'null'
                  required:
                  - id
                  additionalProperties: false
                assignmentQueryId:
                  deprecated: true
                  description: 'Deprecated: use `assignmentQuery`. Rejected when selecting a different assignment query that declares several identifier types; set `assignmentQuery.identifierType` instead.'
                  type: string
                trackingKey:
                  description: Key sent with exposure events. Keep it short, in kebab-case (usually the Feature Flag key). If your organization requires a tracking key format, a key that doesn't match is rejected with `invalid_tracking_key`. Changing it after launch splits exposures across two keys.
                  type: string
                bypassDuplicateKeyCheck:
                  description: If true, allow updating the tracking key even if another experiment with the same tracking key already exist. This is ignored if the organization requires unique tracking keys as a rule. Only set this when a person has explicitly asked you to. If a check blocks you, stop and ask a person instead of working around it.
                  type: boolean
                name:
