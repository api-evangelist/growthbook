              additionalProperties: false
      responses:
        '200':
          description: Resource created
          content:
            application/json:
              schema:
                type: object
                properties:
                  experiment:
                    $ref: '#/components/schemas/ExperimentWithEnhancedStatus'
                required:
                - experiment
                additionalProperties: false
        '202':
          $ref: '#/components/responses/ConfirmationHeld'
        '409':
