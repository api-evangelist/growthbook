  /v1/experiments/{id}/stop:
    post:
      operationId: postExperimentStop
      summary: Stop an experiment
      tags:
      - experiments
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                results:
                  description: The experiment conclusion status.
                  type: string
                  enum:
                  - dnf
                  - won
                  - lost
                  - inconclusive
                enableTemporaryRollout:
                  description: If true, include this stopped experiment in SDK payload and force the release variation (`releasedVariationId`) to all traffic.
                  type: boolean
                releasedVariationId:
                  description: Required if enableTemporaryRollout is true. Variation ID (e.g. var_abc123) to release to 100% of traffic eligible for this experiment.
                  type: string
                winnerVariationId:
                  description: Variation ID (e.g. var_abc123) of the winning variation. Used only as metadata. Required if results is 'won' and there are multiple test variations. Otherwise, defaults to the test variation when results is 'won' and to the baseline variation for other results.
                  type: string
                analysis:
                  description: Optional markdown summary displayed on the experiment results page.
                  type: string
                reason:
                  description: Optional reason for ending the phase stored on the latest phase metadata.
                  type: string
                dateEnded:
                  description: Optional ISO datetime for ending the latest phase. Defaults to the current date and time.
                  type: string
              required:
