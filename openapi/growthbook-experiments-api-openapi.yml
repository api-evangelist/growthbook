                    $ref: '#/components/schemas/ApiErrorInvalidStatusDetails'
                required:
                - message
                - code
                - details
      x-codeSamples:
      - lang: cURL
        source: "curl -X POST 'https://api.growthbook.io/api/v1/experiments/exp_abc123/modify-temporary-rollout' \\\n  -H 'Authorization: Bearer YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"enableTemporaryRollout\":false}'"
  /v1/experiments/{id}/snapshot:
    post:
      operationId: postExperimentSnapshot
      summary: Create Experiment Snapshot
      tags:
      - Experiments
      parameters:
      - name: id
        in: path
        required: true
        description: The experiment id of the experiment to update
        schema:
          description: The experiment id of the experiment to update
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                triggeredBy:
                  description: Set to "schedule" if you want this request to trigger notifications and other events as if it were a scheduled update. Defaults to manual.
                  type: string
                  enum:
                  - manual
                  - schedule
                dimension:
                  description: Dimension to break results down by. For Unit Dimensions, use the dimension id (e.g. "dim_abc123"). For Experiment Dimensions, use "exp:<dimensionName>" (e.g. "exp:country"). Built-in pre-exposure dimensions include "pre:date" and, when configured, "pre:activation". Use "cutoff:<ISO datetime>" (e.g. "cutoff:2026-01-15T00:12:00.000Z") to split units by whether they were first exposed before or after the cutoff; it must fall within the phase dates. Use "combo:<dimA>::<dimB>" (e.g. "combo:exp:country::dim_abc123") to break down by the intersection of two dimensions, each an Experiment Dimension or Unit Dimension id; values beyond the top 20 combined slices are merged into "(other)". Omit this field to create a standard snapshot.
                  type: string
                phase:
                  description: Zero-based phase index to snapshot, where 0 is the first experiment phase. Defaults to the latest phase.
                  type: integer
                  minimum: 0
              additionalProperties: false
      responses:
        '200':
          description: Resource created
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshot:
                    $ref: '#/components/schemas/snapshot'
                required:
                - snapshot
                additionalProperties: false
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  description: The Incremental Pipeline needs a Full Refresh of Overall Results before this request can be served
                  properties:
                    message:
                      type: string
                    code:
                      type: string
                      enum:
                      - requires_full_refresh
                    details:
                      $ref: '#/components/schemas/ApiErrorRequiresFullRefreshDetails'
                  required:
                  - message
                  - code
                  - details
                - type: object
                  description: The requested dimension was already computed from the latest Overall Results
                  properties:
                    message:
                      type: string
                    code:
                      type: string
                      enum:
                      - dimension_already_up_to_date
                    details:
                      $ref: '#/components/schemas/ApiErrorDimensionAlreadyUpToDateDetails'
                  required:
                  - message
                  - code
                  - details
      x-codeSamples:
      - lang: cURL
        source: "curl -X POST 'https://api.growthbook.io/api/v1/experiments/{id}/snapshot' \\\n  -H 'Authorization: Bearer YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"triggeredBy\":\"schedule\"}'"
