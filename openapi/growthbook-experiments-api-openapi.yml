  /v1/experiments/{id}/schedule:
    put:
      operationId: putExperimentSchedule
      summary: Set an experiment's schedule and shipping automation
      description: 'Full-replace of the experiment''s scheduled start/end and end-of-experiment shipping automation. The body is the complete desired state: any omitted field is cleared (omit `startAt` to remove a scheduled start; send an empty body to clear the whole schedule). Provide either `stopAt` or `stopAfter`, not both; a relative `stopAfter` resolves to a concrete stop when the experiment starts. Setting a scheduled end (`stopAt` or `stopAfter`) requires a `scheduledStopPlan` (any mode, including `notify`). The scheduled end must be in the future: a `stopAt` (or a `stopAfter` that resolves) in the past is rejected — including one whose end date has already passed and been acted on, so changing the plan after a soft end requires committing to a new end date. Auto-ship shipping requires the Decision Framework.'
      tags:
      - Experiments
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                startAt:
                  description: ISO datetime when the experiment should start; must be in the future. Omit to clear a scheduled start. Staging still happens via POST /experiments/{id}/start.
                  format: date-time
                  type: string
                stopAt:
                  description: Absolute ISO datetime to stop the experiment.
                  format: date-time
                  type: string
                stopAfter:
                  description: Deferred relative end, resolved to a concrete stop at the experiment's actual start (or now, if already running).
                  type: object
                  properties:
                    value:
                      type: integer
                      exclusiveMinimum: 0
                    unit:
                      type: string
                      enum:
                      - hours
                      - days
                  required:
                  - value
                  - unit
                  additionalProperties: false
                scheduledStopPlan:
                  description: End-of-experiment automation. Required whenever a `stopAt` or `stopAfter` is set (any mode, including `notify`).
                  $ref: '#/components/schemas/ScheduledStopPlan'
              additionalProperties: false
      responses:
        '200':
          description: Resource updated
          content:
