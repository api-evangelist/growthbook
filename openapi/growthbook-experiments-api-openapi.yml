components:
  schemas:
    checklistItems:
      type: object
      properties:
        key:
          type: string
        required:
          type: boolean
        status:
          type: string
          enum:
          - complete
          - incomplete
        manual:
          type: boolean
        reason:
          type: string
        hardBlock:
          description: When true, this item cannot be bypassed with `skipChecklist` — the experiment cannot be started until it is resolved.
          type: boolean
      required:
      - key
      - required
      - status
      - manual
      - reason
      additionalProperties: false
    ApiErrorPendingDraftPublishFailedDetails:
      type: object
      properties:
        failedFeatureDrafts:
          type: array
          items:
            type: object
            properties:
              featureId:
                type: string
              revisionVersion:
                type: number
              reason:
                type: string
                enum:
                - merge-conflict
                - needs-rebase
                - needs-approval
                - publish-error
            required:
            - featureId
            - revisionVersion
            - reason
            additionalProperties: false
      required:
      - failedFeatureDrafts
      additionalProperties: false
    ScheduledStopPlan:
      description: What happens at the scheduled end date. `notify` keeps the experiment running and just notifies (soft). `auto-ship` (requires the Decision Framework) ships the winning variation and stops; multi-winner ties break on `tiebreakerMetricId` (higher lift); with no clear winner, `fallback` either keeps running (`notify`) or ships `fallbackVariationId`. `force-ship` stops and rolls out `fallbackVariationId`. `stop` is a hard deadline that stops with no rollout. For `force-ship` and `stop`, the Decision Framework verdict (won/lost/inconclusive) is recorded as metadata when available.
      type: object
      properties:
        mode:
          type: string
          enum:
          - notify
          - auto-ship
          - force-ship
          - stop
        tiebreakerMetricId:
          type: string
        fallback:
          description: What to do at the scheduled end when there is no clear winner. Required when `mode` is `"auto-ship"`; ignored for other modes.
          type: string
          enum:
          - notify
          - force-ship
        fallbackVariationId:
          type: string
      required:
      - mode
      additionalProperties: false
    ExperimentAnalysisSettings:
      type: object
      properties:
        datasourceId:
          type: string
        assignmentQuery:
          description: The assignment query, grouping its ID with the identifier type analyzed on.
          type: object
          properties:
            id:
              description: The ID of one of the data source's assignment queries.
              type: string
            identifierType:
              description: 'The identifier type analyzed on. Null when none can be resolved: no assignment query is selected, or a record saved before identifier types were stored points at a query that no longer exists.'
              anyOf:
              - type: string
              - type: 'null'
          required:
          - id
          - identifierType
          additionalProperties: false
        assignmentQueryId:
          description: 'Deprecated: use `assignmentQuery`.'
          deprecated: true
          type: string
        experimentId:
          type: string
        segmentId:
          type: string
        queryFilter:
          type: string
        inProgressConversions:
          type: string
          enum:
          - include
          - exclude
        attributionModel:
          description: Setting attribution model to `"experimentDuration"` is the same as selecting "Ignore Conversion Windows" for the Conversion Window Override. Setting it to `"lookbackOverride"` requires a `lookbackOverride` object to be provided.
          type: string
          enum:
          - firstExposure
          - experimentDuration
          - lookbackOverride
        lookbackOverride:
          $ref: '#/components/schemas/LookbackOverride'
        statsEngine:
          type: string
          enum:
          - bayesian
          - frequentist
        regressionAdjustmentEnabled:
          type: boolean
        sequentialTestingEnabled:
          type: boolean
        sequentialTestingTuningParameter:
          type: number
        postStratificationEnabled:
          description: When null, the organization default is used.
          anyOf:
          - description: When null, the organization default is used.
            type: boolean
          - description: When null, the organization default is used.
            type: 'null'
        decisionFrameworkSettings:
          description: Controls the decision framework and metric overrides for the experiment. Replaces the entire stored object on update (does not patch individual fields).
          $ref: '#/components/schemas/ExperimentDecisionFrameworkSettings'
        metricOverrides:
          description: Per-metric analysis overrides; also reflected in goals/secondaryMetrics/guardrails overrides when applicable. On create/update, this replaces the entire stored array (it does not patch individual entries).
          type: array
          items:
            $ref: '#/components/schemas/ExperimentMetricOverrideEntry'
        goals:
          type: array
          items:
            $ref: '#/components/schemas/ExperimentMetric'
        secondaryMetrics:
          type: array
          items:
            $ref: '#/components/schemas/ExperimentMetric'
        guardrails:
          type: array
          items:
            $ref: '#/components/schemas/ExperimentMetric'
        activationMetric:
          $ref: '#/components/schemas/ExperimentMetric'
      required:
      - datasourceId
      - assignmentQuery
      - assignmentQueryId
      - experimentId
      - segmentId
      - queryFilter
      - inProgressConversions
      - attributionModel
      - statsEngine
      - goals
      - secondaryMetrics
      - guardrails
      additionalProperties: false
    ExperimentWithEnhancedStatus:
      allOf:
