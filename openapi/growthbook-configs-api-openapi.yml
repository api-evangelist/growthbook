    nodes:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        parent:
          description: The lineage parent's key (tree spine), or null for the family root.
          anyOf:
          - type: string
          - type: 'null'
        extends:
          description: Additional composition bases (mixin config keys) layered on top of `parent`. The tree shape follows `parent`/`depth`; these express composition beyond the parent/child spine.
          type: array
          items:
            type: string
        project:
          type: string
        archived:
          type: boolean
        depth:
          description: Distance from the family root along the `parent` spine (root is 0).
          type: integer
        isTarget:
