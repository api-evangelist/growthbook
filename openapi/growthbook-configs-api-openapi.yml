openapi: 3.2.0
info:
  version: 5.1.0
  title: GrowthBook REST Configs API
  description: 'GrowthBook offers a full REST API for interacting with the application. Request data can use either JSON or Form data encoding (with proper `Content-Type` headers). All response bodies are JSON-encoded. The API base URL for GrowthBook Cloud is `https://api.growthbook.io/api`. For self-hosted deployments, it is the same as your API_HOST environment variable (defaults to `http://localhost:3100/api`). The rest of these docs will assume you are using GrowthBook Cloud. ## Versioning


    Endpoints are versioned by path prefix:


    - `/v1/...` — stable, widely-supported endpoints

    - `/v2/...` — updated endpoints with improved shapes (e.g. unified per-rule environment scope for feature flags)


    New integrations should prefer v2 where available. Feature-flag and metric v1 routes are deprecated: they are tagged **LEGACY** in the sidebar and collapsed by default. Use the matching v2 group when both exist. ## Authentication


    We support both the HTTP Basic and Bearer authentication schemes for convenience. You first need to generate a new API Key in GrowthBook. Different keys have different permissions:


    - **Personal Access Tokens**: These are sensitive and provide the same level of access as the user has to an organization, or less if the token''s permissions are limited. These can be created by going to `Personal Access Tokens` under your user menu. Members with the API Keys **Manage members'' tokens** permission can disable a member''s token under `Settings -> Manage PATs`, and admins can require new tokens to expire within a maximum lifetime. - **Secret Keys**: These are sensitive and provide the level of access of the role they are given, which can be any built-in or custom role, with optional per-project role overrides and environment limits. Managing Secret Keys on behalf of an organization takes the API Keys permissions. These can be created by going to `Settings -> API Keys`, where Admins can also require new Secret Keys to expire within a maximum lifetime. If using HTTP Basic auth, pass the Secret Key as the username and leave the password blank (when using curl, add `:` at the end of the secret to indicate an empty password)


    ```bash

    curl https://api.growthbook.io/api/v1/features \

    -u secret_abc123DEF456:

    ```


    If using Bearer auth, pass the Secret Key as the token:


    ```bash

    curl https://api.growthbook.io/api/v1/features \

    -H "Authorization: Bearer secret_abc123DEF456"

    ```


    If a key has an expiration date, every response includes it in the `X-GrowthBook-Key-Expires-At` header (ISO 8601), so scripts can warn before the key stops working. Requests made with an expired key fail with a `401` that says where to create a replacement. See Expiration for choosing a key''s expiration, the warnings before it lapses, and the organization policies. ## Naming who asked


    Requests made with a Secret Key may add an `X-GrowthBook-Requested-By` header naming the organization member who asked for the change, as a user id or an email address. History, revision logs and webhooks show that member next to the key. Each key''s settings under `Settings -> API Keys`:


    - **Header**: **Optional** (the default) uses the header when it''s sent, **Required** rejects requests without it, and **Rejected** rejects requests that send it, each with a 400. - **Permissions**, when a member is named:

    - **Assume member''s role** (the default): the request acts as that member, with only what both the key and the member can do, so the header can narrow a key but never widen it. Drafts, owners, `mine` filters and reviews are the member''s. The member''s rights over their own drafts, comments and verdicts apply only where the key''s own role allows the same action. - **Use key''s role**: the key acts as itself, with its own permissions, and the name is only recorded in history. Drafts, verdicts and ownership are the key''s, as when no member is named.'
servers:
- url: https://api.growthbook.io/api
  description: GrowthBook Cloud
- url: https://{domain}/api
  description: Self-hosted GrowthBook
  variables:
    domain:
      default: localhost:3100
      description: Your self-hosted GrowthBook host (and port)
security:
- bearerAuth: []
- basicAuth: []
tags:
- name: Configs
  x-displayName: Configs
  description: '**Beta** — these endpoints are new and may change in backwards-incompatible ways.


    Reusable, typed, inheritable JSON objects referenced from feature flag values as `@config:key`. A config carries a field `schema` (with TypeScript/JSON Schema import-export) and a lineage `parent`. Inheritance is expressed via `parent`, never an in-value `@config:` entry. Values layer as a **deep, targeted patch**: a child (or a config-backed feature value) restates only the leaves it changes and inherits the rest — unlike a constant''s `$extends`, whose own keys replace wholesale. Schema fields colliding with a published ancestor''s key follow ''base wins'': identical re-declarations are stripped with a warning, differing ones are rejected.'
paths:
  /v1/configs:
    get:
      operationId: listConfigs
      summary: Get all configs
      tags:
      - Configs
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    configs:
                      type: array
                      items:
                        $ref: '#/components/schemas/Config'
                  required:
                  - configs
                  additionalProperties: false
                - $ref: '#/components/schemas/PaginationFields'
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v1/configs' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
    post:
      operationId: postConfig
      summary: Create a single config
      tags:
      - Configs
      parameters:
      - $ref: '#/components/parameters/skipSchemaValidation'
      - $ref: '#/components/parameters/ignoreWarnings'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  description: Stable reference handle (lowercase slug, unique per org), referenced as `@config:key`
                  type: string
                  pattern: ^[a-z0-9][a-z0-9\-_]*$
                name:
                  description: The display name of the config
                  type: string
                parent:
                  description: The `key` of the config to inherit from (the primary lineage spine). Express inheritance via `parent`/`extends`, NEVER via a `@config:` entry in `value` (which is rejected).
                  type: string
                extends:
                  description: Additional composition bases (config `key`s) layered on top of `parent`, in precedence order (later overrides earlier; all override `parent`; own keys win last). Set inheritance here, never via a `@config:` entry in `value`.
                  type: array
                  items:
                    type: string
                value:
                  description: This config's base value as a JSON object. Per-environment/project variants are expressed via `scopedOverrides`.
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties: {}
                scopedOverrides:
                  description: 'Ordered, first-match-wins environment/project-scoped variant selection. Each entry points at a flavor config (a child config, by `key`) whose value is deep-merged onto this config''s resolved value when the (environment, project) scope matches — resolved at build time, per layer. This is how you create an environment-scoped override (as opposed to a plain child config): make a child config for the override value, then add it here with its scope. Send the complete list to replace it; an empty array clears all overrides. Entries must reference existing configs, may not reference this config itself, and may not be unreachable (fully subsumed by an earlier entry).'
                  type: array
                  items:
                    type: object
                    properties:
                      config:
                        description: The `key` of the flavor config (a child config) whose value patches this config when the scope matches.
                        type: string
                      environments:
                        description: Environment ids this entry applies to. Empty/omitted = any environment.
                        type: array
                        items:
                          type: string
                      projects:
                        description: Project ids this entry applies to. Empty/omitted = any project.
                        type: array
                        items:
                          type: string
                    required:
                    - config
                    additionalProperties: false
                description:
                  description: Markdown. Put context here, not in the name.
                  type: string
                  maxLength: 10000
                project:
                  type: string
                owner:
                  description: 'The userId or email address of the owner. If an email address is provided, it will be used to look up the userId of the matching organization member. If an ID is provided, it will be validated as existing in the organization. When omitted, it defaults to the requesting member: a personal access token''s owner, or the member an organization API key assumes. An organization API key acting as itself leaves it empty.'
                  type: string
                schema:
                  description: 'Field definitions for this config, as a JSON Schema document (`{ type: "json-schema", value }`) or typed-code source (`{ type: "typescript" | "protobuf" | "python" | "go" | "rust", value }`) — converted server-side in one call. Fields whose key an ancestor (via `parent`/`extends`) already owns follow "base wins": an identical re-declaration is stripped with a `redundant-declaration` warning; one with a differing definition is rejected. A field owned by two sibling bases is a conflict and is rejected. Omit to leave the config schema-less. Conversion warnings are returned in `warnings`.'
                  $ref: '#/components/schemas/ConfigSchemaSource'
                source:
                  description: Optional identifier of the consuming codebase/service. When a typed-code schema (`typescript`/`protobuf`/`python`/`go`/`rust`) is supplied, its named-type structure is captured under this source so `GET /configs/:key/schema?source=<id>&format=<lang>` can reproduce those names.
                  type: string
                extensible:
                  type: boolean
                experimentGuard:
                  description: 'Enable the experiment guard on this config: publishing a change served to a running experiment soft-blocks unless overridden. Omit to inherit the org default.'
                  type: boolean
                invariants:
                  description: Cross-field validation rules. Each rule's expression is a mongo condition (mongrule). Stored on the config schema and enforced at publish.
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        maxLength: 128
                      rule:
                        description: 'The rule expression, as a mongo condition (mongrule) — the same condition syntax as feature targeting, extended with `{ "$ref": "otherField" }` to compare against another field, e.g. `{ "min_replicas": { "$lte": { "$ref": "max_replicas" } } }`.'
                        type: object
                        propertyNames:
                          type: string
                        additionalProperties: {}
                      message:
                        description: Shown to editors when the rule is violated. Optional — defaults to a generic message naming the rule.
                        type: string
                        maxLength: 10000
                    required:
                    - name
                    - rule
                    additionalProperties: false
                ignoreWarnings:
                  description: Set to true to acknowledge the warnings listed in a blocked response and continue. This covers experiment guards, locked dependents, and references affected by an archive. When the organization treats schema failures as warnings, it also covers schema and invariant warnings. It never bypasses a rejected Custom Hook. On revision publish endpoints, it can also force-publish an out-of-date draft when the caller has Bypass draft approvals access. Only set this when a person has explicitly asked you to. If a check blocks you, stop and ask a person instead of working around it.
                  type: boolean
                skipSchemaValidation:
                  description: Set to true to publish despite schema validation errors, failed invariants, or schema changes that invalidate dependent resources. This does not bypass a rejected Custom Hook; use `skipHooks` for that. The caller must have Bypass draft approvals access for Feature Flags, Configs, and Constants in every Project. Otherwise, this field is ignored. Only set this when a person has explicitly asked you to. If a check blocks you, stop and ask a person instead of working around it.
                  type: boolean
                skipHooks:
                  description: Set to true to publish despite a Custom Hook rejection. This does not bypass schema validation; use `skipSchemaValidation` for that. The caller must have Bypass draft approvals access for Feature Flags, Configs, and Constants in every Project. Otherwise, this field is ignored. Only set this when a person has explicitly asked you to. If a check blocks you, stop and ask a person instead of working around it.
                  type: boolean
              required:
              - key
              - name
              additionalProperties: false
      responses:
        '200':
          description: Resource created
          content:
            application/json:
              schema:
                type: object
                properties:
                  config:
                    $ref: '#/components/schemas/Config'
                  warnings:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConfigSchemaWarning'
                  postPublishWarnings:
                    description: Steps that failed AFTER the value publish committed (e.g. an experiment-guard toggle in the same request). The publish stands; retry only the named step.
                    type: array
                    items:
                      type: string
                required:
                - config
                additionalProperties: false
        '202':
          $ref: '#/components/responses/ConfirmationHeld'
      x-codeSamples:
      - lang: cURL
        source: "curl -X POST 'https://api.growthbook.io/api/v1/configs' \\\n  -H 'Authorization: Bearer YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"key\":\"checkout-flow\",\"name\":\"Checkout Flow\",\"value\":{\"timeout\":30,\"retries\":3}}'"
  /v1/configs/{key}/references:
    get:
      operationId: getConfigReferences
      summary: Get features and configs that reference this config
      tags:
      - Configs
      parameters:
      - name: key
        in: path
        required: true
        description: The key of the config
        schema:
          description: The key of the config
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                id: ConfigReferences
                type: object
                properties:
                  features:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        project:
                          type: string
                      required:
                      - id
                      additionalProperties: false
                  constants:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        key:
                          type: string
                        name:
                          type: string
                        project:
                          type: string
                        isConfig:
                          type: boolean
                      required:
                      - id
                      - key
                      - name
                      additionalProperties: false
                required:
                - features
                - constants
                additionalProperties: false
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v1/configs/checkout-flow/references' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v1/configs/{key}/key-usage:
    get:
      operationId: getConfigKeyUsage
      summary: Get the feature rules and default values implementing each key
      description: Lists every feature rule and default value that overrides a key of this config's lineage family, so you can see which keys are implemented and where.
      tags:
      - Configs
      parameters:
      - name: key
        in: path
        required: true
        description: The key of the config
        schema:
          description: The key of the config
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                id: ConfigKeyUsage
                type: object
                properties:
                  familyKeys:
                    type: array
                    items:
                      type: string
                  implementations:
                    type: array
                    items:
                      $ref: '#/components/schemas/implementations'
                required:
                - familyKeys
                - implementations
                additionalProperties: false
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v1/configs/checkout-flow/key-usage' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v1/configs/{key}/lineage:
    get:
      operationId: getConfigLineage
      summary: Get the full lineage (family tree) for a config
      tags:
      - Configs
      parameters:
      - name: key
        in: path
        required: true
        description: The key of the config
        schema:
          description: The key of the config
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                id: ConfigLineage
                type: object
                properties:
                  root:
                    description: The key of the family root (the topmost ancestor).
                    type: string
                  target:
                    description: The requested config's key.
                    type: string
                  ancestors:
                    description: The target's ancestor keys, root-first, ending at its immediate parent.
                    type: array
                    items:
                      type: string
                  descendants:
                    description: Keys of every config that descends from the target.
                    type: array
                    items:
                      type: string
                  nodes:
                    description: Every config in the family (root plus all descendants), breadth-first.
                    type: array
                    items:
                      $ref: '#/components/schemas/nodes'
                required:
                - root
                - target
                - ancestors
                - descendants
                - nodes
                additionalProperties: false
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v1/configs/checkout-flow/lineage' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v1/configs/{key}/schema/verify:
    post:
      operationId: verifyConfigSchema
      summary: Verify a config's schema against a source (drift check)
      tags:
      - Configs
      parameters:
      - name: key
        in: path
        required: true
        description: The key of the config
        schema:
          description: The key of the config
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                schema:
                  description: 'The schema to check against the config''s stored schema — a JSON Schema document or typed-code source (`typescript`/`protobuf`/`python`/`go`/`rust`). Read-only: nothing is mutated.'
                  $ref: '#/components/schemas/ConfigSchemaSource'
              required:
              - schema
              additionalProperties: false
      responses:
        '200':
          description: Resource created
          content:
            application/json:
              schema:
                id: ConfigSchemaVerify
                type: object
                properties:
                  inSync:
                    description: True when the supplied schema is canonically identical to the config's stored schema.
                    type: boolean
                  fingerprint:
                    description: Canonical fingerprint of the config's stored schema.
                    type: string
                  incomingFingerprint:
                    description: Canonical fingerprint of the supplied schema.
                    type: string
                  drift:
                    $ref: '#/components/schemas/drift'
                  ancestorOwnedFields:
                    description: Supplied fields an ancestor config already owns ("base wins"). Subtract these from `drift.contract` adds when round-tripping a full effective schema.
                    type: array
                    items:
                      $ref: '#/components/schemas/ancestorOwnedFields'
                  warnings:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConfigSchemaWarning'
                required:
                - inSync
                - fingerprint
                - incomingFingerprint
                additionalProperties: false
      x-codeSamples:
      - lang: cURL
        source: "curl -X POST 'https://api.growthbook.io/api/v1/configs/checkout-flow/schema/verify' \\\n  -H 'Authorization: Bearer YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"schema\":{\"type\":\"typescript\",\"value\":\"interface CheckoutFlow { timeout: number; retries: number }\"}}'"
  /v1/configs/{key}/schema:
    get:
      operationId: getConfigSchema
      summary: Export a config's schema
      tags:
      - Configs
      parameters:
      - name: key
        in: path
        required: true
        description: The key of the config
        schema:
          description: The key of the config
          type: string
      - name: format
        in: query
        description: Output format. `json-schema` (default) returns a JSON Schema document; `typescript`, `protobuf`, `python` (Pydantic), `go`, and `rust` (serde) render the schema as source in that language.
        schema:
          description: Output format. `json-schema` (default) returns a JSON Schema document; `typescript`, `protobuf`, `python` (Pydantic), `go`, and `rust` (serde) render the schema as source in that language.
          type: string
          enum:
          - json-schema
          - typescript
          - protobuf
          - python
          - go
          - rust
      - $ref: '#/components/parameters/effective'
      - $ref: '#/components/parameters/source'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                id: ConfigSchemaExport
                type: object
                properties:
                  schema:
                    description: 'The config''s schema in the requested format: a JSON Schema document (`{ type: "json-schema", value }`) or rendered TypeScript source (`{ type: "typescript", value }`).'
                    $ref: '#/components/schemas/ConfigSchemaSource'
                  effective:
                    description: True when the schema includes inherited fields accumulated across the lineage; false when it is only this config's own fields.
                    type: boolean
                  additionalProperties:
                    description: Whether the config family permits extra keys.
                    type: boolean
                required:
                - schema
                - effective
                - additionalProperties
                additionalProperties: false
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v1/configs/checkout-flow/schema' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v1/configs/{key}:
    get:
      operationId: getConfig
      summary: Get a single config
      tags:
      - Configs
      parameters:
      - name: key
        in: path
        required: true
        description: The key of the config
        schema:
          description: The key of the config
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  config:
                    $ref: '#/components/schemas/Config'
                required:
                - config
                additionalProperties: false
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v1/configs/checkout-flow' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
    post:
      operationId: updateConfig
      summary: Partially update a single config
      description: Applies the change immediately and records it as a published revision, so it appears in history and fires revision webhooks. When the organization requires approvals, open a draft instead or pass `bypassApproval` with the bypass permission.
      tags:
      - Configs
      parameters:
      - name: key
        in: path
        required: true
        description: The key of the config
        schema:
          description: The key of the config
          type: string
      - $ref: '#/components/parameters/skipSchemaValidation'
      - $ref: '#/components/parameters/ignoreWarnings'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: Short display name. Put details in `description`.
                  type: string
                parent:
                  description: Change the lineage parent (the `key` of the config to inherit from). Set to an empty string to detach from the parent and make this a root config.
                  type: string
                extends:
                  description: Replace the composition bases (mixins) layered on top of `parent`, in precedence order (later overrides earlier; all override `parent`; own keys win last). Send the complete set; an empty array clears all mixins. Set inheritance here, never via a `@config:` entry in `value`.
                  type: array
                  items:
                    type: string
                value:
                  description: This config's base value as a JSON object. Per-environment/project variants are expressed via `scopedOverrides`.
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties: {}
                scopedOverrides:
                  description: Replace the ordered, first-match-wins environment/project-scoped variant selection. Each entry points at a flavor config (a child config, by `key`) whose value is deep-merged onto this config's resolved value when the (environment, project) scope matches. Send the complete list; an empty array clears all overrides; omit to leave unchanged. Entries must reference existing configs, may not reference this config itself, and may not be unreachable.
                  type: array
                  items:
                    type: object
                    properties:
                      config:
                        description: The `key` of the flavor config (a child config) whose value patches this config when the scope matches.
                        type: string
                      environments:
                        description: Environment ids this entry applies to. Empty/omitted = any environment.
                        type: array
                        items:
                          type: string
                      projects:
                        description: Project ids this entry applies to. Empty/omitted = any project.
                        type: array
                        items:
                          type: string
                    required:
                    - config
                    additionalProperties: false
                description:
                  description: Markdown. Put context here, not in the name.
                  type: string
                  maxLength: 10000
                project:
                  type: string
                owner:
                  description: The userId or email address of the owner. If an email address is provided, it will be used to look up the userId of the matching organization member. If an ID is provided, it will be validated as existing in the organization.
                  type: string
                schema:
                  description: 'Replace this config''s field definitions, as a JSON Schema document (`{ type: "json-schema", value }`) or typed-code source (`{ type: "typescript" | "protobuf" | "python" | "go" | "rust", value }`). Fields whose key a published ancestor already owns follow "base wins": an identical re-declaration is stripped with a `redundant-declaration` warning; one with a differing definition is rejected. A schema change cascades the ''base wins'' normalization to descendants when published; a change that removes or retypes fields descendants still use soft-blocks with a 422 unless the request body sets `ignoreWarnings: true`. Conversion warnings are returned in `warnings`.'
                  $ref: '#/components/schemas/ConfigSchemaSource'
                source:
                  description: Optional identifier of the consuming codebase/service. When a `typescript` or `protobuf` schema is supplied, its named-type structure is captured under this source for reproduction on export.
                  type: string
                extensible:
                  type: boolean
                experimentGuard:
                  description: Enable or disable the experiment guard for this Config. Disabling it requires Bypass draft approvals access.
                  type: boolean
                invariants:
                  description: Replace the config's cross-field validation rules. Each rule's expression is a mongo condition (mongrule). Send the complete set; an empty array clears all rules. Omit to leave them unchanged.
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        maxLength: 128
                      rule:
                        description: 'The rule expression, as a mongo condition (mongrule) — the same condition syntax as feature targeting, extended with `{ "$ref": "otherField" }` to compare against another field, e.g. `{ "min_replicas": { "$lte": { "$ref": "max_replicas" } } }`.'
                        type: object
                        propertyNames:
                          type: string
                        additionalProperties: {}
                      message:
                        description: Shown to editors when the rule is violated. Optional — defaults to a generic message naming the rule.
                        type: string
                        maxLength: 10000
                    required:
                    - name
                    - rule
                    additionalProperties: false
                bypassApproval:
                  description: Set to true to write directly to the live Config without approval. The caller must have Bypass draft approvals access in the Config's Project, unless the organization enables the REST API approval bypass. This field has no effect when approval is not required.
                  type: boolean
                ignoreWarnings:
                  description: Set to true to acknowledge the warnings listed in a blocked response and continue. This covers experiment guards, locked dependents, and references affected by an archive. When the organization treats schema failures as warnings, it also covers schema and invariant warnings. It never bypasses a rejected Custom Hook. On revision publish endpoints, it can also force-publish an out-of-date draft when the caller has Bypass draft approvals access. Only set this when a person has explicitly asked you to. If a check blocks you, stop and ask a person instead of working around it.
                  type: boolean
                skipSchemaValidation:
