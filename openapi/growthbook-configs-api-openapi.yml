components:
  schemas:
    Config:
      type: object
      properties:
        id:
          type: string
        key:
          description: Stable reference handle; used as `@config:key` in values
          type: string
        name:
          type: string
        owner:
          description: The userId of the owner (or raw owner name/email for legacy records)
          type: string
        ownerEmail:
          description: The email address of the owner, when the owner can be resolved to a known user.
          type: string
        parent:
          description: The `key` of the config this one inherits from (lineage parent — the primary spine). Synthesized into `$extends` at resolution time and never stored in `value`.
          type: string
        extends:
          description: Additional composition bases (config `key`s) layered on top of `parent`, in precedence order (later overrides earlier; all override `parent`; this config's own keys win last). Like `parent`, set via this field — never via a `@config:` entry in `value`.
          type: array
          items:
            type: string
        value:
          description: This config's own base value as a JSON object (its declared fields only — inherited fields are layered in at resolution time, not stored here). Per-environment/project variants are expressed via `scopedOverrides`, not here.
          type: object
          propertyNames:
            type: string
          additionalProperties: {}
        scopedOverrides:
          description: 'Ordered, first-match-wins environment/project-scoped variant selection. Each entry points at a flavor config (a child config, by `key`) whose value is deep-merged onto this config''s resolved value when the (environment, project) scope matches — resolved at build time, per layer. This is how you create an environment-scoped override (as opposed to a plain child config): make a child config for the override value, then add it here with its scope. Send the complete list to replace it; an empty array clears all overrides. Entries must reference existing configs, may not reference this config itself, and may not be unreachable (fully subsumed by an earlier entry).'
          type: array
          items:
            type: object
            properties:
              config:
                description: The `key` of the flavor config (a child config) whose value patches this config when the scope matches.
                type: string
              environments:
                description: Environment ids this entry applies to. Empty/omitted = any environment.
                type: array
                items:
                  type: string
              projects:
                description: Project ids this entry applies to. Empty/omitted = any project.
                type: array
                items:
                  type: string
            required:
            - config
            additionalProperties: false
        scopedConfig:
          description: 'Present ONLY when this config is an environment/project-scoped override (a "flavor") of another config. Its value is a patch that applies solely within the listed environments/projects, layered onto `parent` at resolution — it is NOT a standalone config. A plain config (including an ordinary child that just inherits from a `parent`) omits this field entirely. Read-only: create/change the relationship via the parent config''s `scopedOverrides`, never by setting this directly.'
          type: object
          properties:
            parent:
              description: The base config this one is a scoped override of.
              type: string
            environments:
              description: Environments this override applies to (empty/absent = every environment).
              type: array
              items:
                type: string
            projects:
              description: Projects this override applies to (empty/absent = every project).
              type: array
              items:
                type: string
          required:
          - parent
          additionalProperties: false
        description:
          type: string
          maxLength: 10000
        project:
          description: The project this config belongs to (empty = all projects)
          type: string
        archived:
          type: boolean
        schema:
          description: This config's own field definitions as a JSON Schema document (its contribution to the family's effective schema). Inherited fields are owned by ancestors and are not repeated here.
          type: object
          properties:
            type:
              type: string
              const: json-schema
            value:
              description: A JSON Schema document (an object).
              type: object
              propertyNames:
                type: string
              additionalProperties: {}
          required:
          - type
          - value
          additionalProperties: false
        extensible:
          description: Whether this config family permits extra keys beyond the declared fields (child configs, feature rules, ad-hoc overrides). Only the root config's flag applies. Absent = inherit the org default.
          type: boolean
        invariants:
          description: Cross-field validation rules (relational checks JSON Schema can't express, e.g. implications or comparing two fields), evaluated against the resolved value at publish.
          type: array
          items:
            type: object
            properties:
              name:
                description: Unique name for the rule.
                type: string
                maxLength: 128
              rule:
                description: A mongo condition (mongrule) boolean expression over the config's fields.
                type: object
                propertyNames:
                  type: string
                additionalProperties: {}
              message:
                description: Human-readable error shown when the rule is violated.
                type: string
                maxLength: 10000
            required:
            - name
            - rule
            - message
            additionalProperties: false
        locked:
          description: Whether this Config is locked to a published revision. Drafts can still be created and edited while locked, but no change can be published until a user with Bypass draft approvals access unlocks it.
          type: boolean
        experimentGuard:
          description: 'Whether the experiment guard is enabled. When enabled, publishing a value used by a running experiment returns a warning that must be acknowledged with `ignoreWarnings: true`. Disabling the guard requires Bypass draft approvals access.'
          type: boolean
        lockedRevision:
          description: The pinned published revision (present only when `locked`). Fetch it via `GET /configs-revisions/:key/:version` for a value guaranteed not to disappear or mutate — use it to pin reproducible builds.
          type: object
          properties:
            id:
              type: string
            version:
              type: number
          required:
          - id
          - version
          additionalProperties: false
        lockedBy:
          description: 'Who locked the config: a member''s user ID, or an API key''s ID when it acted as itself'
          type: string
        dateLocked:
          format: date-time
          description: When the config was locked (when `locked`).
          type: string
        dateCreated:
          format: date-time
          type: string
        dateUpdated:
          format: date-time
          type: string
      required:
      - id
      - key
      - name
      - dateCreated
      - dateUpdated
      additionalProperties: false
    PaginationFields:
      type: object
      properties:
        limit:
          type: integer
        offset:
          type: integer
        count:
          type: integer
        total:
          type: integer
        hasMore:
          type: boolean
        nextOffset:
          anyOf:
          - type: integer
          - type: 'null'
      required:
      - limit
      - offset
      - count
      - total
      - hasMore
      - nextOffset
      additionalProperties: false
    ConfigSchemaSource:
      anyOf:
      - type: object
        properties:
          type:
            type: string
            const: json-schema
          value:
            description: A JSON Schema document (an object).
            type: object
            propertyNames:
              type: string
            additionalProperties: {}
        required:
        - type
        - value
        additionalProperties: false
      - type: object
        properties:
          type:
            type: string
            const: typescript
          value:
            description: TypeScript source — an interface or object type.
            type: string
        required:
        - type
        - value
        additionalProperties: false
      - type: object
        properties:
          type:
            type: string
            const: protobuf
          value:
            description: Protobuf (proto3) source — a `message` definition.
            type: string
        required:
        - type
        - value
        additionalProperties: false
      - type: object
        properties:
          type:
            type: string
            const: python
          value:
            description: Python source — a Pydantic `BaseModel` class.
            type: string
        required:
        - type
        - value
        additionalProperties: false
      - type: object
        properties:
          type:
            type: string
            const: go
          value:
            description: Go source — a `struct` definition.
            type: string
        required:
        - type
        - value
        additionalProperties: false
      - type: object
        properties:
          type:
            type: string
            const: rust
          value:
            description: Rust source — a serde `struct` definition.
            type: string
        required:
        - type
        - value
        additionalProperties: false
    bypassedGates:
      type: object
      properties:
        type:
          description: The gate that was bypassed (e.g. "approval-required", "stale-base", "schema-break").
          type: string
        outcome:
          type: string
          const: bypassed
        via:
          description: How the gate was bypassed. The value identifies a request field (`ignoreWarnings`, `skipSchemaValidation`, or `skipHooks`), the caller's permission (`bypassApprovalPermission`), or an organization setting (`restApiBypassesReviews`, or `revertsBypassApproval` on a revert).
          type: string
          enum:
          - ignoreWarnings
          - skipSchemaValidation
          - skipHooks
          - bypassApprovalPermission
          - restApiBypassesReviews
          - revertsBypassApproval
      required:
      - type
      - outcome
      - via
      additionalProperties: false
    implementations:
      type: object
      properties:
        featureId:
          type: string
        project:
          type: string
        location:
          type: string
          enum:
          - defaultValue
          - rule
        ruleType:
          type: string
        ruleId:
          type: string
        experimentId:
          type: string
        experimentName:
          type: string
        experimentStatus:
          type: string
        variationId:
          type: string
        configKey:
          type: string
        relation:
          type: string
          enum:
          - self
          - ancestor
          - descendant
          - other
        keys:
          type: array
          items:
            type: string
        state:
          type: string
          enum:
          - live
          - draft
        revisionVersion:
          type: number
      required:
      - featureId
      - location
      - configKey
      - keys
      - state
      additionalProperties: false
    drift:
      description: Present only when `inSync` is false.
      type: object
      properties:
        contract:
          description: Changes that alter what validates (type/enum/required/nullable/bounds/structure, or an added/removed field).
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              change:
                type: string
                enum:
                - added
                - removed
                - changed
            required:
            - key
            - change
            additionalProperties: false
        docs:
          description: Description-only changes (no effect on validation).
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              change:
                type: string
                enum:
                - added
                - removed
                - changed
            required:
            - key
            - change
            additionalProperties: false
      required:
      - contract
      - docs
      additionalProperties: false
    ConfigSchemaWarning:
      type: object
      properties:
        code:
          type: string
          enum:
          - dropped-declaration
          - non-object-root
          - unresolved-type
          - unsupported-member
          - redundant-declaration
          - undeclared-rule-field
        message:
          type: string
        path:
          type: string
      required:
      - code
      - message
      additionalProperties: false
    Confirmation:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum:
          - pending
          - running
          - completed
          - rejected
          - expired
        actions:
          type: array
          items:
            type: object
            properties:
              action:
                type: string
                enum:
                - feature.create
                - feature.draft
                - feature.review
                - feature.publish
                - feature.archive
                - feature.delete
                - feature.other
                - experiment.create
                - experiment.draft
                - experiment.start
                - experiment.stop
                - experiment.targeting
                - experiment.traffic
                - experiment.phases
                - experiment.visualEditor
                - experiment.other
                - savedGroup.create
                - savedGroup.draft
                - savedGroup.review
                - savedGroup.publish
                - savedGroup.archive
                - savedGroup.delete
                - savedGroup.other
                - constant.create
                - constant.draft
                - constant.review
                - constant.publish
                - constant.archive
                - constant.delete
                - constant.other
                - config.create
                - config.draft
                - config.review
                - config.publish
                - config.archive
                - config.delete
                - config.other
                - rampSchedule.create
                - rampSchedule.start
                - rampSchedule.pause
                - rampSchedule.progression
                - rampSchedule.approve
                - rampSchedule.edit
                - rampSchedule.delete
                - rampSchedule.other
                - settings.approvals
                - settings.other
                - access.members
                - access.teams
                - customHook.create
                - customHook.edit
                - customHook.delete
                - environment.create
                - environment.edit
                - environment.delete
                - project.create
                - project.edit
                - project.delete
                - attribute.create
                - attribute.edit
                - attribute.delete
                - customField.create
                - customField.edit
                - customField.delete
                - sdkConnection.create
                - sdkConnection.edit
                - sdkConnection.delete
                - metric.create
                - metric.edit
                - metric.delete
                - factTable.create
                - factTable.edit
                - factTable.delete
                - segment.create
                - segment.edit
                - segment.delete
                - dimension.create
                - dimension.edit
                - dimension.delete
                - override.ignoreWarnings
                - override.skipSchemaValidation
                - override.skipHooks
                - override.bypassApproval
                - override.restBypassesReviews
                - override.draftLimit
                - override.skipChecklist
                - override.bypassDuplicateKeyCheck
                - other.write
              environments:
                type: array
