      properties:
        id:
          type: string
        userId:
          description: 'Who acted: a member''s user ID, or an API key''s ID when it acted as itself'
          type: string
        action:
          type: string
          enum:
          - created
          - updated
          - reviewed
          - approved
          - requested-changes
          - commented
          - review-requested
          - review-retracted
          - merged
          - discarded
          - reopened
          - recalled
          - scheduled-publish
          - scheduled-publish-updated
          - scheduled-publish-canceled
          - merge-recovered
        description:
          anyOf:
          - type: string
          - type: 'null'
        proposedChangesSnapshot:
          type: array
          items:
            anyOf:
            - type: object
              properties:
                op:
                  type: string
                  const: add
                path:
                  type: string
                  pattern: ^\/[^/]+$
                value: {}
              required:
              - op
              - path
              - value
              additionalProperties: false
            - type: object
              properties:
                op:
                  type: string
                  const: remove
                path:
                  type: string
                  pattern: ^\/[^/]+$
              required:
              - op
              - path
              additionalProperties: false
            - type: object
              properties:
                op:
                  type: string
                  const: replace
                path:
                  type: string
                  pattern: ^\/[^/]+$
                value: {}
              required:
              - op
              - path
              - value
              additionalProperties: false
            - type: object
              properties:
                op:
                  type: string
                  const: move
                from:
                  type: string
                  pattern: ^\/[^/]+$
                path:
                  type: string
                  pattern: ^\/[^/]+$
              required:
              - op
              - from
              - path
              additionalProperties: false
            - type: object
              properties:
                op:
                  type: string
                  const: copy
                from:
                  type: string
                  pattern: ^\/[^/]+$
                path:
                  type: string
                  pattern: ^\/[^/]+$
              required:
              - op
              - from
              - path
              additionalProperties: false
            - type: object
              properties:
                op:
                  type: string
                  const: test
                path:
                  type: string
                  pattern: ^\/[^/]+$
                value: {}
              required:
              - op
              - path
              - value
              additionalProperties: false
        targetSnapshot: {}
        dateCreated:
          format: date-time
          type: string
        user:
          $ref: '#/components/schemas/EventUser'
      required:
      - id
      - userId
      - action
      - dateCreated
      additionalProperties: false
  responses:
    ConfirmationHeld:
      description: Held until a person confirms it in GrowthBook. Poll the Location until the confirmation completes.
      headers:
        Location:
          description: The confirmation to poll
          schema:
            type: string
        Retry-After:
          description: Seconds to wait before polling
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConfirmationHeld'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'If using Bearer auth, pass the Secret Key as the token:

        ```bash

        curl https://api.growthbook.io/api/v1/features   -H "Authorization: Bearer secret_abc123DEF456"

        ```

        '
    basicAuth:
      type: http
      scheme: basic
      description: 'If using HTTP Basic auth, pass the Secret Key as the username and leave the password blank:

        ```bash

        curl https://api.growthbook.io/api/v1/features   -u secret_abc123DEF456:

        # The ":" at the end stops curl from asking for a password

        ```

        '
