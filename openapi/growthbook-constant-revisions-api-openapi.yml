components:
  parameters:
    limit:
      name: limit
      in: query
      description: The number of items to return
      schema:
        default: 10
        description: The number of items to return
        type: integer
        minimum: 1
        maximum: 100
    version:
      name: version
      in: path
      required: true
      description: ''
      schema:
        type: integer
    offset:
      name: offset
      in: query
      description: How many items to skip (use in conjunction with limit for pagination)
      schema:
        default: 0
        description: How many items to skip (use in conjunction with limit for pagination)
        type: integer
        minimum: 0
    author:
      name: author
      in: query
      description: ''
      schema:
        type: string
    skipPagination:
      name: skipPagination
      in: query
      description: 'If true, return all matching items and ignore limit/offset.

        Self-hosted only. Has no effect unless API_ALLOW_SKIP_PAGINATION is set to true or 1.'
      schema:
        description: 'If true, return all matching items and ignore limit/offset.

          Self-hosted only. Has no effect unless API_ALLOW_SKIP_PAGINATION is set to true or 1.'
        default: false
        anyOf:
        - type: string
          const: 'true'
        - type: string
          const: 'false'
        - type: string
          const: '0'
        - type: string
          const: '1'
        - type: boolean
      x-selfHostedOnly: true
      x-requiresEnv: API_ALLOW_SKIP_PAGINATION
  schemas:
    ConstantRevision:
      type: object
      properties:
        id:
          type: string
        version:
          type: integer
        title:
          type: string
        status:
          type: string
          enum:
          - draft
          - pending-review
          - approved
          - changes-requested
          - merged
          - discarded
        authorId:
          description: 'Who acted: a member''s user ID, or an API key''s ID when it acted as itself'
          type: string
        author:
          description: Who created the revision, with an API key's name
          $ref: '#/components/schemas/EventUser'
        authorEmail:
          type: string
        contributors:
          type: array
          items:
            type: string
        revertedFrom:
          type: string
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/ConstantRevisionReview'
        activityLog:
          type: array
          items:
            $ref: '#/components/schemas/ConstantRevisionActivityLogEntry'
        autoPublishOnApproval:
          description: Publish automatically the moment this revision is approved.
          type: boolean
        autoPublishEnabledBy:
          description: User or API key the deferred publish runs as, re-checked when it fires. A key that assumed a member's role is recorded as `<keyId>:<memberId>`.
          type: string
        autoPublishEnabledByUser:
          description: Who armed the deferred publish, with an API key's name
          $ref: '#/components/schemas/EventUser'
        scheduledPublishAt:
          description: When the deferred publish fires. Absent when the revision publishes on approval instead, or is not armed at all.
          format: date-time
          type: string
        scheduledPublishLockEdits:
          description: Content edits to this revision are frozen until it fires.
          type: boolean
        scheduledPublishLockOthers:
          description: Other revisions of the same resource cannot publish until this one fires or is cancelled.
          type: boolean
        scheduledPublishBypassApproval:
          description: Armed by a caller who bypassed the approval requirement. Such a schedule must be cancelled and re-armed rather than edited.
          type: boolean
        scheduledPublishAttempts:
          description: How many times the poller has tried to publish this revision.
          type: integer
        scheduledPublishLastError:
          description: Why the most recent deferred-publish attempt failed.
          type: string
        scheduledPublishGaveUpAt:
          description: When the poller stopped retrying. Giving up CLEARS the schedule and disarms auto-publish, so nothing fires again until the revision is re-armed. The draft is left open, with `scheduledPublishLastError` preserved for context.
          format: date-time
          type: string
        resolution:
          type: object
          properties:
            action:
              type: string
              enum:
              - merged
              - discarded
            userId:
              description: 'Who acted: a member''s user ID, or an API key''s ID when it acted as itself'
              type: string
            user:
              $ref: '#/components/schemas/EventUser'
            dateCreated:
              format: date-time
              type: string
          required:
          - action
          - userId
          - dateCreated
          additionalProperties: false
        dateCreated:
          format: date-time
          type: string
        dateUpdated:
          format: date-time
          type: string
        baseConstant:
          $ref: '#/components/schemas/Constant'
        proposedConstant:
          $ref: '#/components/schemas/Constant'
        proposedChanges:
          type: array
          items:
            anyOf:
            - type: object
              properties:
                op:
                  type: string
                  const: add
                path:
                  type: string
                  pattern: ^\/[^/]+$
                value: {}
              required:
              - op
              - path
              - value
              additionalProperties: false
            - type: object
              properties:
                op:
                  type: string
                  const: remove
                path:
                  type: string
                  pattern: ^\/[^/]+$
              required:
              - op
              - path
              additionalProperties: false
            - type: object
              properties:
                op:
                  type: string
                  const: replace
                path:
                  type: string
                  pattern: ^\/[^/]+$
                value: {}
              required:
              - op
              - path
              - value
              additionalProperties: false
            - type: object
              properties:
                op:
                  type: string
                  const: move
                from:
                  type: string
                  pattern: ^\/[^/]+$
                path:
                  type: string
                  pattern: ^\/[^/]+$
              required:
              - op
              - from
              - path
              additionalProperties: false
            - type: object
              properties:
                op:
                  type: string
                  const: copy
                from:
                  type: string
                  pattern: ^\/[^/]+$
                path:
                  type: string
                  pattern: ^\/[^/]+$
              required:
              - op
              - from
              - path
              additionalProperties: false
            - type: object
              properties:
                op:
                  type: string
                  const: test
                path:
                  type: string
                  pattern: ^\/[^/]+$
                value: {}
              required:
              - op
              - path
              - value
              additionalProperties: false
      required:
      - id
      - status
      - authorId
      - reviews
      - activityLog
      - dateCreated
      - dateUpdated
      - baseConstant
      - proposedConstant
      - proposedChanges
      additionalProperties: false
    EventUser:
      description: Who performed an action
      type: object
      properties:
        type:
          description: '`dashboard` (signed-in member), `api_key` (API key or personal access token) or `system`'
          type: string
          enum:
          - dashboard
          - api_key
          - system
        id:
          description: The member's user ID. Absent for an organization API key
          type: string
        apiKey:
          description: The API key's ID, when the action came through one
          type: string
        name:
          description: The member's name, or the organization API key's name
          type: string
        email:
          description: The member's email. Absent for an organization API key
          type: string
        requestedBy:
          description: The member named with `X-GrowthBook-Requested-By`
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            email:
              type: string
          required:
          - id
          - name
          - email
          additionalProperties: false
        assumedRole:
          description: Whether the key assumed the named member's role
          type: boolean
      required:
      - type
      additionalProperties: false
    bypassedGates:
      type: object
      properties:
        type:
          description: The gate that was bypassed (e.g. "approval-required", "stale-base", "schema-break").
          type: string
        outcome:
          type: string
          const: bypassed
        via:
          description: How the gate was bypassed. The value identifies a request field (`ignoreWarnings`, `skipSchemaValidation`, or `skipHooks`), the caller's permission (`bypassApprovalPermission`), or an organization setting (`restApiBypassesReviews`, or `revertsBypassApproval` on a revert).
          type: string
          enum:
          - ignoreWarnings
          - skipSchemaValidation
          - skipHooks
          - bypassApprovalPermission
          - restApiBypassesReviews
          - revertsBypassApproval
      required:
      - type
      - outcome
      - via
      additionalProperties: false
    ConstantRevisionReview:
      type: object
      properties:
        id:
          type: string
        userId:
          description: 'Who acted: a member''s user ID, or an API key''s ID when it acted as itself'
          type: string
        decision:
          type: string
          enum:
          - approve
          - request-changes
          - comment
        comment:
          type: string
        stale:
          description: True if a later review cycle (re-submit, approval reset, recall, or reopen) superseded this verdict. Stale verdicts are kept for attribution but no longer count as an active approval or change-request.
          type: boolean
        dateCreated:
          format: date-time
          type: string
        user:
          $ref: '#/components/schemas/EventUser'
      required:
      - id
      - userId
      - decision
      - dateCreated
      additionalProperties: false
    Confirmation:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum:
          - pending
          - running
          - completed
          - rejected
          - expired
        actions:
          type: array
          items:
            type: object
            properties:
              action:
                type: string
                enum:
                - feature.create
                - feature.draft
                - feature.review
                - feature.publish
                - feature.archive
                - feature.delete
                - feature.other
                - experiment.create
                - experiment.draft
                - experiment.start
                - experiment.stop
                - experiment.targeting
                - experiment.traffic
                - experiment.phases
                - experiment.visualEditor
                - experiment.other
                - savedGroup.create
                - savedGroup.draft
                - savedGroup.review
                - savedGroup.publish
                - savedGroup.archive
                - savedGroup.delete
                - savedGroup.other
                - constant.create
                - constant.draft
                - constant.review
                - constant.publish
                - constant.archive
                - constant.delete
                - constant.other
                - config.create
                - config.draft
                - config.review
                - config.publish
                - config.archive
                - config.delete
                - config.other
                - rampSchedule.create
                - rampSchedule.start
                - rampSchedule.pause
                - rampSchedule.progression
                - rampSchedule.approve
                - rampSchedule.edit
                - rampSchedule.delete
                - rampSchedule.other
                - settings.approvals
                - settings.other
                - access.members
