    post:
      operationId: postConstantRevisionUndoReview
      summary: Retract your own review verdict
      description: Retracts the calling user's own active `approve` or `request-changes` verdict, returning the revision to `pending-review`. Review comments stay in the log. Retracting a `request-changes` can leave the revision approved by someone else, in which case an armed auto-publish fires. The verdict belongs to whoever the request acts as; see Naming who asked. No one can rule on a draft they created.
