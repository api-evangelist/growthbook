openapi: 3.2.0
info:
  version: 5.1.0
  title: GrowthBook REST Constant Revisions API
  description: 'GrowthBook offers a full REST API for interacting with the application. Request data can use either JSON or Form data encoding (with proper `Content-Type` headers). All response bodies are JSON-encoded. The API base URL for GrowthBook Cloud is `https://api.growthbook.io/api`. For self-hosted deployments, it is the same as your API_HOST environment variable (defaults to `http://localhost:3100/api`). The rest of these docs will assume you are using GrowthBook Cloud. ## Versioning


    Endpoints are versioned by path prefix:


    - `/v1/...` — stable, widely-supported endpoints

    - `/v2/...` — updated endpoints with improved shapes (e.g. unified per-rule environment scope for feature flags)


    New integrations should prefer v2 where available. Feature-flag and metric v1 routes are deprecated: they are tagged **LEGACY** in the sidebar and collapsed by default. Use the matching v2 group when both exist. ## Authentication


    We support both the HTTP Basic and Bearer authentication schemes for convenience. You first need to generate a new API Key in GrowthBook. Different keys have different permissions:


    - **Personal Access Tokens**: These are sensitive and provide the same level of access as the user has to an organization, or less if the token''s permissions are limited. These can be created by going to `Personal Access Tokens` under your user menu. Members with the API Keys **Manage members'' tokens** permission can disable a member''s token under `Settings -> Manage PATs`, and admins can require new tokens to expire within a maximum lifetime. - **Secret Keys**: These are sensitive and provide the level of access of the role they are given, which can be any built-in or custom role, with optional per-project role overrides and environment limits. Managing Secret Keys on behalf of an organization takes the API Keys permissions. These can be created by going to `Settings -> API Keys`, where Admins can also require new Secret Keys to expire within a maximum lifetime. If using HTTP Basic auth, pass the Secret Key as the username and leave the password blank (when using curl, add `:` at the end of the secret to indicate an empty password)


    ```bash

    curl https://api.growthbook.io/api/v1/features \

    -u secret_abc123DEF456:

    ```


    If using Bearer auth, pass the Secret Key as the token:


    ```bash

    curl https://api.growthbook.io/api/v1/features \

    -H "Authorization: Bearer secret_abc123DEF456"

    ```


    If a key has an expiration date, every response includes it in the `X-GrowthBook-Key-Expires-At` header (ISO 8601), so scripts can warn before the key stops working. Requests made with an expired key fail with a `401` that says where to create a replacement. See Expiration for choosing a key''s expiration, the warnings before it lapses, and the organization policies. ## Naming who asked


    Requests made with a Secret Key may add an `X-GrowthBook-Requested-By` header naming the organization member who asked for the change, as a user id or an email address. History, revision logs and webhooks show that member next to the key. Each key''s settings under `Settings -> API Keys`:


    - **Header**: **Optional** (the default) uses the header when it''s sent, **Required** rejects requests without it, and **Rejected** rejects requests that send it, each with a 400. - **Permissions**, when a member is named:

    - **Assume member''s role** (the default): the request acts as that member, with only what both the key and the member can do, so the header can narrow a key but never widen it. Drafts, owners, `mine` filters and reviews are the member''s. The member''s rights over their own drafts, comments and verdicts apply only where the key''s own role allows the same action. - **Use key''s role**: the key acts as itself, with its own permissions, and the name is only recorded in history. Drafts, verdicts and ownership are the key''s, as when no member is named.'
servers:
- url: https://api.growthbook.io/api
  description: GrowthBook Cloud
- url: https://{domain}/api
  description: Self-hosted GrowthBook
  variables:
    domain:
      default: localhost:3100
      description: Your self-hosted GrowthBook host (and port)
security:
- bearerAuth: []
- basicAuth: []
tags:
- name: constant-revisions
  x-displayName: Constant Revisions
  description: '**Beta** — these endpoints are new and may change in backwards-incompatible ways.


    Draft revisions for constants, including pending changes, approvals, and lifecycle (publish, discard, revert). Pass `version: "new"` on edit endpoints to auto-create a draft.'
paths:
  /v1/constants-revisions:
    get:
      operationId: listConstantRevisions
      summary: List constant revisions across the organization
      description: Returns a paginated list of revisions across all constants in the organization, sorted newest-first. Optionally filtered by constant, status, author, or the calling user's involvement.
      tags:
      - constant-revisions
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/skipPagination'
      - name: key
        in: query
        description: Restrict results to revisions for a single constant (by its key). When omitted, returns revisions across every constant the caller can read.
        schema:
          description: Restrict results to revisions for a single constant (by its key). When omitted, returns revisions across every constant the caller can read.
          type: string
      - name: status
        in: query
        description: Filter by revision status. Accepts a comma-separated list, or the literal `open` for non-merged/non-discarded revisions.
        schema:
          description: Filter by revision status. Accepts a comma-separated list, or the literal `open` for non-merged/non-discarded revisions.
          type: string
      - $ref: '#/components/parameters/author'
      - name: mine
        in: query
        description: If true, return only revisions authored by the calling user. Needs a personal access token, or an organization API key that assumes a named member's role. Mutually exclusive with `author`.
        schema:
          description: If true, return only revisions authored by the calling user. Needs a personal access token, or an organization API key that assumes a named member's role. Mutually exclusive with `author`.
          anyOf:
          - type: string
            const: 'true'
          - type: string
            const: 'false'
          - type: string
            const: '0'
          - type: string
            const: '1'
          - type: boolean
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  revisions:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConstantRevision'
                  limit:
                    type: integer
                  offset:
                    type: integer
                  count:
                    type: integer
                  total:
                    type: integer
                  hasMore:
                    type: boolean
                  nextOffset:
                    anyOf:
                    - type: integer
                    - type: 'null'
                required:
                - revisions
                - limit
                - offset
                - count
                - total
                - hasMore
                - nextOffset
                additionalProperties: false
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v1/constants-revisions' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v1/constants-revisions/{key}:
    get:
      operationId: getConstantRevisions
      summary: List revisions for a constant
      description: Returns a paginated list of revisions for this constant, sorted newest-first. Optionally filtered by status, author, or the calling user's involvement.
      tags:
      - constant-revisions
      parameters:
      - name: key
        in: path
        required: true
        description: ''
        schema:
          type: string
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/skipPagination'
      - name: status
        in: query
        description: Filter by revision status. Accepts a comma-separated list, or the literal `open` for non-merged/non-discarded revisions.
        schema:
          description: Filter by revision status. Accepts a comma-separated list, or the literal `open` for non-merged/non-discarded revisions.
          type: string
      - $ref: '#/components/parameters/author'
      - name: mine
        in: query
        description: If true, return only revisions authored by the calling user. Needs a personal access token, or an organization API key that assumes a named member's role. Mutually exclusive with `author`.
        schema:
          description: If true, return only revisions authored by the calling user. Needs a personal access token, or an organization API key that assumes a named member's role. Mutually exclusive with `author`.
          anyOf:
          - type: string
            const: 'true'
          - type: string
            const: 'false'
          - type: string
            const: '0'
          - type: string
            const: '1'
          - type: boolean
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  revisions:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConstantRevision'
                  limit:
                    type: integer
                  offset:
                    type: integer
                  count:
                    type: integer
                  total:
                    type: integer
                  hasMore:
                    type: boolean
                  nextOffset:
                    anyOf:
                    - type: integer
                    - type: 'null'
                required:
                - revisions
                - limit
                - offset
                - count
                - total
                - hasMore
                - nextOffset
                additionalProperties: false
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v1/constants-revisions/config-snippet' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
    post:
      operationId: postConstantRevision
      summary: Create a draft revision
      description: Creates a new draft revision branched from the current live constant. A constant can have multiple concurrent drafts; use this to start an isolated line of edits.
      tags:
      - constant-revisions
      parameters:
      - name: key
        in: path
        required: true
        description: ''
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                comment:
                  type: string
              additionalProperties: false
      responses:
        '200':
          description: Resource created
          content:
            application/json:
              schema:
                type: object
                properties:
                  revision:
                    $ref: '#/components/schemas/ConstantRevision'
                required:
                - revision
                additionalProperties: false
        '202':
          $ref: '#/components/responses/ConfirmationHeld'
      x-codeSamples:
      - lang: cURL
        source: "curl -X POST 'https://api.growthbook.io/api/v1/constants-revisions/{key}' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v1/constants-revisions/{key}/latest:
    get:
      operationId: getConstantRevisionLatest
      summary: Get the most recent active draft revision
      description: Returns the most recently updated open (non-merged, non-discarded) revision for the constant. Returns 404 if there is no active draft. Pass `mine=true` to restrict to drafts authored by the calling user. Needs a personal access token, or an organization API key that assumes a named member's role.
      tags:
      - constant-revisions
      parameters:
      - name: key
        in: path
        required: true
        description: ''
        schema:
          type: string
      - name: mine
        in: query
        description: If true, return only the most recent active draft authored by the calling user. Needs a personal access token, or an organization API key that assumes a named member's role.
        schema:
          description: If true, return only the most recent active draft authored by the calling user. Needs a personal access token, or an organization API key that assumes a named member's role.
          anyOf:
          - type: string
            const: 'true'
          - type: string
            const: 'false'
          - type: string
            const: '0'
          - type: string
            const: '1'
          - type: boolean
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  revision:
                    $ref: '#/components/schemas/ConstantRevision'
                required:
                - revision
                additionalProperties: false
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v1/constants-revisions/config-snippet/latest' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v1/constants-revisions/{key}/{version}:
    get:
      operationId: getConstantRevision
      summary: Get a single constant revision
      description: Returns the revision at the specified version for this constant. Use `GET /constants-revisions/{key}/latest` for the most recent active draft.
      tags:
      - constant-revisions
      parameters:
      - name: key
        in: path
        required: true
        description: ''
        schema:
          type: string
      - $ref: '#/components/parameters/version'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  revision:
                    $ref: '#/components/schemas/ConstantRevision'
                required:
                - revision
                additionalProperties: false
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v1/constants-revisions/config-snippet/3' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v1/constants-revisions/{key}/{version}/metadata:
    put:
      operationId: putConstantRevisionMetadata
      summary: Update constant metadata in a draft revision
      description: 'Stages metadata changes (name, owner, description, project) on the draft. Pass `version: "new"` to auto-create a draft. The change is only applied to the live constant when the revision is merged.'
      tags:
      - constant-revisions
      parameters:
      - name: key
        in: path
        required: true
        description: ''
        schema:
          type: string
      - name: version
        in: path
        required: true
        description: ''
        schema:
          anyOf:
          - type: integer
          - type: string
            const: new
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                revisionTitle:
                  description: Short draft title (e.g. `Enable for beta testers`). Only used when `version` is "new"; ignored for existing drafts.
                  type: string
                revisionComment:
                  description: Markdown. What changed and why, for reviewers. Only used when `version` is "new"; ignored for existing drafts.
                  type: string
                name:
                  description: Short display name. Put details in `description`.
                  type: string
                owner:
                  description: The userId or email address of the owner. If an email address is provided, it will be used to look up the userId of the matching organization member. If an ID is provided, it will be validated as existing in the organization.
                  type: string
                description:
                  description: Markdown. Put context here, not in the name.
                  type: string
                project:
                  type: string
              additionalProperties: false
      responses:
        '200':
          description: Resource updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  revision:
                    $ref: '#/components/schemas/ConstantRevision'
                required:
                - revision
                additionalProperties: false
        '202':
          $ref: '#/components/responses/ConfirmationHeld'
      x-codeSamples:
      - lang: cURL
        source: "curl -X PUT 'https://api.growthbook.io/api/v1/constants-revisions/{key}/{version}/metadata' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v1/constants-revisions/{key}/{version}/value:
    put:
      operationId: putConstantRevisionValue
      summary: Update the value of a constant draft revision
      description: 'Stages a new default `value` and/or per-environment `environmentValues` on the draft. At least one must be supplied. Pass `version: "new"` to auto-create a draft. The value must match the constant''s type (valid JSON for `json` constants).'
      tags:
      - constant-revisions
      parameters:
      - name: key
        in: path
        required: true
        description: ''
        schema:
          type: string
      - name: version
        in: path
        required: true
        description: ''
        schema:
          anyOf:
          - type: integer
          - type: string
            const: new
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                revisionTitle:
                  description: Short draft title (e.g. `Enable for beta testers`). Only used when `version` is "new"; ignored for existing drafts.
                  type: string
                revisionComment:
                  description: Markdown. What changed and why, for reviewers. Only used when `version` is "new"; ignored for existing drafts.
                  type: string
                value:
                  description: The default value (raw string for `string` constants, JSON-encoded for `json` constants)
                  type: string
                environmentValues:
                  description: Per-environment value overrides (environment id → value)
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties:
                    type: string
              additionalProperties: false
      responses:
        '200':
          description: Resource updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  revision:
                    $ref: '#/components/schemas/ConstantRevision'
                required:
                - revision
                additionalProperties: false
        '202':
          $ref: '#/components/responses/ConfirmationHeld'
      x-codeSamples:
      - lang: cURL
        source: "curl -X PUT 'https://api.growthbook.io/api/v1/constants-revisions/{key}/{version}/value' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v1/constants-revisions/{key}/{version}/archive:
    put:
      operationId: putConstantRevisionArchive
      summary: Stage an archive/unarchive in a draft revision
      description: 'Stages an archive or unarchive on the draft. Pass `version: "new"` to auto-create a draft. Archived constants can be permanently deleted via `DELETE /constants/{key}` once the archive is published.'
      tags:
      - constant-revisions
      parameters:
      - name: key
        in: path
        required: true
        description: ''
        schema:
          type: string
      - name: version
        in: path
        required: true
        description: ''
        schema:
          anyOf:
          - type: integer
          - type: string
            const: new
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                revisionTitle:
                  description: Short draft title (e.g. `Enable for beta testers`). Only used when `version` is "new"; ignored for existing drafts.
                  type: string
                revisionComment:
                  description: Markdown. What changed and why, for reviewers. Only used when `version` is "new"; ignored for existing drafts.
                  type: string
                archived:
                  type: boolean
                ignoreWarnings:
                  description: Set to true to acknowledge the warnings listed in a blocked response and continue. This covers experiment guards, locked dependents, and references affected by an archive. When the organization treats schema failures as warnings, it also covers schema and invariant warnings. It never bypasses a rejected Custom Hook. On revision publish endpoints, it can also force-publish an out-of-date draft when the caller has Bypass draft approvals access. Only set this when a person has explicitly asked you to. If a check blocks you, stop and ask a person instead of working around it.
                  type: boolean
                skipSchemaValidation:
                  description: Set to true to publish despite schema validation errors, failed invariants, or schema changes that invalidate dependent resources. This does not bypass a rejected Custom Hook; use `skipHooks` for that. The caller must have Bypass draft approvals access for Feature Flags, Configs, and Constants in every Project. Otherwise, this field is ignored. Only set this when a person has explicitly asked you to. If a check blocks you, stop and ask a person instead of working around it.
                  type: boolean
                skipHooks:
                  description: Set to true to publish despite a Custom Hook rejection. This does not bypass schema validation; use `skipSchemaValidation` for that. The caller must have Bypass draft approvals access for Feature Flags, Configs, and Constants in every Project. Otherwise, this field is ignored. Only set this when a person has explicitly asked you to. If a check blocks you, stop and ask a person instead of working around it.
                  type: boolean
              required:
              - archived
              additionalProperties: false
      responses:
        '200':
          description: Resource updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  revision:
                    $ref: '#/components/schemas/ConstantRevision'
                required:
                - revision
                additionalProperties: false
        '202':
          $ref: '#/components/responses/ConfirmationHeld'
      x-codeSamples:
      - lang: cURL
        source: "curl -X PUT 'https://api.growthbook.io/api/v1/constants-revisions/{key}/{version}/archive' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v1/constants-revisions/{key}/{version}/request-review:
    post:
      operationId: postConstantRevisionRequestReview
      summary: Request review for a draft revision
      description: 'Moves the draft from `draft` into `pending-review`. Notifies reviewers per the org''s approval-flow settings.


        Set `autoPublishOnApproval` to `true` to publish the revision automatically the moment it is approved. This requires the org to have auto-publish-on-approval enabled and the caller to have publish permission on the constant.'
      tags:
      - constant-revisions
      parameters:
      - name: key
        in: path
        required: true
        description: ''
        schema:
          type: string
      - $ref: '#/components/parameters/version'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                autoPublishOnApproval:
                  type: boolean
                ignoreWarnings:
                  description: Set to true to acknowledge the warnings listed in a blocked response and continue. This covers experiment guards, locked dependents, and references affected by an archive. When the organization treats schema failures as warnings, it also covers schema and invariant warnings. It never bypasses a rejected Custom Hook. On revision publish endpoints, it can also force-publish an out-of-date draft when the caller has Bypass draft approvals access. Only set this when a person has explicitly asked you to. If a check blocks you, stop and ask a person instead of working around it.
                  type: boolean
                skipSchemaValidation:
                  description: Set to true to publish despite schema validation errors, failed invariants, or schema changes that invalidate dependent resources. This does not bypass a rejected Custom Hook; use `skipHooks` for that. The caller must have Bypass draft approvals access for Feature Flags, Configs, and Constants in every Project. Otherwise, this field is ignored. Only set this when a person has explicitly asked you to. If a check blocks you, stop and ask a person instead of working around it.
                  type: boolean
                skipHooks:
                  description: Set to true to publish despite a Custom Hook rejection. This does not bypass schema validation; use `skipSchemaValidation` for that. The caller must have Bypass draft approvals access for Feature Flags, Configs, and Constants in every Project. Otherwise, this field is ignored. Only set this when a person has explicitly asked you to. If a check blocks you, stop and ask a person instead of working around it.
                  type: boolean
              additionalProperties: false
      responses:
        '200':
          description: Resource created
          content:
            application/json:
              schema:
                type: object
                properties:
                  revision:
                    $ref: '#/components/schemas/ConstantRevision'
                required:
                - revision
                additionalProperties: false
        '202':
          $ref: '#/components/responses/ConfirmationHeld'
      x-codeSamples:
      - lang: cURL
        source: "curl -X POST 'https://api.growthbook.io/api/v1/constants-revisions/{key}/{version}/request-review' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v1/constants-revisions/{key}/{version}/submit-review:
    post:
      operationId: postConstantRevisionSubmitReview
      summary: Submit a review on a draft revision
      description: 'Submits an `approve`, `request-changes`, or `comment` review on the revision. The verdict belongs to whoever the request acts as; see Naming who asked. No one can rule on a draft they created. Submitting `approve` or `request-changes` needs Review access. A `comment` is participation rather than a verdict, so it is also open to the Comments permission or draft authority on the entity. Authors and contributors cannot submit `approve` reviews on their own drafts when the org has `blockSelfApproval` enabled.


        When `decision` is `approve` and the revision has `autoPublishOnApproval` enabled, the revision is automatically published after approval. The response includes `autoPublished: true` when this happens. Pass `skipAutoPublish: true` to approve without triggering auto-publish.'
      tags:
      - constant-revisions
      parameters:
      - name: key
        in: path
        required: true
        description: ''
        schema:
          type: string
      - $ref: '#/components/parameters/version'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision:
                  type: string
                  enum:
                  - approve
                  - request-changes
                  - comment
                comment:
                  description: Markdown. Why you approved, requested changes or commented.
                  type: string
                skipAutoPublish:
                  type: boolean
              required:
              - decision
              additionalProperties: false
      responses:
        '200':
          description: Resource created
          content:
            application/json:
              schema:
                type: object
                properties:
                  revision:
                    $ref: '#/components/schemas/ConstantRevision'
                  autoPublished:
                    type: boolean
                required:
                - revision
                additionalProperties: false
        '202':
          $ref: '#/components/responses/ConfirmationHeld'
      x-codeSamples:
      - lang: cURL
        source: "curl -X POST 'https://api.growthbook.io/api/v1/constants-revisions/{key}/{version}/submit-review' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v1/constants-revisions/{key}/{version}/recall-review:
    post:
      operationId: postConstantRevisionRecallReview
      summary: Recall a review request
      description: Pulls a revision in review (`pending-review`, `changes-requested`, or `approved`) back to `draft`, clearing existing reviews and disarming any auto-publish-on-approval.
      tags:
      - constant-revisions
      parameters:
      - name: key
        in: path
        required: true
        description: ''
        schema:
          type: string
      - $ref: '#/components/parameters/version'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
              additionalProperties: false
      responses:
        '200':
          description: Resource created
          content:
            application/json:
              schema:
                type: object
                properties:
                  revision:
                    $ref: '#/components/schemas/ConstantRevision'
                required:
                - revision
                additionalProperties: false
        '202':
          $ref: '#/components/responses/ConfirmationHeld'
      x-codeSamples:
      - lang: cURL
        source: "curl -X POST 'https://api.growthbook.io/api/v1/constants-revisions/{key}/{version}/recall-review' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v1/constants-revisions/{key}/{version}/reopen:
    post:
      operationId: postConstantRevisionReopen
      summary: Reopen a discarded revision
      description: Returns a previously discarded revision to `draft` status so it can be edited and published again. Only discarded revisions can be reopened.
      tags:
      - constant-revisions
      parameters:
      - name: key
        in: path
        required: true
        description: ''
        schema:
          type: string
      - $ref: '#/components/parameters/version'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
              additionalProperties: false
      responses:
        '200':
          description: Resource created
