  /v1/experiment-templates/bulk-import:
    post:
      operationId: bulkImportExperimentTemplates
      summary: Bulk create or update experiment templates
      tags:
      - Experiment Templates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                templates:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      data:
                        type: object
                        properties:
                          project:
                            type: string
                          templateMetadata:
                            type: object
                            properties:
                              name:
                                description: Short display name (e.g. `Checkout test`).
                                type: string
                              description:
                                description: When to use this template.
                                type: string
                                maxLength: 10000
                            required:
                            - name
                            additionalProperties: false
                          type:
                            type: string
                            enum:
                            - standard
                          hypothesis:
                            description: Default hypothesis for experiments created from this template. Markdown. If we change X, metric Y will move because Z.
                            type: string
                          description:
                            description: Default description for experiments created from this template. Markdown.
                            type: string
                            maxLength: 10000
                          tags:
                            description: Tags for filtering and grouping. Use these instead of encoding groups in names.
                            type: array
                            items:
                              type: string
                          customFields:
                            type: object
                            propertyNames:
                              type: string
                            additionalProperties:
                              type: string
                          datasource:
                            type: string
