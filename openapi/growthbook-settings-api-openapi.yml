openapi: 3.2.0
info:
  version: 1.0.0
  title: GrowthBook REST Settings API
  description: GrowthBook offers a full REST API for interacting with the application.
servers:
- url: https://api.growthbook.io/api
  description: GrowthBook Cloud
- url: https://{domain}/api
  description: Self-hosted GrowthBook
security:
- bearerAuth: []
- basicAuth: []
tags:
- name: Settings
  x-displayName: Settings
  description: Get the organization settings.
paths:
  /v1/settings:
    get:
      operationId: getSettings
      summary: Get organization settings
      tags:
      - Settings
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    $ref: '#/components/schemas/Settings'
                required:
                - settings
                additionalProperties: false
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v1/settings' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
components:
  schemas:
    Settings:
      type: object
      properties:
        confidenceLevel:
          type: number
        northStar:
          anyOf:
          - type: object
            properties:
              title:
                type: string
              metricIds:
                type: array
                items:
                  type: string
            additionalProperties: false
          - type: 'null'
        metricDefaults:
          type: object
          properties:
            priorSettings:
              type: object
              properties:
                override:
                  type: boolean
                proper:
                  type: boolean
                mean:
                  type: number
                stddev:
                  type: number
              required:
              - override
              - proper
              - mean
              - stddev
              additionalProperties: false
            minimumSampleSize:
              type: number
            maxPercentageChange:
              type: number
            minPercentageChange:
              type: number
            targetMDE:
              type: number
          additionalProperties: false
        pastExperimentsMinLength:
          type: number
        metricAnalysisDays:
          type: number
        updateSchedule:
          anyOf:
          - type: object
            properties:
              type:
                type: string
                enum:
                - cron
                - never
                - stale
              cron:
                anyOf:
                - type: string
                - type: 'null'
              hours:
                anyOf:
                - type: number
                - type: 'null'
            additionalProperties: false
          - type: 'null'
        multipleExposureMinPercent:
          type: number
        defaultRole:
          type: object
          properties:
            role:
              type: string
            limitAccessByEnvironment:
              type: boolean
            environments:
              type: array
              items:
                type: string
          additionalProperties: false
        statsEngine:
          type: string
        pValueThreshold:
          type: number
        regressionAdjustmentEnabled:
          type: boolean
        regressionAdjustmentDays:
          type: number
        sequentialTestingEnabled:
          type: boolean
        sequentialTestingTuningParameter:
          type: number
        attributionModel:
          type: string
          enum:
          - firstExposure
          - experimentDuration
          - lookbackOverride
        targetMDE:
          type: number
        delayHours:
          type: number
        windowType:
          type: string
        windowHours:
          type: number
        winRisk:
          type: number
        loseRisk:
          type: number
        secureAttributeSalt:
          type: string
        killswitchConfirmation:
          type: boolean
        featureKillSwitchBehavior:
          type: string
          enum:
          - 'off'
          - warn
        requireReviews:
          type: array
          items:
            type: object
            properties:
              requireReviewOn:
                type: boolean
              resetReviewOnChange:
                type: boolean
              environments:
                type: array
                items:
                  type: string
              projects:
                type: array
                items:
                  type: string
              featureRequireEnvironmentReview:
                type: boolean
              featureRequireMetadataReview:
                type: boolean
            additionalProperties: false
        restApiBypassesReviews:
          type: boolean
        featureKeyExample:
          type: string
        featureRegexValidator:
          type: string
        banditScheduleValue:
          type: number
        banditScheduleUnit:
          type: string
          enum:
          - hours
          - days
        banditBurnInValue:
          type: number
        banditBurnInUnit:
          type: string
          enum:
          - hours
          - days
        experimentMinLengthDays:
          type: number
        experimentMaxLengthDays:
          anyOf:
          - type: number
          - type: 'null'
        preferredEnvironment:
          anyOf:
          - type: string
          - type: 'null'
        maxMetricSliceLevels:
          type: number
      required:
      - confidenceLevel
      - northStar
      - metricDefaults
      - pastExperimentsMinLength
      - metricAnalysisDays
      - updateSchedule
      - multipleExposureMinPercent
      - defaultRole
      - statsEngine
      - pValueThreshold
      - regressionAdjustmentEnabled
      - regressionAdjustmentDays
      - sequentialTestingEnabled
      - sequentialTestingTuningParameter
      - attributionModel
      - targetMDE
      - delayHours
      - windowType
      - windowHours
      - winRisk
      - loseRisk
      - secureAttributeSalt
      - killswitchConfirmation
      - requireReviews
      - featureKeyExample
      - featureRegexValidator
      - banditScheduleValue
      - banditScheduleUnit
      - banditBurnInValue
      - banditBurnInUnit
      - experimentMinLengthDays
      additionalProperties: false
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'If using Bearer auth, pass the Secret Key as the token:

        ```bash

        curl https://api.growthbook.io/api/v1/features   -H "Authorization: Bearer secret_abc123DEF456"

        ```

        '
    basicAuth:
      type: http
      scheme: basic
      description: 'If using HTTP Basic auth, pass the Secret Key as the username and leave the password blank:

        ```bash

        curl https://api.growthbook.io/api/v1/features   -u secret_abc123DEF456:

        # The ":" at the end stops curl from asking for a password

        ```

        '
