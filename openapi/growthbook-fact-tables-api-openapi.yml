openapi: 3.2.0
info:
  version: 5.1.0
  title: GrowthBook REST Fact Tables API
  description: 'GrowthBook offers a full REST API for interacting with the application. Request data can use either JSON or Form data encoding (with proper `Content-Type` headers). All response bodies are JSON-encoded. The API base URL for GrowthBook Cloud is `https://api.growthbook.io/api`. For self-hosted deployments, it is the same as your API_HOST environment variable (defaults to `http://localhost:3100/api`). The rest of these docs will assume you are using GrowthBook Cloud. ## Versioning


    Endpoints are versioned by path prefix:


    - `/v1/...` — stable, widely-supported endpoints

    - `/v2/...` — updated endpoints with improved shapes (e.g. unified per-rule environment scope for feature flags)


    New integrations should prefer v2 where available. Feature-flag and metric v1 routes are deprecated: they are tagged **LEGACY** in the sidebar and collapsed by default. Use the matching v2 group when both exist. ## Authentication


    We support both the HTTP Basic and Bearer authentication schemes for convenience. You first need to generate a new API Key in GrowthBook. Different keys have different permissions:


    - **Personal Access Tokens**: These are sensitive and provide the same level of access as the user has to an organization, or less if the token''s permissions are limited. These can be created by going to `Personal Access Tokens` under your user menu. Members with the API Keys **Manage members'' tokens** permission can disable a member''s token under `Settings -> Manage PATs`, and admins can require new tokens to expire within a maximum lifetime. - **Secret Keys**: These are sensitive and provide the level of access of the role they are given, which can be any built-in or custom role, with optional per-project role overrides and environment limits. Managing Secret Keys on behalf of an organization takes the API Keys permissions. These can be created by going to `Settings -> API Keys`, where Admins can also require new Secret Keys to expire within a maximum lifetime. If using HTTP Basic auth, pass the Secret Key as the username and leave the password blank (when using curl, add `:` at the end of the secret to indicate an empty password)


    ```bash

    curl https://api.growthbook.io/api/v1/features \

    -u secret_abc123DEF456:

    ```


    If using Bearer auth, pass the Secret Key as the token:


    ```bash

    curl https://api.growthbook.io/api/v1/features \

    -H "Authorization: Bearer secret_abc123DEF456"

    ```


    If a key has an expiration date, every response includes it in the `X-GrowthBook-Key-Expires-At` header (ISO 8601), so scripts can warn before the key stops working. Requests made with an expired key fail with a `401` that says where to create a replacement. See Expiration for choosing a key''s expiration, the warnings before it lapses, and the organization policies. ## Naming who asked


    Requests made with a Secret Key may add an `X-GrowthBook-Requested-By` header naming the organization member who asked for the change, as a user id or an email address. History, revision logs and webhooks show that member next to the key. Each key''s settings under `Settings -> API Keys`:


    - **Header**: **Optional** (the default) uses the header when it''s sent, **Required** rejects requests without it, and **Rejected** rejects requests that send it, each with a 400. - **Permissions**, when a member is named:

    - **Assume member''s role** (the default): the request acts as that member, with only what both the key and the member can do, so the header can narrow a key but never widen it. Drafts, owners, `mine` filters and reviews are the member''s. The member''s rights over their own drafts, comments and verdicts apply only where the key''s own role allows the same action. - **Use key''s role**: the key acts as itself, with its own permissions, and the name is only recorded in history. Drafts, verdicts and ownership are the key''s, as when no member is named.'
servers:
- url: https://api.growthbook.io/api
  description: GrowthBook Cloud
- url: https://{domain}/api
  description: Self-hosted GrowthBook
  variables:
    domain:
      default: localhost:3100
      description: Your self-hosted GrowthBook host (and port)
security:
- bearerAuth: []
- basicAuth: []
tags:
- name: fact-tables
  x-displayName: Fact Tables
  description: Fact Tables describe the shape of your data warehouse tables
paths:
  /v1/fact-tables:
    get:
      operationId: listFactTables
      summary: Get all fact tables
      tags:
      - fact-tables
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/datasourceId'
      - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    factTables:
                      type: array
                      items:
                        $ref: '#/components/schemas/FactTable'
                  required:
                  - factTables
                  additionalProperties: false
                - $ref: '#/components/schemas/PaginationFields'
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v1/fact-tables' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
    post:
      operationId: postFactTable
      summary: Create a single fact table
      tags:
      - fact-tables
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: Short display name. Put details in `description`.
                  type: string
                description:
                  description: Markdown. Put context here, not in the name.
                  type: string
                  maxLength: 10000
                owner:
                  description: The userId or email address of the owner. If an email address is provided, it will be used to look up the userId of the matching organization member. If an ID is provided, it will be validated as existing in the organization.
                  type: string
                projects:
                  description: List of associated project ids
                  type: array
                  items:
                    type: string
                tags:
                  description: List of associated tags
                  type: array
                  items:
                    type: string
                datasource:
                  description: The datasource id
                  type: string
                userIdTypes:
                  description: List of identifier columns in this table. For example, "id" or "anonymous_id"
                  type: array
                  items:
                    type: string
                userIdColumns:
                  description: 'Maps an identifier type to the column holding it, for SQL that does not alias its columns to the identifier type names, e.g. `{"user_id": "userId"}`. May also be a single-level field path into a JSON column (`properties.userId`). Unmapped types use the identifier type name as the column name.'
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties:
                    type: string
                aggregatedFactTableSettings:
                  description: Settings for maintaining shared daily aggregated tables (a subset of userIdTypes plus the daily update time and restate lookback window) used to speed up CUPED. Requires the data pipeline (pipeline-mode) feature.
                  type: object
                  properties:
                    idTypes:
                      type: array
                      items:
                        type: string
                    updateTime:
                      type: object
                      properties:
                        time:
                          type: string
                        timezone:
                          type: string
                      required:
                      - time
                      - timezone
                      additionalProperties: false
                    lookbackWindow:
                      type: integer
                      exclusiveMinimum: 0
                    restateChunkDays:
                      type: integer
                      minimum: 1
                      maximum: 7
                  required:
                  - idTypes
                  - updateTime
                  - lookbackWindow
                  additionalProperties: false
                sql:
                  description: The SQL query for this fact table
                  type: string
                timestampColumn:
                  description: The column holding the event timestamp. Must be a date column on this fact table. Defaults to "timestamp" when unset.
                  type: string
                eventName:
                  description: The event name used in SQL template variables
                  type: string
                columns:
                  description: Optional array of column definitions to store for this fact table. Supplied columns are stored as-is. Omit `datatype` (or send "") on a column to have it auto-detected from the SQL.
                  type: array
                  items:
                    $ref: '#/components/schemas/FactTableColumnInput'
                managedBy:
                  description: Set this to "api" to disable editing in the GrowthBook UI
                  type: string
                  enum:
                  - ''
                  - api
                  - admin
              required:
              - name
              - datasource
              - userIdTypes
              - sql
              additionalProperties: false
      responses:
        '200':
          description: Resource created
          content:
            application/json:
              schema:
                type: object
                properties:
                  factTable:
                    $ref: '#/components/schemas/FactTable'
                required:
                - factTable
                additionalProperties: false
        '202':
          $ref: '#/components/responses/ConfirmationHeld'
      x-codeSamples:
      - lang: cURL
        source: "curl -X POST 'https://api.growthbook.io/api/v1/fact-tables' \\\n  -H 'Authorization: Bearer YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"name\":\"Orders\",\"datasource\":\"ds_abc123\",\"userIdTypes\":[\"id\"],\"sql\":\"SELECT * FROM orders\"}'"
  /v1/fact-tables/{id}:
    get:
      operationId: getFactTable
      summary: Get a single fact table
      tags:
      - fact-tables
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  factTable:
                    $ref: '#/components/schemas/FactTable'
                required:
                - factTable
                additionalProperties: false
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v1/fact-tables/abc123' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
    post:
      operationId: updateFactTable
      summary: Update a single fact table
      tags:
      - fact-tables
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: Short display name. Put details in `description`.
                  type: string
                description:
                  description: Markdown. Put context here, not in the name.
                  type: string
                  maxLength: 10000
                owner:
                  description: The userId or email address of the owner. If an email address is provided, it will be used to look up the userId of the matching organization member. If an ID is provided, it will be validated as existing in the organization.
                  type: string
                projects:
                  description: List of associated project ids
                  type: array
                  items:
                    type: string
                tags:
                  description: List of associated tags
                  type: array
                  items:
                    type: string
                userIdTypes:
                  description: List of identifier columns in this table. For example, "id" or "anonymous_id"
                  type: array
                  items:
                    type: string
                userIdColumns:
                  description: 'Maps an identifier type to the column holding it, for SQL that does not alias its columns to the identifier type names, e.g. `{"user_id": "userId"}`. May also be a single-level field path into a JSON column (`properties.userId`). Unmapped types use the identifier type name as the column name.'
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties:
                    type: string
                aggregatedFactTableSettings:
                  description: Settings for maintaining shared daily aggregated tables (a subset of userIdTypes plus the daily update time and restate lookback window) used to speed up CUPED. Requires the data pipeline (pipeline-mode) feature.
                  type: object
                  properties:
                    idTypes:
                      type: array
                      items:
                        type: string
                    updateTime:
                      type: object
                      properties:
                        time:
                          type: string
                        timezone:
                          type: string
                      required:
                      - time
                      - timezone
                      additionalProperties: false
                    lookbackWindow:
                      type: integer
                      exclusiveMinimum: 0
                    restateChunkDays:
                      type: integer
                      minimum: 1
                      maximum: 7
                  required:
                  - idTypes
                  - updateTime
                  - lookbackWindow
                  additionalProperties: false
                sql:
                  description: The SQL query for this fact table
                  type: string
                timestampColumn:
                  description: The column holding the event timestamp. Must be a date column on this fact table. Defaults to "timestamp" when unset.
                  type: string
                eventName:
                  description: The event name used in SQL template variables
                  type: string
                columns:
                  description: 'Optional array of columns to upsert by `column`: existing columns are patched, new columns are created, and columns not included are left unchanged. Omit `datatype` to leave an existing column''s type untouched; send "" to reset it for auto-detection; new columns are auto-detected when `datatype` is omitted or "". Slice-related properties require an enterprise license.'
                  type: array
                  items:
                    $ref: '#/components/schemas/FactTableColumnInput'
                managedBy:
                  description: Set this to "api" to disable editing in the GrowthBook UI
                  type: string
                  enum:
                  - ''
                  - api
                  - admin
                archived:
                  type: boolean
              additionalProperties: false
      responses:
        '200':
          description: Resource created
          content:
            application/json:
              schema:
                type: object
                properties:
                  factTable:
                    $ref: '#/components/schemas/FactTable'
                required:
                - factTable
                additionalProperties: false
        '202':
          $ref: '#/components/responses/ConfirmationHeld'
      x-codeSamples:
      - lang: cURL
        source: "curl -X POST 'https://api.growthbook.io/api/v1/fact-tables/abc123' \\\n  -H 'Authorization: Bearer YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"name\":\"New Fact Table Name\"}'"
    delete:
      operationId: deleteFactTable
      summary: Deletes a single fact table
      tags:
      - fact-tables
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Resource deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deletedId:
                    description: The ID of the deleted fact table
                    example: ftb_123abc
                    type: string
                required:
                - deletedId
                additionalProperties: false
        '202':
          $ref: '#/components/responses/ConfirmationHeld'
      x-codeSamples:
      - lang: cURL
        source: "curl -X DELETE 'https://api.growthbook.io/api/v1/fact-tables/abc123' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v1/fact-tables/{factTableId}/filters:
    get:
      operationId: listFactTableFilters
      summary: Get all filters for a fact table
      tags:
      - fact-tables
      parameters:
      - $ref: '#/components/parameters/factTableId'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    factTableFilters:
                      type: array
                      items:
                        $ref: '#/components/schemas/FactTableFilter'
                  required:
                  - factTableFilters
                  additionalProperties: false
                - $ref: '#/components/schemas/PaginationFields'
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v1/fact-tables/abc123/filters' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
    post:
      operationId: postFactTableFilter
      summary: Create a single fact table filter
      tags:
      - fact-tables
      parameters:
      - $ref: '#/components/parameters/factTableId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: Short display name. Put details in `description`.
                  type: string
                description:
                  description: Description of the fact table filter
                  type: string
                  maxLength: 10000
                value:
                  description: The SQL expression for this filter.
                  example: country = 'US'
                  type: string
                managedBy:
                  description: Set this to "api" to disable editing in the GrowthBook UI. Before you do this, the Fact Table itself must also be marked as "api"
                  type: string
                  enum:
                  - ''
                  - api
              required:
              - name
              - value
              additionalProperties: false
      responses:
        '200':
          description: Resource created
          content:
            application/json:
              schema:
                type: object
                properties:
                  factTableFilter:
                    $ref: '#/components/schemas/FactTableFilter'
                required:
                - factTableFilter
                additionalProperties: false
        '202':
          $ref: '#/components/responses/ConfirmationHeld'
      x-codeSamples:
      - lang: cURL
        source: "curl -X POST 'https://api.growthbook.io/api/v1/fact-tables/abc123/filters' \\\n  -H 'Authorization: Bearer YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"name\":\"High Value Order\",\"value\":\"amount>100\"}'"
  /v1/fact-tables/{factTableId}/filters/{id}:
    get:
      operationId: getFactTableFilter
      summary: Get a single fact filter
      tags:
      - fact-tables
      parameters:
      - $ref: '#/components/parameters/factTableId'
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  factTableFilter:
                    $ref: '#/components/schemas/FactTableFilter'
                required:
                - factTableFilter
                additionalProperties: false
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v1/fact-tables/abc123/filters/abc123' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
    post:
      operationId: updateFactTableFilter
      summary: Update a single fact table filter
      tags:
      - fact-tables
      parameters:
      - $ref: '#/components/parameters/factTableId'
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: Short display name. Put details in `description`.
                  type: string
                description:
                  description: Description of the fact table filter
                  type: string
                  maxLength: 10000
                value:
                  description: The SQL expression for this filter.
                  example: country = 'US'
                  type: string
                managedBy:
                  description: Set this to "api" to disable editing in the GrowthBook UI. Before you do this, the Fact Table itself must also be marked as "api"
                  type: string
                  enum:
                  - ''
                  - api
              additionalProperties: false
      responses:
        '200':
          description: Resource created
          content:
            application/json:
              schema:
                type: object
                properties:
                  factTableFilter:
                    $ref: '#/components/schemas/FactTableFilter'
                required:
                - factTableFilter
                additionalProperties: false
        '202':
          $ref: '#/components/responses/ConfirmationHeld'
      x-codeSamples:
      - lang: cURL
        source: "curl -X POST 'https://api.growthbook.io/api/v1/fact-tables/abc123/filters/abc123' \\\n  -H 'Authorization: Bearer YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"value\":\"amount > 50\"}'"
    delete:
      operationId: deleteFactTableFilter
      summary: Deletes a single fact table filter
      tags:
      - fact-tables
      parameters:
      - $ref: '#/components/parameters/factTableId'
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Resource deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deletedId:
                    description: The ID of the deleted fact filter
                    example: flt_123abc
                    type: string
                required:
                - deletedId
                additionalProperties: false
        '202':
          $ref: '#/components/responses/ConfirmationHeld'
      x-codeSamples:
      - lang: cURL
        source: "curl -X DELETE 'https://api.growthbook.io/api/v1/fact-tables/abc123/filters/abc123' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v1/fact-tables/{factTableId}/virtual-columns:
    post:
      operationId: postFactTableVirtualColumn
      summary: Create a virtual (computed) column on a fact table
      tags:
      - fact-tables
      parameters:
      - $ref: '#/components/parameters/factTableId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                column:
                  description: The column identifier used in generated SQL. Must contain only letters, numbers, and underscores and end with `_vc`.
                  example: revenue_vc
                  type: string
                name:
                  description: Display name for the column
                  type: string
                description:
                  description: Put context here, not in the name.
                  type: string
                  maxLength: 10000
                numberFormat:
                  type: string
                  enum:
                  - ''
                  - currency
                  - time:seconds
                  - time:milliseconds
                  - memory:bytes
                  - memory:kilobytes
                datatype:
                  description: The data type of the computed column
                  type: string
                  enum:
                  - number
                  - string
                  - date
                  - boolean
                  - json
                  - binary
                  - other
                sql:
                  description: The SQL expression that computes the column value
                  example: price * quantity
                  type: string
              required:
              - column
              - datatype
              - sql
              additionalProperties: false
      responses:
        '200':
          description: Resource created
          content:
            application/json:
              schema:
                type: object
                properties:
                  factTableColumn:
                    $ref: '#/components/schemas/FactTableColumn'
                required:
                - factTableColumn
                additionalProperties: false
        '202':
          $ref: '#/components/responses/ConfirmationHeld'
      x-codeSamples:
      - lang: cURL
        source: "curl -X POST 'https://api.growthbook.io/api/v1/fact-tables/abc123/virtual-columns' \\\n  -H 'Authorization: Bearer YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"column\":\"revenue_vc\",\"datatype\":\"number\",\"sql\":\"price * quantity\"}'"
  /v1/fact-tables/{factTableId}/virtual-columns/{id}:
    post:
      operationId: updateFactTableVirtualColumn
      summary: Update a virtual (computed) column on a fact table
      tags:
      - fact-tables
      parameters:
      - $ref: '#/components/parameters/factTableId'
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: Display name for the column
                  type: string
                description:
                  description: Put context here, not in the name.
                  type: string
                  maxLength: 10000
                numberFormat:
                  type: string
                  enum:
                  - ''
                  - currency
                  - time:seconds
                  - time:milliseconds
                  - memory:bytes
                  - memory:kilobytes
                datatype:
                  description: The data type of the computed column
                  type: string
                  enum:
                  - number
                  - string
                  - date
                  - boolean
                  - json
                  - binary
                  - other
                sql:
                  description: The SQL expression that computes the column value
                  type: string
              additionalProperties: false
      responses:
        '200':
          description: Resource created
          content:
            application/json:
              schema:
                type: object
                properties:
                  factTableColumn:
                    $ref: '#/components/schemas/FactTableColumn'
                required:
                - factTableColumn
                additionalProperties: false
        '202':
          $ref: '#/components/responses/ConfirmationHeld'
      x-codeSamples:
      - lang: cURL
        source: "curl -X POST 'https://api.growthbook.io/api/v1/fact-tables/abc123/virtual-columns/revenue_vc' \\\n  -H 'Authorization: Bearer YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"sql\":\"price * quantity * 1.1\"}'"
    delete:
      operationId: deleteFactTableVirtualColumn
      summary: Delete a virtual (computed) column from a fact table
      tags:
      - fact-tables
      parameters:
      - $ref: '#/components/parameters/factTableId'
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Resource deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deletedId:
                    description: The id of the deleted virtual column
                    example: revenue_vc
                    type: string
                required:
                - deletedId
                additionalProperties: false
        '202':
          $ref: '#/components/responses/ConfirmationHeld'
      x-codeSamples:
      - lang: cURL
        source: "curl -X DELETE 'https://api.growthbook.io/api/v1/fact-tables/abc123/virtual-columns/revenue_vc' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v1/fact-tables/{id}/aggregated-tables:
    get:
      operationId: getAggregatedFactTables
      summary: Get the materialization status of a fact table's shared daily aggregated tables
      tags:
      - fact-tables
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  aggregatedFactTables:
                    type: array
                    items:
                      $ref: '#/components/schemas/AggregatedFactTable'
                  nextScheduledUpdate:
                    description: When the next scheduled nightly refresh will run, or null if no schedule is configured
                    anyOf:
                    - format: date-time
                      type: string
                    - type: 'null'
                required:
                - aggregatedFactTables
                - nextScheduledUpdate
                additionalProperties: false
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v1/fact-tables/abc123/aggregated-tables' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v1/fact-tables/{id}/aggregated-tables/refresh:
    post:
      operationId: refreshAggregatedFactTable
      summary: Force a refresh or full restate of a fact table's shared daily aggregated tables
      tags:
      - fact-tables
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idType:
                  description: Limit the refresh to a single id type. If omitted, all of the fact table's aggregatedFactTableSettings.idTypes are refreshed.
                  type: string
                fullRestate:
                  description: Drop and recreate the table, re-scanning the retained window. This is significantly more expensive than the default incremental append (it scans ~2-3 months of history).
                  type: boolean
              additionalProperties: false
      responses:
        '200':
          description: Resource created
