          type: boolean
        autoSlices:
          description: Specific slices to automatically analyze for this column.
          type: array
          items:
            type: string
        lockedAutoSlices:
          description: Locked slices that are protected from automatic updates. These will always be included in the slice levels even if they're not in the top values query results.
          type: array
          items:
            type: string
        isVirtual:
          default: false
          description: Whether this is a virtual (computed) column defined by a SQL expression rather than detected from the fact table SQL. Can be set when creating a column, but a column's origin cannot be changed afterwards — sending a value that contradicts an existing column is rejected.
          type: boolean
        sql:
          description: For virtual columns, the SQL expression that computes the column value. Only valid on a virtual column; when omitted from an update, the existing expression is preserved.
          type: string
        topValues:
