components:
  parameters:
    offset:
      name: offset
      in: query
      description: How many items to skip (use in conjunction with limit for pagination)
      schema:
        default: 0
        description: How many items to skip (use in conjunction with limit for pagination)
        type: integer
        minimum: 0
    id:
      name: id
      in: path
      required: true
      description: The id of the requested resource
      schema:
        description: The id of the requested resource
        type: string
    factTableId:
      name: factTableId
      in: path
      required: true
      description: Specify a specific fact table
      schema:
        description: Specify a specific fact table
        type: string
    datasourceId:
      name: datasourceId
      in: query
      description: Filter by Data Source
      schema:
        description: Filter by Data Source
        type: string
    projectId:
      name: projectId
      in: query
      description: Filter by project id
      schema:
        description: Filter by project id
        type: string
    idType:
      name: idType
      in: query
      description: Only return runs for this id type. When omitted, runs for all id types are returned.
      schema:
        description: Only return runs for this id type. When omitted, runs for all id types are returned.
        type: string
    limit:
      name: limit
      in: query
      description: The number of items to return
      schema:
        default: 10
        description: The number of items to return
        type: integer
        minimum: 1
        maximum: 100
    runId:
      name: runId
      in: path
      required: true
      description: The id of the aggregated table run (e.g. aftr_...)
      schema:
        description: The id of the aggregated table run (e.g. aftr_...)
        type: string
  schemas:
    AggregatedTableRefreshTrigger:
      type: object
      properties:
        idType:
          description: The id type this refresh targets
          type: string
        runId:
          description: The id of the run, set when status is started or failed and null when skipped.
          anyOf:
          - type: string
          - type: 'null'
        status:
          description: Whether a refresh was started, failed to be created, or was skipped
          type: string
          enum:
          - started
          - failed
          - skipped
        reason:
          description: Why the refresh was skipped, when status is skipped.
          anyOf:
          - type: string
            enum:
            - already-in-progress
            - datasource-not-found
            - pipeline-not-configured
            - unsupported-datasource
            - no-eligible-metrics
          - type: 'null'
        error:
          description: The error message when status is failed; null otherwise.
          anyOf:
          - type: string
          - type: 'null'
      required:
      - idType
      - runId
      - status
      - reason
      - error
      additionalProperties: false
    PaginationFields:
      type: object
      properties:
        limit:
          type: integer
        offset:
          type: integer
        count:
          type: integer
        total:
          type: integer
        hasMore:
          type: boolean
        nextOffset:
          anyOf:
          - type: integer
          - type: 'null'
      required:
      - limit
      - offset
      - count
      - total
      - hasMore
      - nextOffset
      additionalProperties: false
    AggregatedFactTable:
      type: object
      properties:
        idType:
          description: The id type this aggregated table is keyed by
          type: string
        status:
          description: 'Materialization status: `pending` (not yet built), `running` (a refresh is in progress), `active` (materialized and queryable), or `error` (the last run failed).'
          type: string
          enum:
          - running
          - error
          - pending
          - active
        tableFullName:
          description: Fully-qualified warehouse table name, or null if it has not been created yet
          anyOf:
          - type: string
          - type: 'null'
        firstEventDate:
          description: Earliest event date covered by the materialized data
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
        lastEventDate:
          description: Latest event date covered by the materialized data
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
        lastMaxTimestamp:
          description: Event-time high-water mark; the next incremental refresh appends events after this timestamp
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
        lastError:
          description: Error message from the last failed run, if any
          anyOf:
          - type: string
          - type: 'null'
        dateUpdated:
          description: When the aggregation metadata was last updated
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
        pendingRestate:
          description: Whether the next run will be forced to drop and rebuild the table instead of appending incrementally
          type: boolean
        pendingRestateReason:
          description: Why a restate is pending, if `pendingRestate` is true
          anyOf:
          - type: string
            enum:
            - incomplete-write
            - schema-drift
          - type: 'null'
      required:
      - idType
      - status
      - tableFullName
      - firstEventDate
      - lastEventDate
      - lastMaxTimestamp
      - lastError
      - dateUpdated
      - pendingRestate
      - pendingRestateReason
      additionalProperties: false
    FactTableColumn:
      type: object
      properties:
        column:
          description: The actual column name in the database/SQL query
          type: string
        datatype:
          description: The column's data type (can be an override of the warehouse-reported datatype, for JSON string columns for example).
          type: string
          enum:
          - number
          - string
          - date
          - boolean
          - json
          - binary
          - other
          - ''
        dataTypeFromWarehouse:
          readOnly: true
          description: The warehouse-reported datatype.
          type: string
          enum:
          - number
          - string
          - date
          - boolean
          - json
          - binary
          - other
          - ''
        numberFormat:
          type: string
          enum:
          - ''
          - currency
          - time:seconds
          - time:milliseconds
          - memory:bytes
          - memory:kilobytes
        jsonFields:
          description: For JSON columns, defines the structure of nested fields
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: object
            properties:
              datatype:
                type: string
                enum:
                - number
                - string
                - date
                - boolean
                - json
                - binary
                - other
                - ''
            additionalProperties: false
        name:
          description: Display name for the column (can be different from the actual column name)
          type: string
        description:
          description: What the column contains.
          type: string
          maxLength: 10000
        alwaysInlineFilter:
          default: false
          description: Whether this column should always be included as an inline filter in queries
          type: boolean
        conditionalInlineFilters:
          description: 'Value -> additional column to prompt for when a metric filters this column to that value, e.g. {"Page View": "path", "Modal Open": "properties.modalType"}. Requires alwaysInlineFilter.'
          type: object
