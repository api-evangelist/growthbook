  /v1/bulk-import/facts:
    post:
      operationId: postBulkImportFacts
      summary: Bulk import fact tables, filters, and metrics
      description: 'Creates or updates Fact Tables, Fact Table filters, and Fact Metrics. Resources upsert by `id`. Pass `dryRun: true` to validate with zero writes. Not transactional: a live mid-loop failure returns HTTP 400 (403 for a permission failure) with write counts and `errors`.'
      tags:
      - fact-tables
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                defaultManagedBy:
                  description: Fallback `managedBy` for Fact Tables and Fact Metrics that omit the field. Defaults to `"api"`. Filters inherit `"api"` only when the parent Fact Table is api-managed.
                  type: string
                  enum:
                  - ''
                  - api
                  - admin
                dryRun:
                  description: Validate with zero writes.
                  type: boolean
                factTables:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      data:
                        type: object
                        properties:
                          name:
                            description: Short display name. Put details in `description`.
                            type: string
                          description:
                            description: Markdown. Put context here, not in the name.
                            type: string
                            maxLength: 10000
                          owner:
                            description: The userId or email address of the owner. If an email address is provided, it will be used to look up the userId of the matching organization member. If an ID is provided, it will be validated as existing in the organization.
                            type: string
                          projects:
                            description: List of associated project ids
                            type: array
                            items:
                              type: string
                          tags:
                            description: List of associated tags
                            type: array
                            items:
                              type: string
                          datasource:
                            description: The datasource id
                            type: string
                          userIdTypes:
                            description: List of identifier columns in this table. For example, "id" or "anonymous_id"
                            type: array
                            items:
                              type: string
                          userIdColumns:
                            description: 'Maps an identifier type to the column holding it, for SQL that does not alias its columns to the identifier type names, e.g. `{"user_id": "userId"}`. May also be a single-level field path into a JSON column (`properties.userId`). Unmapped types use the identifier type name as the column name.'
                            type: object
                            propertyNames:
                              type: string
                            additionalProperties:
                              type: string
                          aggregatedFactTableSettings:
                            description: Settings for maintaining shared daily aggregated tables (a subset of userIdTypes plus the daily update time and restate lookback window) used to speed up CUPED. Requires the data pipeline (pipeline-mode) feature.
                            type: object
                            properties:
                              idTypes:
                                type: array
                                items:
                                  type: string
                              updateTime:
                                type: object
                                properties:
                                  time:
                                    type: string
                                  timezone:
                                    type: string
                                required:
                                - time
                                - timezone
                                additionalProperties: false
                              lookbackWindow:
                                type: integer
                                exclusiveMinimum: 0
                              restateChunkDays:
                                type: integer
                                minimum: 1
                                maximum: 7
                            required:
                            - idTypes
                            - updateTime
                            - lookbackWindow
                            additionalProperties: false
                          sql:
                            description: The SQL query for this fact table
                            type: string
                          timestampColumn:
                            description: The column holding the event timestamp. Must be a date column on this fact table. Defaults to "timestamp" when unset.
                            type: string
                          eventName:
                            description: The event name used in SQL template variables
                            type: string
                          columns:
                            description: 'Optional array of column definitions for this fact table. On create, columns are stored as-is. On update, columns upsert by `column`: existing columns are patched, new columns are created, and columns not included are left unchanged. Omit `datatype` to leave an existing column''s type untouched; send "" to reset it for auto-detection; new columns are auto-detected when `datatype` is omitted or "". Datatype-dependent properties (e.g. `alwaysInlineFilter`) are validated once the datatype is known. Slice-related properties require an enterprise license.'
                            type: array
                            items:
                              $ref: '#/components/schemas/FactTableColumnInput'
                          managedBy:
                            description: Set this to "api" to disable editing in the GrowthBook UI
                            type: string
                            enum:
                            - ''
                            - api
                            - admin
                        required:
                        - name
                        - datasource
                        - userIdTypes
                        - sql
                        additionalProperties: false
                    required:
                    - id
                    - data
                    additionalProperties: false
                factTableFilters:
                  type: array
                  items:
                    type: object
                    properties:
                      factTableId:
                        type: string
                      id:
                        type: string
                      data:
                        type: object
                        properties:
                          name:
                            description: Short display name. Put details in `description`.
                            type: string
                          description:
                            description: Description of the fact table filter
                            type: string
                            maxLength: 10000
                          value:
                            description: The SQL expression for this filter.
                            example: country = 'US'
                            type: string
                          managedBy:
                            description: Set this to "api" to disable editing in the GrowthBook UI. Before you do this, the Fact Table itself must also be marked as "api"
                            type: string
                            enum:
                            - ''
                            - api
                        required:
                        - name
                        - value
                        additionalProperties: false
                    required:
                    - factTableId
                    - id
                    - data
                    additionalProperties: false
                factMetrics:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      data:
                        type: object
                        properties:
                          name:
                            description: Short display name (e.g. `Purchases per user`). Put the definition in `description`.
                            type: string
                          description:
                            description: Markdown. Put context here, not in the name.
                            type: string
                            maxLength: 10000
                          owner:
                            description: The userId or email address of the owner. If an email address is provided, it will be used to look up the userId of the matching organization member. If an ID is provided, it will be validated as existing in the organization.
                            type: string
                          projects:
                            type: array
                            items:
                              type: string
                          tags:
                            description: Tags for filtering and grouping. Use these instead of encoding groups in names.
                            type: array
                            items:
                              type: string
                          metricType:
                            type: string
                            enum:
                            - proportion
                            - retention
                            - mean
                            - quantile
                            - ratio
                            - dailyParticipation
                            - funnel
                          numerator:
                            anyOf:
                            - type: object
                              properties:
                                factTableId:
                                  type: string
                                column:
                                  description: 'Must be empty for proportion metrics and dailyParticipation metrics. Otherwise, the column name or one of the special values: ''$$distinctUsers'' or ''$$count'' (or ''$$distinctDates'' if metricType is ''mean'' or ''ratio'' or ''quantile'' and quantileSettings.type is ''unit'')'
                                  type: string
                                aggregation:
                                  description: 'User aggregation of selected column. Either sum or max for numeric columns; count distinct for string columns; hll merge / kll merge for pre-built sketch columns (requires data-source support); ignored for special columns. Default: sum. If you specify a string column you must explicitly specify count distinct. Not used for proportion metrics; for event quantile metrics only kll merge is applicable.'
                                  type: string
                                  enum:
                                  - sum
                                  - max
                                  - count distinct
                                  - hll merge
                                  - kll merge
                                filters:
                                  deprecated: true
                                  description: Array of Fact Table Filter Ids. Deprecated, use rowFilters instead.
                                  type: array
                                  items:
                                    type: string
                                inlineFilters:
                                  deprecated: true
                                  description: Inline filters to apply to the fact table. Keys are column names, values are arrays of values to filter by. Deprecated, use rowFilters instead.
                                  type: object
                                  propertyNames:
                                    type: string
                                  additionalProperties:
                                    type: array
                                    items:
                                      type: string
                                rowFilters:
                                  description: Filters to apply to the rows of the fact table before aggregation.
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      operator:
                                        type: string
                                        enum:
                                        - '='
                                        - '!='
                                        - '>'
                                        - <
                                        - '>='
                                        - <=
                                        - between
                                        - not_between
                                        - in
                                        - not_in
                                        - is_null
                                        - not_null
                                        - is_true
                                        - is_false
                                        - contains
                                        - not_contains
                                        - matches_pattern
                                        - not_matches_pattern
                                        - starts_with
                                        - ends_with
                                        - sql_expr
                                        - saved_filter
                                      values:
                                        description: Not required for is_null, not_null, is_true, is_false operators. The between and not_between operators take at most two values, a lower and an upper bound in that order; leave a bound as an empty string for an open-ended range.
                                        type: array
                                        items:
                                          type: string
                                      column:
                                        description: Required for all operators except sql_expr and saved_filter.
                                        type: string
                                    required:
                                    - operator
                                    additionalProperties: false
                                aggregateFilterColumn:
                                  description: Column to use to filter users after aggregation. Either '$$count' of rows or the name of a numeric column that will be summed by user. Must specify `aggregateFilter` if using this. Only can be used with 'retention' and 'proportion' metrics.
                                  type: string
                                aggregateFilter:
                                  description: Simple comparison operator and value to apply after aggregation (e.g. '= 10' or '>= 1'). Requires `aggregateFilterColumn`.
                                  type: string
                              required:
                              - factTableId
                              additionalProperties: false
                            - type: 'null'
                          denominator:
                            description: Only when metricType is 'ratio'
                            type: object
                            properties:
                              factTableId:
                                type: string
                              column:
                                description: 'The column name or one of the special values: ''$$distinctUsers'' or ''$$count'' (or ''$$distinctDates'' if metricType is ''mean'' or ''ratio'' or ''quantile'' and quantileSettings.type is ''unit'')'
                                type: string
                              aggregation:
                                description: 'User aggregation of selected column. Either sum or max for numeric columns; count distinct for string columns; hll merge / kll merge for pre-built sketch columns (requires data-source support); ignored for special columns. Default: sum. If you specify a string column you must explicitly specify count distinct. Not used for proportion metrics; for event quantile metrics only kll merge is applicable.'
                                type: string
                                enum:
                                - sum
                                - max
                                - count distinct
                                - hll merge
                                - kll merge
                              filters:
                                deprecated: true
                                description: Array of Fact Table Filter Ids. Deprecated, use rowFilters instead.
                                type: array
                                items:
                                  type: string
                              inlineFilters:
                                deprecated: true
                                description: Inline filters to apply to the fact table. Keys are column names, values are arrays of values to filter by. Deprecated, use rowFilters instead.
                                type: object
                                propertyNames:
                                  type: string
                                additionalProperties:
                                  type: array
                                  items:
                                    type: string
                              rowFilters:
                                description: Filters to apply to the rows of the fact table before aggregation.
                                type: array
                                items:
                                  type: object
                                  properties:
                                    operator:
                                      type: string
                                      enum:
                                      - '='
                                      - '!='
                                      - '>'
                                      - <
                                      - '>='
                                      - <=
                                      - between
                                      - not_between
                                      - in
                                      - not_in
                                      - is_null
                                      - not_null
                                      - is_true
                                      - is_false
                                      - contains
