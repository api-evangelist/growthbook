    FactTable:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          maxLength: 10000
        owner:
          description: The userId of the owner (or raw owner name/email for legacy records)
          type: string
        ownerEmail:
          description: The email address of the owner, when the owner can be resolved to a known user.
          type: string
        projects:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        datasource:
          type: string
        userIdTypes:
          type: array
          items:
            type: string
        userIdColumns:
          description: 'Maps an identifier type to the column holding it, for SQL that does not alias its columns to the identifier type names, e.g. `{"user_id": "userId"}`. May also be a single-level field path into a JSON column (`properties.userId`). Unmapped types use the identifier type name as the column name.'
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
        aggregatedFactTableSettings:
          description: Settings for maintaining shared daily aggregated tables (a subset of userIdTypes plus the daily update time and restate lookback window) used to speed up CUPED. Requires the data pipeline (pipeline-mode) feature.
          type: object
          properties:
            idTypes:
              type: array
              items:
                type: string
            updateTime:
              type: object
              properties:
                time:
                  type: string
                timezone:
                  type: string
              required:
              - time
              - timezone
              additionalProperties: false
            lookbackWindow:
              type: integer
              exclusiveMinimum: 0
            restateChunkDays:
              type: integer
              minimum: 1
              maximum: 7
          required:
          - idTypes
          - updateTime
          - lookbackWindow
          additionalProperties: false
        sql:
          type: string
        timestampColumn:
          description: The column holding the event timestamp. Must be a date column on this fact table. Defaults to "timestamp" when unset.
          type: string
        eventName:
          description: The event name used in SQL template variables
          type: string
        columns:
          description: Array of column definitions for this fact table
          type: array
          items:
            $ref: '#/components/schemas/FactTableColumn'
        columnsError:
          readOnly: true
          description: Error message if there was an issue parsing the SQL schema
          anyOf:
          - type: string
          - type: 'null'
        columnRefreshPending:
          description: True while the fact table's column schema is being detected in the background. While true, `columns` may be empty or incomplete and metrics referencing not-yet-detected columns cannot be created.
          type: boolean
        archived:
          type: boolean
        autoSliceUpdatesEnabled:
          description: Whether Auto Slice values for this fact table's columns are refreshed automatically in the background.
          type: boolean
        managedBy:
          description: Where this fact table must be managed from. If not set (empty string), it can be managed from anywhere.
          type: string
          enum:
          - ''
          - api
          - admin
        dateCreated:
          format: date-time
          type: string
        dateUpdated:
          format: date-time
          type: string
      required:
      - id
      - name
      - description
      - owner
