openapi: 3.2.0
info:
  version: 5.1.0
  title: GrowthBook REST Custom Hooks API
  description: 'GrowthBook offers a full REST API for interacting with the application. Request data can use either JSON or Form data encoding (with proper `Content-Type` headers). All response bodies are JSON-encoded. The API base URL for GrowthBook Cloud is `https://api.growthbook.io/api`. For self-hosted deployments, it is the same as your API_HOST environment variable (defaults to `http://localhost:3100/api`). The rest of these docs will assume you are using GrowthBook Cloud. ## Versioning


    Endpoints are versioned by path prefix:


    - `/v1/...` — stable, widely-supported endpoints

    - `/v2/...` — updated endpoints with improved shapes (e.g. unified per-rule environment scope for feature flags)


    New integrations should prefer v2 where available. Feature-flag and metric v1 routes are deprecated: they are tagged **LEGACY** in the sidebar and collapsed by default. Use the matching v2 group when both exist. ## Authentication


    We support both the HTTP Basic and Bearer authentication schemes for convenience. You first need to generate a new API Key in GrowthBook. Different keys have different permissions:


    - **Personal Access Tokens**: These are sensitive and provide the same level of access as the user has to an organization, or less if the token''s permissions are limited. These can be created by going to `Personal Access Tokens` under your user menu. Members with the API Keys **Manage members'' tokens** permission can disable a member''s token under `Settings -> Manage PATs`, and admins can require new tokens to expire within a maximum lifetime. - **Secret Keys**: These are sensitive and provide the level of access of the role they are given, which can be any built-in or custom role, with optional per-project role overrides and environment limits. Managing Secret Keys on behalf of an organization takes the API Keys permissions. These can be created by going to `Settings -> API Keys`, where Admins can also require new Secret Keys to expire within a maximum lifetime. If using HTTP Basic auth, pass the Secret Key as the username and leave the password blank (when using curl, add `:` at the end of the secret to indicate an empty password)


    ```bash

    curl https://api.growthbook.io/api/v1/features \

    -u secret_abc123DEF456:

    ```


    If using Bearer auth, pass the Secret Key as the token:


    ```bash

    curl https://api.growthbook.io/api/v1/features \

    -H "Authorization: Bearer secret_abc123DEF456"

    ```


    If a key has an expiration date, every response includes it in the `X-GrowthBook-Key-Expires-At` header (ISO 8601), so scripts can warn before the key stops working. Requests made with an expired key fail with a `401` that says where to create a replacement. See Expiration for choosing a key''s expiration, the warnings before it lapses, and the organization policies. ## Naming who asked


    Requests made with a Secret Key may add an `X-GrowthBook-Requested-By` header naming the organization member who asked for the change, as a user id or an email address. History, revision logs and webhooks show that member next to the key. Each key''s settings under `Settings -> API Keys`:


    - **Header**: **Optional** (the default) uses the header when it''s sent, **Required** rejects requests without it, and **Rejected** rejects requests that send it, each with a 400. - **Permissions**, when a member is named:

    - **Assume member''s role** (the default): the request acts as that member, with only what both the key and the member can do, so the header can narrow a key but never widen it. Drafts, owners, `mine` filters and reviews are the member''s. The member''s rights over their own drafts, comments and verdicts apply only where the key''s own role allows the same action. - **Use key''s role**: the key acts as itself, with its own permissions, and the name is only recorded in history. Drafts, verdicts and ownership are the key''s, as when no member is named.'
servers:
- url: https://api.growthbook.io/api
  description: GrowthBook Cloud
- url: https://{domain}/api
  description: Self-hosted GrowthBook
  variables:
    domain:
      default: localhost:3100
      description: Your self-hosted GrowthBook host (and port)
security:
- bearerAuth: []
- basicAuth: []
tags:
- name: custom-hooks
  x-displayName: Custom Hooks
  description: Sandboxed JavaScript validation hooks that run when features, configs, or their revisions are saved or published. Throwing an Error blocks the save; `addWarning(msg)` raises a soft warning. Hooks are scoped by projects, or pinned to a single feature/config via `entityType`/`entityId`; a config-scoped hook also runs for every config inheriting from it (its whole descendant lineage). Scope can be retargeted on update (or cleared with nulls). Requires an enterprise plan; not available on GrowthBook Cloud.
paths:
  /v1/custom-hooks:
    get:
      operationId: listCustomHooks
      summary: Get all custom hooks
      tags:
      - custom-hooks
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    customHooks:
                      type: array
                      items:
                        $ref: '#/components/schemas/CustomHook'
                  required:
                  - customHooks
                  additionalProperties: false
                - $ref: '#/components/schemas/PaginationFields'
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v1/custom-hooks' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
    post:
      operationId: postCustomHook
      summary: Create a single custom hook
      tags:
      - custom-hooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: The display name of the custom hook
                  type: string
                hook:
                  type: string
                  enum:
                  - validateFeature
                  - validateFeatureRevision
                  - validateConfig
                  - validateConfigRevision
                  - validateExperiment
                code:
                  type: string
                enabled:
                  default: true
                  type: boolean
                projects:
                  description: Project ids the hook applies to (empty/omitted = all)
                  type: array
                  items:
                    type: string
                entityType:
                  type: string
                  enum:
                  - feature
                  - config
                  - experiment
                entityId:
                  type: string
                incrementalChangesOnly:
                  type: boolean
              required:
              - name
              - hook
              - code
              additionalProperties: false
      responses:
        '200':
          description: Resource created
          content:
            application/json:
              schema:
                type: object
                properties:
                  customHook:
                    $ref: '#/components/schemas/CustomHook'
                required:
                - customHook
                additionalProperties: false
        '202':
          $ref: '#/components/responses/ConfirmationHeld'
      x-codeSamples:
      - lang: cURL
        source: "curl -X POST 'https://api.growthbook.io/api/v1/custom-hooks' \\\n  -H 'Authorization: Bearer YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"name\":\"Require a description\",\"hook\":\"validateFeature\",\"code\":\"if (!feature.description) {\\n  throw new Error(\\\"Feature must have a description\\\");\\n}\"}'"
  /v1/custom-hooks/test:
    post:
      operationId: testCustomHook
      summary: Dry-run hook code in the sandbox
      tags:
      - custom-hooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                functionBody:
                  description: JavaScript function body to execute in the sandbox
                  type: string
                functionArgs:
                  description: Arguments exposed to the function as named globals (e.g. `feature`, `config`, `revision`)
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties: {}
                originalFunctionArgs:
                  description: State before the change. When supplied, the hook also runs against it and Incremental Changes Only suppression is applied to the result.
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties: {}
                entityType:
                  type: string
                  enum:
                  - feature
                  - config
                  - experiment
                entityId:
                  type: string
              required:
              - functionBody
              additionalProperties: false
      responses:
        '200':
          description: Resource created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  returnVal:
                    description: JSON-stringified return value, when the hook returned one
                    type: string
                  error:
                    type: string
                  warnings:
                    type: array
                    items:
                      type: string
                  log:
                    description: Captured console output
                    type: string
                  suppressed:
                    $ref: '#/components/schemas/suppressed'
                required:
                - success
                additionalProperties: false
      x-codeSamples:
      - lang: cURL
        source: "curl -X POST 'https://api.growthbook.io/api/v1/custom-hooks/test' \\\n  -H 'Authorization: Bearer YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"functionBody\":\"if (!feature.description) throw new Error(\\\"No description\\\");\",\"functionArgs\":{\"feature\":{\"id\":\"my-feature\",\"description\":\"\"}}}'"
  /v1/custom-hooks/{id}:
    get:
      operationId: getCustomHook
      summary: Get a single custom hook
      tags:
      - custom-hooks
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the custom hook
        schema:
          description: The id of the custom hook
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  customHook:
                    $ref: '#/components/schemas/CustomHook'
                required:
                - customHook
                additionalProperties: false
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v1/custom-hooks/hook_123abc' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
    post:
      operationId: updateCustomHook
      summary: Partially update a single custom hook
      tags:
      - custom-hooks
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the custom hook
        schema:
          description: The id of the custom hook
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                hook:
                  type: string
                  enum:
                  - validateFeature
                  - validateFeatureRevision
                  - validateConfig
                  - validateConfigRevision
                  - validateExperiment
                code:
                  type: string
                enabled:
                  type: boolean
                projects:
                  type: array
                  items:
                    type: string
                entityType:
                  description: 'Retarget the hook''s scope (set with entityId). Pass null (with entityId: null) to make the hook global/project-scoped; omit to leave unchanged.'
                  anyOf:
                  - type: string
                    enum:
                    - feature
                    - config
                    - experiment
                  - type: 'null'
                entityId:
                  description: 'The scoped resource: a feature id, or a config key. Pass null (with entityType: null) to clear the scope; omit to leave unchanged.'
                  anyOf:
                  - type: string
                  - type: 'null'
                incrementalChangesOnly:
                  type: boolean
              additionalProperties: false
      responses:
        '200':
          description: Resource created
          content:
            application/json:
              schema:
                type: object
                properties:
                  customHook:
                    $ref: '#/components/schemas/CustomHook'
                required:
                - customHook
                additionalProperties: false
        '202':
          $ref: '#/components/responses/ConfirmationHeld'
      x-codeSamples:
      - lang: cURL
        source: "curl -X POST 'https://api.growthbook.io/api/v1/custom-hooks/hook_123abc' \\\n  -H 'Authorization: Bearer YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"enabled\":false}'"
    delete:
      operationId: deleteCustomHook
      summary: Delete a single custom hook
      tags:
      - custom-hooks
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the custom hook
        schema:
          description: The id of the custom hook
          type: string
      responses:
        '200':
          description: Resource deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deletedId:
                    type: string
                required:
                - deletedId
                additionalProperties: false
        '202':
          $ref: '#/components/responses/ConfirmationHeld'
      x-codeSamples:
      - lang: cURL
        source: "curl -X DELETE 'https://api.growthbook.io/api/v1/custom-hooks/hook_123abc' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v1/custom-hooks/{id}/history:
    get:
      operationId: listCustomHookHistory
      summary: List a custom hook's version history
      tags:
      - custom-hooks
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the custom hook
        schema:
          description: The id of the custom hook
          type: string
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    versions:
                      type: array
                      items:
                        $ref: '#/components/schemas/versions'
                  required:
                  - versions
                  additionalProperties: false
                - $ref: '#/components/schemas/PaginationFields'
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET 'https://api.growthbook.io/api/v1/custom-hooks/hook_123abc/history' \\\n  -H 'Authorization: Bearer YOUR_API_KEY'"
  /v1/custom-hooks/{id}/revert:
    post:
      operationId: revertCustomHook
      summary: Revert a custom hook to a previous version
      tags:
      - custom-hooks
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the custom hook
        schema:
          description: The id of the custom hook
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                auditId:
                  description: The version to restore (from the history endpoint)
                  type: string
              required:
              - auditId
              additionalProperties: false
      responses:
        '200':
          description: Resource created
          content:
            application/json:
              schema:
                type: object
                properties:
                  customHook:
                    $ref: '#/components/schemas/CustomHook'
                required:
                - customHook
                additionalProperties: false
        '202':
          $ref: '#/components/responses/ConfirmationHeld'
      x-codeSamples:
      - lang: cURL
        source: "curl -X POST 'https://api.growthbook.io/api/v1/custom-hooks/hook_123abc/revert' \\\n  -H 'Authorization: Bearer YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"auditId\":\"aud_123abc\"}'"
components:
  schemas:
    PaginationFields:
      type: object
      properties:
        limit:
          type: integer
        offset:
          type: integer
        count:
          type: integer
        total:
          type: integer
        hasMore:
          type: boolean
        nextOffset:
          anyOf:
          - type: integer
          - type: 'null'
      required:
      - limit
      - offset
      - count
      - total
      - hasMore
      - nextOffset
      additionalProperties: false
    suppressed:
      description: Outcomes the previous state produced too, which Incremental Changes Only would hide on a real save
      type: object
      properties:
        error:
          type: string
        warnings:
          type: array
          items:
            type: string
      additionalProperties: false
    versions:
      type: object
      properties:
        auditId:
          description: Identifier for this version, used to revert to it
          type: string
        event:
          description: The audit event that produced this version (create/update)
          type: string
        dateCreated:
          format: date-time
          type: string
        userName:
          type: string
        userEmail:
          type: string
        customHook:
          description: The hook's full state at this version
          $ref: '#/components/schemas/CustomHook'
      required:
      - auditId
      - event
      - dateCreated
      - customHook
      additionalProperties: false
    Confirmation:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum:
          - pending
          - running
          - completed
          - rejected
          - expired
        actions:
          type: array
          items:
            type: object
            properties:
              action:
                type: string
                enum:
                - feature.create
                - feature.draft
                - feature.review
                - feature.publish
                - feature.archive
                - feature.delete
                - feature.other
                - experiment.create
                - experiment.draft
                - experiment.start
                - experiment.stop
                - experiment.targeting
                - experiment.traffic
                - experiment.phases
                - experiment.visualEditor
                - experiment.other
                - savedGroup.create
                - savedGroup.draft
                - savedGroup.review
                - savedGroup.publish
                - savedGroup.archive
                - savedGroup.delete
                - savedGroup.other
                - constant.create
                - constant.draft
                - constant.review
                - constant.publish
                - constant.archive
                - constant.delete
                - constant.other
                - config.create
                - config.draft
                - config.review
                - config.publish
                - config.archive
                - config.delete
                - config.other
                - rampSchedule.create
                - rampSchedule.start
                - rampSchedule.pause
                - rampSchedule.progression
                - rampSchedule.approve
                - rampSchedule.edit
                - rampSchedule.delete
                - rampSchedule.other
                - settings.approvals
                - settings.other
                - access.members
                - access.teams
                - customHook.create
                - customHook.edit
                - customHook.delete
                - environment.create
                - environment.edit
                - environment.delete
                - project.create
                - project.edit
                - project.delete
                - attribute.create
                - attribute.edit
                - attribute.delete
                - customField.create
                - customField.edit
                - customField.delete
                - sdkConnection.create
                - sdkConnection.edit
                - sdkConnection.delete
                - metric.create
                - metric.edit
                - metric.delete
                - factTable.create
                - factTable.edit
                - factTable.delete
                - segment.create
                - segment.edit
                - segment.delete
                - dimension.create
                - dimension.edit
                - dimension.delete
                - override.ignoreWarnings
                - override.skipSchemaValidation
                - override.skipHooks
                - override.bypassApproval
                - override.restBypassesReviews
                - override.draftLimit
                - override.skipChecklist
                - override.bypassDuplicateKeyCheck
                - other.write
              environments:
                type: array
                items:
                  type: string
            required:
            - action
            - environments
            additionalProperties: false
        summary:
          type: string
        url:
          type: string
        expiresAt:
          type: string
        response:
          anyOf:
          - type: object
            properties:
              status:
                type: number
              body: {}
            required:
            - status
            - body
            additionalProperties: false
          - type: 'null'
        note:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - id
      - status
      - actions
      - summary
      - url
      - expiresAt
      - response
      - note
      additionalProperties: false
    CustomHook:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        hook:
          description: Which save/publish event runs the hook (and which entity type it validates)
          type: string
          enum:
          - validateFeature
          - validateFeatureRevision
          - validateConfig
          - validateConfigRevision
          - validateExperiment
        code:
          description: JavaScript function body executed in the sandbox. Throw an Error to block the save; call `addWarning(msg)` for a soft warning.
          type: string
        enabled:
          type: boolean
        projects:
          description: Project ids the hook applies to (empty = all projects). Always empty for entity-scoped hooks.
          type: array
          items:
            type: string
        entityType:
          description: Set (with entityId) to scope the hook to a single resource.
          type: string
          enum:
          - feature
          - config
          - experiment
        entityId:
          description: 'The scoped resource: a feature id, or a config key. A config-scoped hook always runs for that config and every config that inherits from it (via parent/extends, transitively).'
          type: string
        incrementalChangesOnly:
          description: When true, errors/warnings that already existed before the change being validated are suppressed
          type: boolean
        lastSuccess:
          format: date-time
          type: string
        lastFailure:
          format: date-time
          type: string
        dateCreated:
          format: date-time
          type: string
        dateUpdated:
          format: date-time
          type: string
      required:
      - id
      - name
      - hook
      - code
      - enabled
      - projects
      - dateCreated
      - dateUpdated
      additionalProperties: false
    ConfirmationHeld:
      type: object
      properties:
        confirmation:
          $ref: '#/components/schemas/Confirmation'
        message:
          type: string
      required:
      - confirmation
      - message
      additionalProperties: false
      $defs:
        Confirmation:
          id: Confirmation
          type: object
          properties:
            id:
              type: string
            status:
              type: string
              enum:
              - pending
              - running
              - completed
              - rejected
              - expired
            actions:
              type: array
              items:
                type: object
                properties:
                  action:
                    type: string
                    enum:
                    - feature.create
                    - feature.draft
                    - feature.review
                    - feature.publish
                    - feature.archive
                    - feature.delete
                    - feature.other
                    - experiment.create
                    - experiment.draft
                    - experiment.start
                    - experiment.stop
                    - experiment.targeting
                    - experiment.traffic
                    - experiment.phases
                    - experiment.visualEditor
                    - experiment.other
                    - savedGroup.create
                    - savedGroup.draft
                    - savedGroup.review
                    - savedGroup.publish
                    - savedGroup.archive
                    - savedGroup.delete
                    - savedGroup.other
                    - constant.create
                    - constant.draft
                    - constant.review
                    - constant.publish
                    - constant.archive
                    - constant.delete
                    - constant.other
                    - config.create
                    - config.draft
                    - config.review
                    - config.publish
                    - config.archive
                    - config.delete
                    - config.other
                    - rampSchedule.create
                    - rampSchedule.start
                    - rampSchedule.pause
                    - rampSchedule.progression
                    - rampSchedule.approve
                    - rampSchedule.edit
                    - rampSchedule.delete
                    - rampSchedule.other
                    - settings.approvals
                    - settings.other
                    - access.members
                    - access.teams
                    - customHook.create
                    - customHook.edit
                    - customHook.delete
                    - environment.create
                    - environment.edit
                    - environment.delete
                    - project.create
                    - project.edit
                    - project.delete
                    - attribute.create
                    - attribute.edit
                    - attribute.delete
                    - customField.create
                    - customField.edit
                    - customField.delete
                    - sdkConnection.create
                    - sdkConnection.edit
                    - sdkConnection.delete
                    - metric.create
                    - metric.edit
                    - metric.delete
                    - factTable.create
                    - factTable.edit
                    - factTable.delete
                    - segment.create
                    - segment.edit
                    - segment.delete
                    - dimension.create
                    - dimension.edit
                    - dimension.delete
                    - override.ignoreWarnings
                    - override.skipSchemaValidation
                    - override.skipHooks
                    - override.bypassApproval
                    - override.restBypassesReviews
                    - override.draftLimit
                    - override.skipChecklist
                    - override.bypassDuplicateKeyCheck
                    - other.write
                  environments:
                    type: array
                    items:
                      type: string
                required:
                - action
                - environments
                additionalProperties: false
            summary:
              type: string
            url:
              type: string
            expiresAt:
              type: string
            response:
              anyOf:
              - type: object
                properties:
                  status:
                    type: number
                  body: {}
                required:
                - status
                - body
                additionalProperties: false
              - type: 'null'
            note:
              anyOf:
              - type: string
              - type: 'null'
          required:
          - id
          - status
          - actions
          - summary
          - url
          - expiresAt
          - response
          - note
          additionalProperties: false
  parameters:
    limit:
      name: limit
      in: query
      description: The number of items to return
      schema:
        default: 10
        description: The number of items to return
        type: integer
        minimum: 1
        maximum: 100
    offset:
      name: offset
      in: query
      description: How many items to skip (use in conjunction with limit for pagination)
      schema:
        default: 0
        description: How many items to skip (use in conjunction with limit for pagination)
        type: integer
        minimum: 0
  responses:
    ConfirmationHeld:
      description: Held until a person confirms it in GrowthBook. Poll the Location until the confirmation completes.
      headers:
        Location:
          description: The confirmation to poll
          schema:
            type: string
        Retry-After:
          description: Seconds to wait before polling
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConfirmationHeld'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'If using Bearer auth, pass the Secret Key as the token:

        ```bash

        curl https://api.growthbook.io/api/v1/features   -H "Authorization: Bearer secret_abc123DEF456"

        ```

        '
    basicAuth:
      type: http
      scheme: basic
      description: 'If using HTTP Basic auth, pass the Secret Key as the username and leave the password blank:

        ```bash

        curl https://api.growthbook.io/api/v1/features   -u secret_abc123DEF456:

        # The ":" at the end stops curl from asking for a password

        ```

        '
x-tagGroups:
- name: Endpoints
  tags:
  - projects
