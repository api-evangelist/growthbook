- aid: growthbook:growthbook-config-revisions-api
  name: GrowthBook Config Revisions API
  description: >-
    **Beta** — these endpoints are new and may change in backwards-incompatible ways.


    Draft revisions for configs, including value and schema edits, schema import (JSON Schema / TypeScript
    / inferred), approvals, and lifecycle (publish, discard, revert). Publishing a schema change cascades
    the "base wins" normalization to descendant configs; a publish that removes or retypes fields descendants
    still use soft-blocks with a 422 unless the request body sets `ignoreWarnings: true`. Pass `version:
    "new"` on edit endpoints to auto-create a draft.
  humanURL: https://docs.growthbook.io/api
  baseURL: https://api.growthbook.io/api
  tags:
  - config-revisions
  properties:
  - type: OpenAPI
    url: openapi/growthbook-config-revisions-api-openapi.yml
  - type: Documentation
    url: https://docs.growthbook.io/api
- aid: growthbook:growthbook-configs-api
  name: GrowthBook Configs API
  description: >-
    **Beta** — these endpoints are new and may change in backwards-incompatible ways.


    Reusable, typed, inheritable JSON objects referenced from feature flag values as `@config:key`. A
    config carries a field `schema` (with TypeScript/JSON Schema import-export) and a lineage `parent`.
    Inheritance is expressed via `parent`, never an in-value `@config:` entry. Values layer as a **deep,
    targeted patch**: a child (or a config-backed feature value) restates only the leaves it changes and
    inherits the rest — unlike a constant's `$extends`, whose own keys replace wholesale. Schema fields
    colliding with a published ancestor's key follow 'base wins': identical re-declarations are stripped
    with a warning, differing ones are rejected.
  humanURL: https://docs.growthbook.io/api
  baseURL: https://api.growthbook.io/api
  tags:
  - configs
  properties:
  - type: OpenAPI
    url: openapi/growthbook-configs-api-openapi.yml
  - type: Documentation
    url: https://docs.growthbook.io/api
- aid: growthbook:growthbook-constant-revisions-api
  name: GrowthBook Constant Revisions API
  description: >-
    **Beta** — these endpoints are new and may change in backwards-incompatible ways.


    Draft revisions for constants, including pending changes, approvals, and lifecycle (publish, discard,
    revert). Pass `version: "new"` on edit endpoints to auto-create a draft.
  humanURL: https://docs.growthbook.io/api
  baseURL: https://api.growthbook.io/api
  tags:
  - constant-revisions
  properties:
  - type: OpenAPI
    url: openapi/growthbook-constant-revisions-api-openapi.yml
  - type: Documentation
    url: https://docs.growthbook.io/api
- aid: growthbook:growthbook-constants-api
  name: GrowthBook Constants API
  description: >-
    **Beta** — these endpoints are new and may change in backwards-incompatible ways.


    Reusable named values referenced from feature flag values as `@const:key` and resolved into the SDK
    payload at build time. String constants are interpolated via `{{ @const:key }}`; JSON (object) constants
    are composed via an `$extends` array. A constant's own keys **replace** what its `$extends` bases
    provide, wholesale — constants are atomic building blocks. (Config and feature values compose as deep,
    targeted patches instead.)
  humanURL: https://docs.growthbook.io/api
  baseURL: https://api.growthbook.io/api
  tags:
  - constants
  properties:
  - type: OpenAPI
    url: openapi/growthbook-constants-api-openapi.yml
  - type: Documentation
    url: https://docs.growthbook.io/api
