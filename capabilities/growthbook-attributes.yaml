naftiko: 1.0.0-alpha2
info:
  label: GrowthBook REST API — attributes
  description: 'GrowthBook REST API — attributes. 4 operations. Lead operation: Get the organization''s attributes. Self-contained
    Naftiko capability covering one Growthbook business surface.'
  tags:
  - Growthbook
  - attributes
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GROWTHBOOK_API_KEY: GROWTHBOOK_API_KEY
capability:
  consumes:
  - type: http
    namespace: growthbook-attributes
    baseUri: https://api.growthbook.io/api
    description: GrowthBook REST API — attributes business capability. Self-contained, no shared references.
    resources:
    - name: v1-attributes
      path: /v1/attributes
      operations:
      - name: listattributes
        method: GET
        description: Get the organization's attributes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: postattribute
        method: POST
        description: Create a new attribute
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v1-attributes-property
      path: /v1/attributes/{property}
      operations:
      - name: putattribute
        method: PUT
        description: Update an attribute
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deleteattribute
        method: DELETE
        description: Deletes a single attribute
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.GROWTHBOOK_API_KEY}}'
  exposes:
  - type: rest
    namespace: growthbook-attributes-rest
    port: 8080
    description: REST adapter for GrowthBook REST API — attributes. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/v1/attributes
      name: v1-attributes
      description: REST surface for v1-attributes.
      operations:
      - method: GET
        name: listattributes
        description: Get the organization's attributes
        call: growthbook-attributes.listattributes
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: postattribute
        description: Create a new attribute
        call: growthbook-attributes.postattribute
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/attributes/{property}
      name: v1-attributes-property
      description: REST surface for v1-attributes-property.
      operations:
      - method: PUT
        name: putattribute
        description: Update an attribute
        call: growthbook-attributes.putattribute
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteattribute
        description: Deletes a single attribute
        call: growthbook-attributes.deleteattribute
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: growthbook-attributes-mcp
    port: 9090
    transport: http
    description: MCP adapter for GrowthBook REST API — attributes. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-organization-s-attributes
      description: Get the organization's attributes
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: growthbook-attributes.listattributes
      outputParameters:
      - type: object
        mapping: $.
    - name: create-new-attribute
      description: Create a new attribute
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: growthbook-attributes.postattribute
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: update-attribute
      description: Update an attribute
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: growthbook-attributes.putattribute
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: deletes-single-attribute
      description: Deletes a single attribute
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: growthbook-attributes.deleteattribute
      outputParameters:
      - type: object
        mapping: $.
