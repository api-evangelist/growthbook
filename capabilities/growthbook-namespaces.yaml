    port: 9090
    transport: http
    description: MCP adapter for GrowthBook REST API — namespaces. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-all-namespaces
      description: Get all namespaces
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: growthbook-namespaces.listnamespaces
      outputParameters:
      - type: object
        mapping: $.
    - name: create-namespace
      description: Create a namespace
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: growthbook-namespaces.postnamespace
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-single-namespace
      description: Get a single namespace
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: growthbook-namespaces.getnamespace
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: update-namespace
      description: Update a namespace
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: growthbook-namespaces.putnamespace
      with:
        id: tools.id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-namespace
      description: Delete a namespace
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: growthbook-namespaces.deletenamespace
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: get-namespace-membership
      description: Get namespace membership
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: growthbook-namespaces.getnamespacememberships
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: rotate-namespace-seed
      description: Rotate namespace seed
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: growthbook-namespaces.postnamespacerotateseed
      with:
        id: tools.id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
