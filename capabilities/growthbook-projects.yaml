    namespace: growthbook-projects
    baseUri: https://api.growthbook.io/api
    description: GrowthBook REST API — projects business capability. Self-contained, no shared references.
    resources:
    - name: v1-projects
      path: /v1/projects
      operations:
      - name: listprojects
        method: GET
        description: Get all projects
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: postproject
        method: POST
        description: Create a single project
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v1-projects-id
      path: /v1/projects/{id}
      operations:
      - name: getproject
        method: GET
        description: Get a single project
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: putproject
        method: PUT
        description: Edit a single project
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deleteproject
        method: DELETE
        description: Deletes a single project
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.GROWTHBOOK_API_KEY}}'
  exposes:
  - type: rest
    namespace: growthbook-projects-rest
    port: 8080
    description: REST adapter for GrowthBook REST API — projects. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/v1/projects
      name: v1-projects
      description: REST surface for v1-projects.
      operations:
      - method: GET
        name: listprojects
        description: Get all projects
        call: growthbook-projects.listprojects
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: postproject
        description: Create a single project
        call: growthbook-projects.postproject
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/projects/{id}
      name: v1-projects-id
      description: REST surface for v1-projects-id.
      operations:
      - method: GET
        name: getproject
        description: Get a single project
        call: growthbook-projects.getproject
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: putproject
        description: Edit a single project
        call: growthbook-projects.putproject
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteproject
        description: Deletes a single project
        call: growthbook-projects.deleteproject
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: growthbook-projects-mcp
    port: 9090
    transport: http
    description: MCP adapter for GrowthBook REST API — projects. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: get-all-projects
      description: Get all projects
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: growthbook-projects.listprojects
      outputParameters:
      - type: object
        mapping: $.
    - name: create-single-project
      description: Create a single project
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: growthbook-projects.postproject
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-single-project
