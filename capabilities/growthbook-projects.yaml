      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: growthbook-projects.getproject
      outputParameters:
      - type: object
        mapping: $.
    - name: edit-single-project
      description: Edit a single project
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: growthbook-projects.putproject
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: deletes-single-project
      description: Deletes a single project
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: growthbook-projects.deleteproject
      outputParameters:
      - type: object
        mapping: $.
